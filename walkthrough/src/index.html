<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>YES statement review · InfoSlips</title>
    <meta name="description" content="InfoSlips walkthrough of the new interactive YES statement. Review each feature, vote, set a priority and see what everyone thinks." />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="referrer" content="same-origin" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0F172A" media="(prefers-color-scheme: dark)" />
    <meta name="generator" content="{{generator}}" />
    <!-- Applies the saved light/dark choice before first paint (external: the CSP forbids inline script). -->
    <script src="{{theme-boot.js}}"></script>
    <link rel="preload" href="assets/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="{{app.css}}" />
    <link rel="icon" href="assets/icons/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
  </head>
  <body>
    <a class="wt-skip" href="#main" data-skip>Skip to main content</a>

    <header class="wt-mast" id="wt-mast">
      <div class="wt-mast__inner">
        <a class="wt-mast__brand" href="#/start">
          <img class="wt-logo wt-logo--light" src="assets/brand/infoslips-logo-on-light.png" alt="InfoSlips" width="135" height="32" />
          <img class="wt-logo wt-logo--dark" src="assets/brand/infoslips-logo-white.png" alt="InfoSlips" width="136" height="32" />
          <span class="wt-mast__app">YES statement review</span>
        </a>

        <button class="wt-btn wt-btn--ghost wt-mast__menu-btn" id="wt-menu-btn" type="button" aria-expanded="false" aria-controls="wt-menu">
          <svg class="wt-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 7h16M4 12h16M4 17h16" /></svg>
          <span>Menu</span>
        </button>

        <div class="wt-mast__menu" id="wt-menu">
          <nav class="wt-nav" aria-label="Main">
            <ul class="wt-nav__list">
              <li><a class="wt-nav__link" href="#/tour" data-nav="tour">Walkthrough</a></li>
              <li><a class="wt-nav__link" href="#/results" data-nav="results">Results</a></li>
              <li><a class="wt-nav__link" href="#/data" data-nav="data">Data requirements</a></li>
            </ul>
          </nav>
          <div class="wt-mast__tools">
            <button class="wt-chip wt-reviewer-chip" id="wt-reviewer-chip" type="button" aria-haspopup="dialog">
              <svg class="wt-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="8" r="4" /><path d="M4 20c1.5-4 4.5-6 8-6s6.5 2 8 6" /></svg>
              <span class="wt-reviewer-chip__text">Add your name</span>
            </button>
            <button class="wt-theme-toggle" id="wt-theme-toggle" type="button" aria-pressed="false">
              <span class="wt-theme-toggle__track" aria-hidden="true">
                <svg class="wt-icon wt-theme-toggle__sun" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" /></svg>
                <svg class="wt-icon wt-theme-toggle__moon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z" /></svg>
                <span class="wt-theme-toggle__knob"></span>
              </span>
              <span class="wt-theme-toggle__label">Dark mode</span>
            </button>
          </div>
        </div>
      </div>
    </header>

    <main id="main" class="wt-main" tabindex="-1">
      <section id="view-start" class="wt-view" data-view="start"></section>
      <section id="view-tour" class="wt-view" data-view="tour" hidden></section>
      <section id="view-results" class="wt-view" data-view="results" hidden></section>
      <section id="view-data" class="wt-view" data-view="data" hidden></section>
      <section id="view-admin" class="wt-view" data-view="admin" hidden></section>
      <noscript>
        <div class="wt-container wt-noscript">
          <h1>YES statement review</h1>
          <p>This review needs JavaScript. Please turn it on and reload the page.</p>
          <p>You can still open <a href="https://salesdemo.infoslipscloud.com/assets/_templates/Crypto/Yes/index.html">the interactive YES statement</a> on its own.</p>
        </div>
      </noscript>
    </main>

    <footer class="wt-foot" id="wt-foot">
      <div class="wt-container wt-foot__inner">
        <img class="wt-foot__logo wt-logo--light" src="assets/brand/infoslips-logo-on-light.png" alt="" width="127" height="30" />
        <img class="wt-foot__logo wt-logo--dark" src="assets/brand/infoslips-logo-white.png" alt="" width="127" height="30" />
        <p class="wt-foot__text">Prepared by InfoSlips to showcase a possible new YES statement. All statement data is fictional.</p>
        <p class="wt-foot__links"><a class="wt-foot__admin" href="#/admin">Admin</a></p>
      </div>
    </footer>

    <div id="wt-live" class="wt-sr-only" aria-live="polite" aria-atomic="true"></div>
    <div id="wt-alert" class="wt-sr-only" aria-live="assertive" aria-atomic="true"></div>

    <script src="{{app.js}}"></script>
  </body>
</html>
