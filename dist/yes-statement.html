/* ---- css/00-tokens.css ---- */
/*
 * Design tokens. Brand slots ([YES_PRIMARY], [YES_ACCENT], [YES_FONT]) are set
 * at boot from YES.config.slots; every component reads roles, never raw hex.
 * Light and dark schemes are selected separately (not an automatic flip).
 */
:root {
  color-scheme: light;

  /* Brand slots (placeholders until YES assets are approved) */
  --yes-primary: var(--yes-primary-slot, #0e5a8a);
  --yes-accent: var(--yes-accent-slot, #e8a33d);
  --yes-font: var(--yes-font-slot, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif);

  /* Surfaces */
  --bg: #f5f6f8; /* page plane */
  --surface: #ffffff; /* cards, dialogs, chart surface */
  --surface-2: #f0f2f5; /* insets, table header, hover wash */
  --surface-3: #e6e9ee;
  --overlay: rgba(14, 22, 33, 0.48);

  /* Ink (all text tokens ≥ 4.5:1 on --surface and --surface-2) */
  --ink: #111820;
  --ink-2: #3f4a57;
  --muted: #5d6874;
  --on-primary: #ffffff;

  /* Lines */
  --line: #dde2e8;
  --line-strong: #b9c2cd;

  /* Interaction */
  --primary: var(--yes-primary);
  --primary-hover: color-mix(in srgb, var(--yes-primary) 86%, #000);
  --primary-wash: color-mix(in srgb, var(--yes-primary) 9%, var(--surface));
  --primary-ink: color-mix(in srgb, var(--yes-primary) 88%, #000); /* primary used as text */
  --accent: var(--yes-accent);
  --focus: #1a5fd0;
  --focus-ring: 0 0 0 3px var(--surface), 0 0 0 5px var(--focus);

  /* Data: direction (validated pair, ≥3:1 on surface). Marks only — text uses ink. */
  --in: #1d6fd6;
  --in-wash: #e3eefb;
  --out: #c2552b;
  --out-wash: #fbe9e1;
  --total: #3f4a57; /* opening / closing bars */
  --grid: #e6e9ee;
  --axis: #b9c2cd;

  /* Status (always paired with icon + label) */
  --ok: #0a7a35;
  --ok-wash: #e4f4ea;
  --warn: #8a5a00;
  --warn-wash: #fff3d6;
  --warn-line: #e0a100;
  --danger: #b42318;
  --danger-wash: #fdecea;
  --info: #1a5fd0;
  --info-wash: #e7effc;

  /* Demo / illustrative marking */
  --demo-ink: #4f3800;
  --demo-bg: #fff4d1;
  --demo-line: #d9a200;
  --ai: #5b3fbf; /* "Explain with AI" accent (border/icon) */
  --ai-wash: #f1edfc;

  /* Type scale */
  --fs-hero: clamp(2.6rem, 6vw + 1rem, 3.75rem);
  --fs-xl: clamp(1.5rem, 1.6vw + 1rem, 2rem);
  --fs-lg: 1.25rem;
  --fs-md: 1.0625rem;
  --fs-base: 1rem;
  --fs-sm: 0.875rem;
  --fs-xs: 0.8125rem;
  --lh: 1.5;

  /* Space (4px grid) */
  --s1: 4px;
  --s2: 8px;
  --s3: 12px;
  --s4: 16px;
  --s5: 20px;
  --s6: 24px;
  --s8: 32px;
  --s10: 40px;
  --s12: 48px;
  --s16: 64px;

  --radius-sm: 6px;
  --radius: 10px;
  --radius-lg: 16px;
  --shadow-1: 0 1px 2px rgba(17, 24, 32, 0.06), 0 1px 1px rgba(17, 24, 32, 0.04);
  --shadow-2: 0 6px 20px rgba(17, 24, 32, 0.1), 0 2px 6px rgba(17, 24, 32, 0.06);
  --shadow-3: 0 20px 48px rgba(17, 24, 32, 0.18);

  --container: 1120px;
  --gutter: 16px;
  --masthead-h: 112px;
  --drawer-w: 400px;

  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --dur: 220ms;
}

@media (min-width: 720px) {
  :root {
    --gutter: 24px;
  }
}

@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --yes-primary: var(--yes-primary-dark-slot, #6cb4ee);

    --bg: #0e1116;
    --surface: #161a21;
    --surface-2: #1d222b;
    --surface-3: #262c36;
    --overlay: rgba(0, 0, 0, 0.62);

    --ink: #f1f4f8;
    --ink-2: #c5ccd6;
    --muted: #a3acb8;
    --on-primary: #0b1220;

    --line: #2b323d;
    --line-strong: #46505e;

    --primary-hover: color-mix(in srgb, var(--yes-primary) 85%, #fff);
    --primary-wash: color-mix(in srgb, var(--yes-primary) 14%, var(--surface));
    --primary-ink: var(--yes-primary);
    --focus: #8ab4ff;

    --in: #4b94ea;
    --in-wash: #182a40;
    --out: #e0703f;
    --out-wash: #3a2219;
    --total: #aeb7c3;
    --grid: #262c36;
    --axis: #46505e;

    --ok: #4cc27a;
    --ok-wash: #15291e;
    --warn: #f0b84a;
    --warn-wash: #2f2512;
    --warn-line: #b58300;
    --danger: #ff8a7f;
    --danger-wash: #3a1d1b;
    --info: #8ab4ff;
    --info-wash: #17233a;

    --demo-ink: #ffd772;
    --demo-bg: #2e2510;
    --demo-line: #8f6c10;
    --ai: #b3a2f5;
    --ai-wash: #231d3b;

    --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.5);
    --shadow-2: 0 6px 20px rgba(0, 0, 0, 0.45);
    --shadow-3: 0 20px 48px rgba(0, 0, 0, 0.6);
  }
}

/* ---- css/01-base.css ---- */
/* Base: reset, typography, focus, motion, utilities. */
*,
*::before,
*::after {
  box-sizing: border-box;
}
html {
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
  scroll-padding-top: calc(var(--masthead-h) + var(--s4));
}
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--yes-font);
  font-size: var(--fs-base);
  line-height: var(--lh);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
  min-height: 100vh;
}
html.has-modal body {
  overflow: hidden;
}
h1,
h2,
h3,
h4 {
  line-height: 1.25;
  margin: 0 0 var(--s3);
  font-weight: 650;
  letter-spacing: -0.01em;
  color: var(--ink);
}
h1 {
  font-size: var(--fs-xl);
}
h2 {
  font-size: var(--fs-lg);
}
h3 {
  font-size: var(--fs-md);
}
h4 {
  font-size: var(--fs-base);
}
p {
  margin: 0 0 var(--s3);
}
a {
  color: var(--primary-ink);
  text-underline-offset: 2px;
}
a:hover {
  text-decoration-thickness: 2px;
}
img,
svg {
  max-width: 100%;
}
svg {
  flex-shrink: 0;
}
button,
input,
select,
textarea {
  font: inherit;
  color: inherit;
}
button {
  cursor: pointer;
}
button:disabled {
  cursor: not-allowed;
}
table {
  border-collapse: collapse;
  width: 100%;
}
[hidden] {
  display: none !important;
}
:focus {
  outline: none;
}
:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 2px;
  border-radius: 4px;
}
[tabindex='-1']:focus {
  outline: none;
}
[tabindex='-1']:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 4px;
}
::selection {
  background: color-mix(in srgb, var(--focus) 30%, transparent);
}
.tabular,
td.num,
th.num {
  font-variant-numeric: tabular-nums;
}
.sr-only {
  position: absolute !important;
  width: 1px !important;
  height: 1px !important;
  padding: 0 !important;
  margin: -1px !important;
  overflow: hidden !important;
  clip: rect(0, 0, 0, 0) !important;
  white-space: nowrap !important;
  border: 0 !important;
}
.skip-link {
  position: absolute;
  left: var(--s4);
  top: -100px;
  z-index: 1000;
  background: var(--surface);
  color: var(--ink);
  padding: var(--s3) var(--s4);
  border-radius: var(--radius);
  box-shadow: var(--shadow-2);
  font-weight: 600;
}
.skip-link:focus {
  top: var(--s3);
}
.container {
  width: 100%;
  max-width: var(--container);
  margin-inline: auto;
  padding-inline: var(--gutter);
}
.muted {
  color: var(--muted);
}
.small {
  font-size: var(--fs-sm);
}
.nowrap {
  white-space: nowrap;
}
.stack > * + * {
  margin-top: var(--s4);
}
.row {
  display: flex;
  flex-wrap: wrap;
  gap: var(--s3);
  align-items: center;
}
.spacer {
  flex: 1;
}
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;
  font-size: 0.92em;
  overflow-wrap: anywhere;
}

/* Motion: short, optional, never required. Disabled under reduced motion. */
@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
    scroll-behavior: auto !important;
  }
}
@keyframes yes-fade-up {
  from {
    opacity: 0;
    transform: translateY(8px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}
@keyframes yes-slide-in-right {
  from {
    transform: translateX(24px);
    opacity: 0;
  }
  to {
    transform: none;
    opacity: 1;
  }
}
@keyframes yes-highlight {
  from {
    background-color: var(--primary-wash);
  }
  to {
    background-color: transparent;
  }
}
.anim-in {
  animation: yes-fade-up var(--dur) var(--ease) both;
}

/* ---- css/02-components.css ---- */
/*
 * Shared component library. Feature modules compose these classes and add only
 * module-specific layout in their own stylesheet.
 */

/* ---------------------------------------------------------------- Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--s2);
  min-height: 44px;
  padding: 0 var(--s4);
  border-radius: 999px;
  border: 1px solid var(--line-strong);
  background: var(--surface);
  color: var(--ink);
  font-weight: 600;
  font-size: var(--fs-sm);
  line-height: 1.2;
  text-decoration: none;
  white-space: nowrap;
  transition: background-color var(--dur) var(--ease), border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
}
.btn:hover {
  background: var(--surface-2);
  border-color: var(--ink-2);
}
.btn:focus-visible {
  outline: none;
  box-shadow: var(--focus-ring);
}
.btn[disabled],
.btn[aria-disabled='true'] {
  opacity: 0.55;
  pointer-events: none;
}
.btn--primary {
  background: var(--primary);
  border-color: var(--primary);
  color: var(--on-primary);
}
.btn--primary:hover {
  background: var(--primary-hover);
  border-color: var(--primary-hover);
}
.btn--ghost {
  border-color: transparent;
  background: transparent;
}
.btn--ghost:hover {
  background: var(--surface-2);
  border-color: transparent;
}
.btn--sm {
  min-height: 36px;
  padding: 0 var(--s3);
  font-size: var(--fs-xs);
}
.btn--block {
  width: 100%;
}
/* Narrow screens: long (e.g. Spanish) labels wrap instead of overflowing. */
@media (max-width: 419px) {
  .btn:not(.btn--icon) {
    white-space: normal;
    text-align: center;
    padding-block: 6px;
  }
}
.btn--icon {
  width: 44px;
  padding: 0;
  border-radius: 50%;
}
.btn--icon.btn--sm {
  width: 36px;
}
.btn--ai {
  border-color: color-mix(in srgb, var(--ai) 55%, var(--line));
  color: var(--ink);
  background: var(--ai-wash);
}
.btn--ai .icon {
  color: var(--ai);
}
.btn--ai:hover {
  border-color: var(--ai);
  background: color-mix(in srgb, var(--ai) 14%, var(--surface));
}
.btn--link {
  border: 0;
  background: none;
  padding: 0;
  min-height: 0;
  color: var(--primary-ink);
  text-decoration: underline;
  text-underline-offset: 2px;
  border-radius: 2px;
  font-weight: 600;
}
.btn--link:hover {
  background: none;
  text-decoration-thickness: 2px;
}
.btn--danger {
  color: var(--danger);
  border-color: color-mix(in srgb, var(--danger) 45%, var(--line));
}

/* ------------------------------------------------------------------ Cards */
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-1);
  padding: var(--s5);
}
@media (min-width: 720px) {
  .card {
    padding: var(--s6);
  }
}
.card--flat {
  box-shadow: none;
}
.card--inset {
  background: var(--surface-2);
  border-color: transparent;
  box-shadow: none;
}
.card__title {
  display: flex;
  align-items: center;
  gap: var(--s2);
  margin-bottom: var(--s3);
}
.card__eyebrow {
  font-size: var(--fs-xs);
  font-weight: 650;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--muted);
  margin: 0 0 var(--s2);
}
.section {
  margin-block: var(--s8);
}
.section__head {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--s2) var(--s4);
  margin-bottom: var(--s4);
}
.view-title {
  font-size: var(--fs-xl);
  margin: var(--s6) 0 var(--s2);
}
.view-lede {
  color: var(--ink-2);
  max-width: 65ch;
  margin-bottom: var(--s6);
}

/* ------------------------------------------------------- Badges and tags */
.demo-badge {
  display: inline-flex;
  align-items: center;
  gap: var(--s1);
  padding: 2px 10px 2px 8px;
  border-radius: 999px;
  border: 1px solid var(--demo-line);
  background: var(--demo-bg);
  color: var(--demo-ink);
  font-size: var(--fs-xs);
  font-weight: 700;
  line-height: 1.6;
  white-space: nowrap;
}
.tag {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 1px 8px;
  border-radius: 999px;
  background: var(--surface-2);
  border: 1px solid var(--line);
  color: var(--ink-2);
  font-size: var(--fs-xs);
  font-weight: 600;
  line-height: 1.6;
  white-space: nowrap;
}
.tag--illustrative {
  background: var(--demo-bg);
  border-color: var(--demo-line);
  color: var(--demo-ink);
}
.tag--ai {
  background: var(--ai-wash);
  border-color: color-mix(in srgb, var(--ai) 45%, var(--line));
  color: var(--ink);
}
.tag--ai .icon {
  color: var(--ai);
}

/* Status chip: icon + label, never colour alone. */
.status {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: var(--fs-xs);
  font-weight: 650;
  padding: 1px 8px 1px 6px;
  border-radius: 999px;
  white-space: nowrap;
  line-height: 1.6;
}
.status--posted {
  color: var(--ok);
  background: var(--ok-wash);
}
.status--pending {
  color: var(--warn);
  background: var(--warn-wash);
  box-shadow: inset 0 0 0 1px var(--warn-line);
}
.status--failed {
  color: var(--danger);
  background: var(--danger-wash);
}
.status--unknown {
  color: var(--ink-2);
  background: var(--surface-2);
  box-shadow: inset 0 0 0 1px var(--line-strong);
}

/* Amounts: sign + icon/label carry direction; colour is supplementary. */
.amount {
  font-variant-numeric: tabular-nums;
  font-weight: 650;
  white-space: nowrap;
}
.amount--in {
  color: var(--ink);
}
.amount--out {
  color: var(--ink);
}
.dir {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  flex-shrink: 0;
}
.dir--in {
  background: var(--in-wash);
  color: var(--in);
}
.dir--out {
  background: var(--out-wash);
  color: var(--out);
}
.dir--neutral {
  background: var(--surface-2);
  color: var(--ink-2);
}

/* ---------------------------------------------------------------- Notices */
.notice {
  display: flex;
  gap: var(--s3);
  align-items: flex-start;
  padding: var(--s3) var(--s4);
  border-radius: var(--radius);
  border: 1px solid var(--line);
  background: var(--surface-2);
  color: var(--ink);
  font-size: var(--fs-sm);
}
.notice > .icon {
  margin-top: 2px;
}
.notice p:last-child {
  margin-bottom: 0;
}
.notice--info {
  background: var(--info-wash);
  border-color: color-mix(in srgb, var(--info) 35%, var(--line));
}
.notice--info > .icon {
  color: var(--info);
}
.notice--warn {
  background: var(--warn-wash);
  border-color: var(--warn-line);
}
.notice--warn > .icon {
  color: var(--warn);
}
.notice--critical {
  background: var(--danger-wash);
  border-color: color-mix(in srgb, var(--danger) 50%, var(--line));
}
.notice--critical > .icon {
  color: var(--danger);
}
.notice--illustrative {
  background: var(--demo-bg);
  border: 1px dashed var(--demo-line);
  color: var(--ink);
}
.notice--illustrative > .icon {
  color: var(--demo-ink);
}
.notice--ok {
  background: var(--ok-wash);
  border-color: color-mix(in srgb, var(--ok) 40%, var(--line));
}
.notice--ok > .icon {
  color: var(--ok);
}

/* ---------------------------------------------------- Key/value details */
.kv {
  display: grid;
  grid-template-columns: minmax(8rem, 40%) 1fr;
  gap: var(--s2) var(--s4);
  margin: 0;
  font-size: var(--fs-sm);
}
.kv dt {
  color: var(--muted);
}
.kv dd {
  margin: 0;
  color: var(--ink);
  overflow-wrap: anywhere;
}
@media (max-width: 419px) {
  .kv {
    grid-template-columns: 1fr;
    gap: 0;
  }
  .kv dd {
    margin-bottom: var(--s2);
  }
}

/* ---------------------------------------------------- Disclosure (details) */
.disclosure {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface);
}
.disclosure + .disclosure {
  margin-top: var(--s2);
}
.disclosure > summary {
  list-style: none;
  display: flex;
  align-items: center;
  gap: var(--s3);
  min-height: 48px;
  padding: var(--s3) var(--s4);
  cursor: pointer;
  font-weight: 600;
  border-radius: var(--radius);
}
.disclosure > summary::-webkit-details-marker {
  display: none;
}
.disclosure > summary::after {
  content: '';
  margin-left: auto;
  width: 10px;
  height: 10px;
  border-right: 2px solid var(--ink-2);
  border-bottom: 2px solid var(--ink-2);
  transform: rotate(45deg) translate(-2px, -2px);
  transition: transform var(--dur) var(--ease);
  flex-shrink: 0;
}
.disclosure[open] > summary::after {
  transform: rotate(225deg) translate(-2px, -2px);
}
.disclosure > summary:hover {
  background: var(--surface-2);
}
.disclosure > summary:focus-visible {
  outline: none;
  box-shadow: var(--focus-ring);
}
.disclosure__body {
  padding: 0 var(--s4) var(--s4);
  color: var(--ink-2);
  font-size: var(--fs-sm);
}

/* ------------------------------------------------------------------ Forms */
.field {
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-width: 0;
}
.field__label {
  font-size: var(--fs-sm);
  font-weight: 650;
  color: var(--ink);
}
.field__hint {
  font-size: var(--fs-xs);
  color: var(--muted);
}
.field__error {
  display: flex;
  gap: 6px;
  align-items: flex-start;
  font-size: var(--fs-sm);
  color: var(--danger);
  font-weight: 600;
}
.input,
.select,
.textarea {
  width: 100%;
  min-height: 44px;
  padding: 10px 12px;
  border: 1px solid var(--line-strong);
  border-radius: var(--radius-sm);
  background: var(--surface);
  color: var(--ink);
  font-size: var(--fs-base);
}
.textarea {
  min-height: 96px;
  resize: vertical;
}
.select {
  appearance: none;
  -webkit-appearance: none;
  padding-right: 36px;
  background-image: linear-gradient(45deg, transparent 50%, var(--ink-2) 50%), linear-gradient(135deg, var(--ink-2) 50%, transparent 50%);
  background-position: calc(100% - 18px) 55%, calc(100% - 13px) 55%;
  background-size: 5px 5px;
  background-repeat: no-repeat;
}
.input:focus-visible,
.select:focus-visible,
.textarea:focus-visible {
  outline: none;
  border-color: var(--focus);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 35%, transparent);
}
.input[aria-invalid='true'],
.select[aria-invalid='true'],
.textarea[aria-invalid='true'] {
  border-color: var(--danger);
  box-shadow: 0 0 0 1px var(--danger);
}
.input-icon {
  position: relative;
}
.input-icon > .icon {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--muted);
  pointer-events: none;
}
.input-icon > .input {
  padding-left: 40px;
}
fieldset {
  border: 0;
  padding: 0;
  margin: 0;
  min-width: 0;
}
legend {
  padding: 0;
  font-size: var(--fs-sm);
  font-weight: 650;
  margin-bottom: 6px;
}
.choice {
  display: flex;
  align-items: flex-start;
  gap: var(--s2);
  min-height: 44px;
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  background: var(--surface);
  cursor: pointer;
  font-size: var(--fs-sm);
}
.choice:hover {
  border-color: var(--line-strong);
  background: var(--surface-2);
}
.choice input {
  margin: 3px 0 0;
  width: 18px;
  height: 18px;
  accent-color: var(--primary);
  flex-shrink: 0;
}
.choice:has(input:checked) {
  border-color: var(--primary);
  background: var(--primary-wash);
}
.choice:has(input:focus-visible) {
  box-shadow: var(--focus-ring);
}
.choices {
  display: grid;
  gap: var(--s2);
}

/* Chips: removable active-filter tokens and toggle pills. */
.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 36px;
  padding: 0 6px 0 12px;
  border-radius: 999px;
  border: 1px solid color-mix(in srgb, var(--primary) 40%, var(--line));
  background: var(--primary-wash);
  color: var(--ink);
  font-size: var(--fs-sm);
  font-weight: 600;
}
.chip button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 28px;
  height: 28px;
  border: 0;
  border-radius: 50%;
  background: transparent;
  color: var(--ink-2);
}
.chip button:hover {
  background: color-mix(in srgb, var(--primary) 16%, transparent);
}
.pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 36px;
  padding: 0 12px;
  border-radius: 999px;
  border: 1px solid var(--line-strong);
  background: var(--surface);
  font-size: var(--fs-sm);
  font-weight: 600;
  color: var(--ink);
}
.pill[aria-pressed='true'] {
  background: var(--primary);
  border-color: var(--primary);
  color: var(--on-primary);
}

/* Segmented control (language switcher and similar). */
.seg {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  padding: 3px;
  border-radius: 999px;
  background: var(--surface-2);
  border: 1px solid var(--line);
}
.seg__icon {
  margin: 0 4px 0 6px;
  color: var(--muted);
}
.seg__btn {
  min-height: 36px;
  min-width: 44px;
  padding: 0 12px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  font-size: var(--fs-sm);
  font-weight: 600;
  color: var(--ink-2);
}
.seg__btn[aria-pressed='true'] {
  background: var(--surface);
  color: var(--ink);
  box-shadow: var(--shadow-1), inset 0 0 0 1px var(--line-strong);
}
.seg__btn:focus-visible {
  outline: none;
  box-shadow: var(--focus-ring);
}
.seg__short {
  display: none;
}

/* ------------------------------------------------------------------ Table */
.table-wrap {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
  background: var(--surface);
}
.table {
  font-size: var(--fs-sm);
}
.table caption {
  text-align: left;
  padding: var(--s3) var(--s4);
  font-weight: 650;
  color: var(--ink);
}
.table th,
.table td {
  padding: 10px var(--s4);
  text-align: left;
  vertical-align: middle;
  border-top: 1px solid var(--line);
}
.table thead th {
  background: var(--surface-2);
  font-size: var(--fs-xs);
  font-weight: 650;
  color: var(--ink-2);
  letter-spacing: 0.02em;
  border-top: 0;
  white-space: nowrap;
}
.table .num {
  text-align: right;
  white-space: nowrap;
}
.table tbody tr:hover {
  background: var(--surface-2);
}
.table tfoot td,
.table tfoot th {
  font-weight: 700;
  border-top: 2px solid var(--line-strong);
}

/* ------------------------------------------------------- Dialog and sheet */
dialog.dlg {
  padding: 0;
  border: 0;
  border-radius: var(--radius-lg);
  background: var(--surface);
  color: var(--ink);
  box-shadow: var(--shadow-3);
  width: min(640px, calc(100vw - 32px));
  max-height: min(88vh, 900px);
  overflow: hidden;
}
dialog.dlg[open] {
  display: flex;
  flex-direction: column;
  animation: yes-fade-up var(--dur) var(--ease);
}
dialog.dlg::backdrop {
  background: var(--overlay);
}
.dlg__head {
  display: flex;
  align-items: flex-start;
  gap: var(--s3);
  padding: var(--s4) var(--s4) var(--s3) var(--s5);
  border-bottom: 1px solid var(--line);
}
.dlg__title {
  font-size: var(--fs-lg);
  margin: 6px 0 0;
  flex: 1;
  min-width: 0;
}
.dlg__body {
  padding: var(--s5);
  overflow-y: auto;
  overscroll-behavior: contain;
  flex: 1;
}
.dlg__foot {
  display: flex;
  flex-wrap: wrap;
  gap: var(--s2);
  justify-content: flex-end;
  padding: var(--s3) var(--s5);
  border-top: 1px solid var(--line);
  background: var(--surface);
}
/* Small screens: dialogs become full-screen sheets. */
@media (max-width: 719px) {
  dialog.dlg {
    width: 100vw;
    max-width: 100vw;
    height: 100%;
    max-height: 100%;
    margin: 0;
    border-radius: 0;
  }
  .dlg__foot {
    justify-content: stretch;
  }
  .dlg__foot .btn {
    flex: 1;
  }
}

/* --------------------------------------------------------------- Steps */
.steps {
  display: flex;
  gap: var(--s2);
  list-style: none;
  margin: 0 0 var(--s5);
  padding: 0;
  font-size: var(--fs-xs);
  color: var(--muted);
}
.steps li {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.steps li::before {
  content: '';
  height: 4px;
  border-radius: 2px;
  background: var(--line);
}
.steps li[aria-current='step'] {
  color: var(--ink);
  font-weight: 650;
}
.steps li[aria-current='step']::before,
.steps li.is-done::before {
  background: var(--primary);
}

/* -------------------------------------------------------- Empty states */
.empty {
  text-align: center;
  padding: var(--s10) var(--s4);
  color: var(--ink-2);
}
.empty .icon {
  color: var(--muted);
  margin-bottom: var(--s2);
}
.empty h3 {
  margin-bottom: var(--s2);
}

/* ---------------------------------------------------------------- Toast */
.toast {
  position: fixed;
  left: 50%;
  bottom: var(--s6);
  transform: translate(-50%, 16px);
  background: var(--ink);
  color: var(--surface);
  padding: var(--s3) var(--s5);
  border-radius: 999px;
  font-size: var(--fs-sm);
  font-weight: 600;
  box-shadow: var(--shadow-2);
  opacity: 0;
  pointer-events: none;
  transition: opacity var(--dur) var(--ease), transform var(--dur) var(--ease);
  z-index: 2000;
  max-width: calc(100vw - 32px);
  text-align: center;
}
.toast.is-visible {
  opacity: 1;
  transform: translate(-50%, 0);
}

/* ------------------------------------------------------- Check lists */
.checks {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: var(--s2);
}
.check {
  display: flex;
  gap: var(--s2);
  align-items: flex-start;
  font-size: var(--fs-sm);
}
.check--ok .icon {
  color: var(--ok);
}
.check--fail .icon {
  color: var(--danger);
}
.check__state {
  margin-left: auto;
  font-weight: 650;
  font-size: var(--fs-xs);
  color: var(--ink-2);
  white-space: nowrap;
}

/* Highlight for search matches and linked rows. */
mark,
.hl {
  background: color-mix(in srgb, var(--accent) 38%, transparent);
  color: inherit;
  border-radius: 2px;
  padding: 0 1px;
}
.is-flash {
  animation: yes-highlight 1.6s var(--ease);
}

/* Forced colours: keep boundaries and states visible. */
@media (forced-colors: active) {
  .btn,
  .chip,
  .pill,
  .status,
  .tag,
  .demo-badge,
  .card,
  .notice {
    border: 1px solid CanvasText;
  }
  .pill[aria-pressed='true'],
  .seg__btn[aria-pressed='true'] {
    outline: 2px solid Highlight;
  }
}

/* ---- css/03-shell.css ---- */
/* Shell: masthead, navigation, views, footer, withheld state. */
.masthead {
  position: sticky;
  top: 0;
  z-index: 100;
  background: color-mix(in srgb, var(--surface) 94%, transparent);
  backdrop-filter: saturate(1.4) blur(8px);
  -webkit-backdrop-filter: saturate(1.4) blur(8px);
  border-bottom: 1px solid var(--line);
}
.masthead__bar {
  display: flex;
  align-items: center;
  gap: var(--s3);
  min-height: 60px;
  flex-wrap: wrap;
  padding-block: var(--s2);
}
.brand {
  display: inline-flex;
  align-items: center;
  gap: var(--s3);
  color: var(--ink);
  text-decoration: none;
  border-radius: var(--radius-sm);
  min-height: 44px;
}
.brand__logo {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 36px;
  min-width: 52px;
  padding: 0 10px;
  border-radius: 8px;
  background: var(--primary);
  color: var(--on-primary);
  font-weight: 800;
  letter-spacing: 0.04em;
  font-size: 1.05rem;
}
.brand__logo--placeholder {
  outline: 1px dashed color-mix(in srgb, var(--primary) 60%, transparent);
  outline-offset: 2px;
}
.brand__text {
  display: flex;
  flex-direction: column;
  line-height: 1.2;
}
.brand__title {
  font-weight: 700;
  font-size: var(--fs-sm);
}
.brand__period {
  font-size: var(--fs-xs);
  color: var(--muted);
}
.masthead__actions {
  display: flex;
  align-items: center;
  gap: var(--s2);
  margin-left: auto;
}
.btn--ask {
  min-height: 42px;
}
.nav {
  border-top: 1px solid var(--line);
}
.nav__list {
  display: flex;
  gap: var(--s1);
  list-style: none;
  margin-block: 0;
  overflow-x: auto;
  scrollbar-width: none;
}
.nav__list::-webkit-scrollbar {
  display: none;
}
.nav__link {
  display: inline-flex;
  align-items: center;
  min-height: 46px;
  padding: 0 var(--s3);
  color: var(--ink-2);
  font-weight: 600;
  font-size: var(--fs-sm);
  text-decoration: none;
  border-bottom: 3px solid transparent;
  white-space: nowrap;
  border-radius: 0;
}
.nav__link:hover {
  color: var(--ink);
  border-bottom-color: var(--line-strong);
}
.nav__link[aria-current='page'] {
  color: var(--ink);
  border-bottom-color: var(--primary);
}
.nav__link:focus-visible {
  outline-offset: -4px;
}

@media (max-width: 719px) {
  .masthead__bar {
    gap: var(--s2);
  }
  .demo-badge {
    order: 3;
    flex-basis: 100%;
    justify-content: center;
    margin-top: -2px;
  }
  .seg__long {
    display: none;
  }
  .seg__short {
    display: inline;
  }
  .seg__icon {
    display: none;
  }
  .btn--ask .btn__label {
    display: none;
  }
  .btn--ask {
    width: 44px;
    padding: 0;
    border-radius: 50%;
  }
  .nav__list {
    justify-content: space-between;
    gap: 0;
  }
  .nav__link {
    padding: 0 var(--s2);
  }
}
@media (max-width: 359px) {
  .brand__text {
    display: none;
  }
  .nav__link {
    padding: 0 6px;
    font-size: var(--fs-xs);
  }
}
/* Docked assistant narrows the content column: keep the masthead on one row. */
@media (min-width: 1100px) and (max-width: 1399px) {
  html.assistant-docked .seg__long {
    display: none;
  }
  html.assistant-docked .seg__short {
    display: inline;
  }
  html.assistant-docked .seg__icon {
    display: none;
  }
}

/* Views */
main {
  display: block;
  padding-bottom: var(--s16);
  min-height: 60vh;
}
main:focus {
  outline: none;
}
.view {
  animation: yes-fade-up var(--dur) var(--ease);
}

/* Assistant open on wide screens: content reflows so the drawer never covers it. */
@media (min-width: 1100px) {
  html.assistant-docked #app {
    padding-right: var(--drawer-w);
  }
}

/* Withheld (reconciliation failure) */
#integrity-root:empty {
  display: none;
}
html.is-withheld main,
html.is-withheld .masthead .nav,
html.is-withheld .btn--ask {
  display: none;
}
.withheld {
  padding-block: var(--s8);
  max-width: 760px;
}
.withheld__title {
  font-size: var(--fs-lg);
}
.withheld__checks-title {
  margin-top: var(--s6);
}

/* Footer */
.site-footer {
  border-top: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink-2);
  font-size: var(--fs-xs);
  padding-block: var(--s6) var(--s8);
}
.footer__inner p {
  max-width: 90ch;
}
.footer__demo {
  display: flex;
  gap: var(--s2);
  align-items: flex-start;
}
.footer__powered {
  color: var(--muted);
}

/* No-JS fallback summary */
.noscript-summary {
  max-width: 760px;
  margin: var(--s8) auto;
  padding: 0 var(--gutter);
}

/* ---- css/10-overview.css ---- */
/*
 * Overview: first screen, balance card, statement details, balance journey,
 * running-balance chart, fees, insight and the video placeholder.
 * Colours come from tokens only; chart marks use --in / --out / --total and
 * text always stays in ink tokens.
 */

/* ------------------------------------------------------------ Heading */
.ov-head {
  margin-bottom: var(--s5);
}
.ov-head .view-title {
  margin-bottom: var(--s3);
}
.ov-handshake {
  max-width: 68ch;
  margin: 0;
  color: var(--ink-2);
  font-size: var(--fs-md);
}

/* ------------------------------------------------------- Balance card */
.ov-balance__grid {
  display: grid;
  gap: var(--s5);
}
.ov-balance__title {
  font-size: var(--fs-sm);
  font-weight: 650;
  color: var(--ink-2);
  letter-spacing: 0.01em;
  margin: 0 0 var(--s1);
}
.ov-hero {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 0 var(--s3);
  margin: 0;
  line-height: 1.05;
}
.ov-hero__num {
  /* Hero figure: ≥48px, same sans, proportional figures. */
  font-size: clamp(3rem, 3.2vw + 2rem, 4rem);
  font-weight: 650;
  letter-spacing: -0.025em;
  font-variant-numeric: proportional-nums;
  color: var(--ink);
}
.ov-hero__sym {
  font-size: var(--fs-lg);
  font-weight: 650;
  color: var(--ink-2);
  letter-spacing: 0.02em;
}
.ov-hero__unit {
  margin: var(--s2) 0 var(--s3);
  color: var(--muted);
  font-size: var(--fs-sm);
}
.ov-asof {
  display: flex;
  align-items: flex-start;
  gap: 6px;
  margin: 0;
  color: var(--ink-2);
  font-size: var(--fs-sm);
}
.ov-asof .icon {
  margin-top: 2px;
  color: var(--muted);
}
.ov-fiat {
  margin-top: var(--s4);
  padding-top: var(--s3);
  border-top: 1px solid var(--line);
}
.ov-fiat__line {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--s1) var(--s2);
  margin: 0 0 var(--s1);
}
.ov-fiat__value {
  font-weight: 650;
  font-size: var(--fs-md);
}
.ov-fiat__label {
  color: var(--ink-2);
  font-size: var(--fs-sm);
}
.ov-fiat__meta {
  margin: 0;
  color: var(--muted);
  font-size: var(--fs-xs);
  max-width: 62ch;
}

.ov-change__label {
  margin: 0 0 var(--s1);
  font-size: var(--fs-sm);
  font-weight: 650;
  color: var(--ink-2);
}
.ov-change__value {
  display: flex;
  align-items: center;
  gap: var(--s2);
  margin: 0 0 var(--s1);
  font-size: var(--fs-xl);
  line-height: 1.2;
}
.ov-change__amount {
  font-variant-numeric: proportional-nums;
}
.ov-change__text {
  margin: 0;
  color: var(--ink-2);
  font-size: var(--fs-sm);
}
/* Long (e.g. Spanish) labels wrap inside the button instead of overflowing. */
.ov-actions .btn,
.ov-notin__actions .btn,
.ov-panel__actions .btn,
.ov-cardactions .btn,
.ov-exception .btn {
  max-width: 100%;
  white-space: normal;
  text-align: center;
  padding-block: 8px;
}
.ov-actions {
  display: flex;
  flex-wrap: wrap;
  gap: var(--s2);
  margin-top: var(--s5);
}
@media (max-width: 479px) {
  .ov-actions .btn {
    flex: 1 1 100%;
  }
}
@media (min-width: 720px) {
  .ov-balance__grid {
    grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr);
    gap: var(--s8);
    align-items: start;
  }
  .ov-balance__side {
    border-left: 1px solid var(--line);
    padding-left: var(--s8);
    align-self: stretch;
    display: flex;
    flex-direction: column;
  }
  .ov-balance__side .ov-actions {
    margin-top: auto;
    padding-top: var(--s5);
  }
}

/* Not-in-balance notice */
.ov-notin {
  margin-top: var(--s5);
}
.ov-notin__body {
  flex: 1;
  min-width: 0;
}
.ov-notin__text {
  margin-bottom: var(--s1);
}
.ov-notin__detail {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--s1) var(--s2);
  color: var(--ink-2);
  margin-bottom: var(--s2);
}
.ov-notin__actions {
  display: flex;
  flex-wrap: wrap;
  gap: var(--s2);
}

/* Statement details */
.ov-details {
  margin-top: var(--s4);
}
.ov-details > summary .icon {
  color: var(--muted);
}
.ov-details__grid {
  display: grid;
  gap: var(--s5);
  padding-top: var(--s2);
}
@media (min-width: 720px) {
  .ov-details__grid {
    grid-template-columns: 1fr 1fr;
    gap: var(--s8);
  }
}
.ov-details__title {
  font-size: var(--fs-xs);
  font-weight: 650;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--muted);
  margin: 0 0 var(--s2);
}
@media (min-width: 420px) {
  .ov-kv {
    grid-template-columns: minmax(0, 40%) minmax(0, 1fr);
  }
}
.ov-kv__note {
  display: block;
  color: var(--muted);
  font-size: var(--fs-xs);
}
.ov-masked {
  vertical-align: 1px;
}
.ov-details__mask {
  display: flex;
  gap: var(--s2);
  align-items: flex-start;
  margin: var(--s4) 0 0;
  padding-top: var(--s3);
  border-top: 1px solid var(--line);
  color: var(--ink-2);
}
.ov-details__mask .icon {
  margin-top: 2px;
  color: var(--muted);
}

/* ---------------------------------------------------- Section heads */
.ov-journey,
.ov-why {
  margin-top: var(--s6);
}
.ov-why {
  margin-top: var(--s10);
}
.ov-sechead {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  align-items: flex-end;
  gap: var(--s3) var(--s6);
  margin-bottom: var(--s5);
}
.ov-sechead h2 {
  margin-bottom: var(--s1);
}
.ov-sechead__text {
  min-width: 0;
  flex: 1 1 22rem;
}
.ov-sechead__aside {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: var(--s1);
}
@media (min-width: 900px) {
  .ov-sechead__aside {
    align-items: flex-end;
  }
}
.ov-sublede {
  margin: 0;
  color: var(--ink-2);
  max-width: 62ch;
}
.ov-unitnote {
  margin: 0;
  font-size: var(--fs-xs);
  color: var(--muted);
}
.ov-legend {
  display: flex;
  flex-wrap: wrap;
  gap: var(--s1) var(--s4);
  list-style: none;
  margin: 0;
  padding: 0;
  font-size: var(--fs-xs);
  color: var(--ink-2);
}
.ov-legend li {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.ov-key {
  display: inline-block;
  width: 10px;
  height: 10px;
  border-radius: 2px;
}
.ov-key--in {
  background: var(--in);
}
.ov-key--out {
  background: var(--out);
}
.ov-key--total {
  background: var(--total);
}

/* ------------------------------------------------- Balance journey */
/* Default (narrow): a compact, tappable list — one row per step with a
   horizontal mini-bridge showing the level it moves between. */
.jr {
  --plot-h: 196px;
  --bar-w: 24px;
  --gap: 8px;
  --pad: 12px;
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: 6px;
}
.jr-axis,
.jr-grid {
  display: none;
}
.jr-step {
  position: relative;
  display: grid;
  grid-template-columns: 6.75rem minmax(0, 1fr) auto;
  grid-template-areas:
    'label label value'
    'sub plot plot';
  align-items: center;
  gap: 6px var(--s3);
  width: 100%;
  min-height: 60px;
  margin: 0;
  padding: 10px var(--s3);
  border: 1px solid transparent;
  border-radius: var(--radius);
  background: transparent;
  color: var(--ink);
  font: inherit;
  text-align: left;
}
.jr-step--total {
  background: var(--surface-2);
}
.jr-step--delta {
  margin-left: var(--s4);
  width: calc(100% - var(--s4));
  border-color: var(--line);
  background: var(--surface);
}
button.jr-step {
  cursor: pointer;
  transition: background-color var(--dur) var(--ease), border-color var(--dur) var(--ease);
}
button.jr-step:hover {
  background: var(--surface-2);
  border-color: var(--line-strong);
}
.jr-meta {
  display: contents;
}
.jr-label {
  grid-area: label;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: var(--fs-sm);
  font-weight: 650;
  min-width: 0;
}
.jr-check {
  display: none;
  align-items: center;
  justify-content: center;
  flex: none;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: var(--primary);
  color: var(--on-primary);
}
.jr-check .icon {
  width: 12px;
  height: 12px;
  stroke-width: 2.6;
}
[aria-pressed='true'] .jr-check {
  display: inline-flex;
}
.jr-value {
  grid-area: value;
  display: inline-flex;
  align-items: center;
  justify-content: flex-end;
  gap: 6px;
  font-weight: 650;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.jr-dir {
  width: 24px;
  height: 24px;
}
.jr-sub {
  grid-area: sub;
  font-size: var(--fs-xs);
  color: var(--muted);
  white-space: nowrap;
}
.jr-plot {
  grid-area: plot;
  position: relative;
  display: block;
  height: 8px;
  border-radius: 4px;
  background: var(--surface-3);
}
.jr-step--total .jr-plot {
  background: var(--surface);
}
.jr-bar {
  position: absolute;
  top: 0;
  bottom: 0;
  left: var(--lo);
  width: max(3px, calc(var(--hi) - var(--lo)));
  border-radius: 4px;
  background: var(--total);
  transition: opacity var(--dur) var(--ease);
  transform-origin: left center;
}
.jr-step--in .jr-bar {
  background: var(--in);
}
.jr-step--out .jr-bar {
  background: var(--out);
  transform-origin: right center;
}
.jr-link {
  display: none;
}
@media (max-width: 399px) {
  .jr-step {
    grid-template-columns: 5.75rem minmax(0, 1fr) auto;
    padding-inline: 10px;
    column-gap: var(--s2);
  }
  .jr-step .jr-dir {
    display: none;
  }
}

/* Group headers (Incoming activity / Outgoing activity and fees) */
.jr-group {
  position: relative;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: center;
  gap: 2px var(--s3);
  width: 100%;
  min-height: 52px;
  margin: var(--s2) 0 0;
  padding: 8px var(--s3) 8px calc(var(--s3) + 2px);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface);
  color: var(--ink);
  font: inherit;
  text-align: left;
  cursor: pointer;
  transition: background-color var(--dur) var(--ease), border-color var(--dur) var(--ease);
}
.jr-group::before {
  content: '';
  position: absolute;
  left: -1px;
  top: -1px;
  bottom: -1px;
  width: 4px;
  border-radius: var(--radius) 0 0 var(--radius);
  background: var(--in);
}
.jr-group--out::before {
  background: var(--out);
}
.jr-group:hover {
  background: var(--surface-2);
  border-color: var(--line-strong);
}
.jr-group__text {
  display: contents;
}
.jr-group__label {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-weight: 700;
  font-size: var(--fs-sm);
}
.jr-group__value {
  grid-row: 1;
  grid-column: 2;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.jr-group__count {
  grid-column: 1 / -1;
  font-size: var(--fs-xs);
  color: var(--muted);
}
.jr-group__bracket {
  display: none;
}

/* Selection: wash + outline (shape, not only colour); others recede. */
.jr-step[aria-pressed='true'],
.jr-group[aria-pressed='true'] {
  background: color-mix(in srgb, var(--primary) 10%, var(--surface));
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}
.jr-step.is-member {
  background: color-mix(in srgb, var(--primary) 6%, var(--surface));
  border-color: color-mix(in srgb, var(--primary) 45%, var(--line));
}
.jr .is-dim .jr-bar {
  opacity: 0.3;
}
.jr-group.is-dim::before {
  opacity: 0.4;
}
.jr-step:focus-visible,
.jr-group:focus-visible {
  outline: none;
  box-shadow: var(--focus-ring);
}
.jr-step[aria-pressed='true']:focus-visible,
.jr-group[aria-pressed='true']:focus-visible {
  box-shadow: inset 0 0 0 1px var(--primary), var(--focus-ring);
}

/* The moment of delight: the selected step grows from its starting level. */
@keyframes jr-grow-x {
  from {
    transform: scaleX(0);
  }
  to {
    transform: scaleX(1);
  }
}
@keyframes jr-grow-y {
  from {
    transform: scaleY(0);
  }
  to {
    transform: scaleY(1);
  }
}
.jr-step.is-anim .jr-bar {
  animation: jr-grow-x 420ms var(--ease) both;
  animation-delay: calc(var(--i, 0) * 70ms);
}

/* Wide: a waterfall with floating delta bars, group brackets above. */
@media (min-width: 900px) {
  .jr {
    grid-template-columns: 3rem repeat(var(--cols), minmax(0, 1fr));
    column-gap: var(--gap);
    row-gap: 0;
    align-items: stretch;
  }
  .jr-axis {
    display: block;
    position: relative;
    grid-row: 2;
    grid-column: 1;
    align-self: start;
    height: var(--plot-h);
    margin-top: var(--pad);
  }
  .jr-axis__tick {
    position: absolute;
    right: 6px;
    bottom: var(--at);
    transform: translateY(50%);
    font-size: var(--fs-xs);
    line-height: 1;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .jr-grid {
    display: block;
    position: relative;
    grid-row: 2;
    grid-column: 2 / -1;
    align-self: start;
    height: var(--plot-h);
    margin-top: var(--pad);
    pointer-events: none;
  }
  .jr-grid__line {
    position: absolute;
    left: 0;
    right: 0;
    bottom: var(--at);
    border-top: 1px solid var(--grid);
  }
  .jr-grid__line--zero {
    border-top-color: var(--axis);
  }
  .jr-step {
    grid-row: 2;
    grid-column: var(--col);
    display: flex;
    flex-direction: column;
    align-items: stretch;
    width: auto;
    min-height: 0;
    margin: 0;
    padding: var(--pad) 0 var(--s3);
    text-align: center;
    z-index: 1;
    background: transparent;
  }
  .jr-step--total {
    background: transparent;
  }
  .jr-step--delta {
    margin-left: 0;
    width: auto;
    border-color: transparent;
    background: transparent;
  }
  button.jr-step:hover {
    background: color-mix(in srgb, var(--ink) 4%, transparent);
    border-color: transparent;
  }
  .jr-step[aria-pressed='true'] {
    background: color-mix(in srgb, var(--primary) 9%, transparent);
  }
  .jr-step.is-member {
    background: color-mix(in srgb, var(--primary) 5%, transparent);
    border-color: transparent;
  }
  .jr-plot {
    flex: none;
    height: var(--plot-h);
    background: none;
    border-radius: 0;
  }
  .jr-step--total .jr-plot {
    background: none;
  }
  .jr-bar {
    top: auto;
    left: calc(50% - var(--bar-w) / 2);
    width: var(--bar-w);
    bottom: var(--lo);
    height: max(3px, calc(var(--hi) - var(--lo)));
    border-radius: 3px;
    transform-origin: center bottom;
  }
  .jr-step--total .jr-bar {
    border-radius: 4px 4px 0 0;
  }
  .jr-step--out .jr-bar {
    transform-origin: center top;
  }
  .jr-step.is-anim .jr-bar {
    animation-name: jr-grow-y;
  }
  .jr-link {
    display: block;
    position: absolute;
    bottom: var(--end);
    left: calc(50% + var(--bar-w) / 2);
    width: calc(100% + var(--gap) - var(--bar-w));
    border-top: 1px solid var(--axis);
  }
  .jr-meta {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    padding: var(--s3) 6px 0;
    border-top: 1px solid var(--axis);
    margin-top: -1px;
  }
  .jr-label {
    font-size: var(--fs-xs);
    font-weight: 650;
    color: var(--ink-2);
    line-height: 1.3;
    min-height: 2.6em;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    overflow-wrap: anywhere;
    hyphens: auto;
  }
  .jr-value {
    font-size: var(--fs-base);
    gap: 4px;
  }
  .jr-dir {
    width: 20px;
    height: 20px;
  }
  .jr-dir .icon {
    width: 12px;
    height: 12px;
  }
  .jr-group {
    grid-row: 1;
    grid-column: var(--col) / span var(--span);
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 0;
    width: auto;
    min-height: 0;
    margin: 0 0 var(--s1);
    padding: var(--s2) var(--s2) 0;
    border: 1px solid transparent;
    background: transparent;
    text-align: center;
  }
  .jr-group::before {
    display: none;
  }
  .jr-group:hover {
    background: color-mix(in srgb, var(--ink) 4%, transparent);
    border-color: transparent;
  }
  .jr-group[aria-pressed='true'] {
    background: color-mix(in srgb, var(--primary) 9%, transparent);
    border-color: transparent;
    box-shadow: none;
  }
  .jr-group[aria-pressed='true'] .jr-group__bracket {
    border-width: 3px;
  }
  .jr-group[aria-pressed='true']:focus-visible {
    box-shadow: var(--focus-ring);
  }
  .jr-group__text {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: baseline;
    gap: 0 var(--s2);
  }
  .jr-group__label {
    font-size: var(--fs-sm);
  }
  .jr-group__count {
    font-weight: 400;
  }
  .jr-group__bracket {
    display: block;
    height: 10px;
    margin: var(--s2) calc(var(--bar-w) * 0.75) 0;
    border: 2px solid var(--in);
    border-bottom: 0;
    border-radius: 6px 6px 0 0;
    transition: opacity var(--dur) var(--ease);
  }
  .jr-group--out .jr-group__bracket {
    border-color: var(--out);
  }
  .jr-group.is-dim .jr-group__bracket {
    opacity: 0.35;
  }
}

/* -------------------------------------- Contributing-transactions panel */
.ov-panel-slot:empty {
  display: none;
}
.jr > .ov-panel-slot {
  margin-left: var(--s4);
}
.ov-panel {
  margin-top: var(--s2);
  padding: var(--s4);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  background: var(--surface-2);
}
@media (min-width: 720px) {
  .ov-panel {
    padding: var(--s5) var(--s6);
  }
}
@media (min-width: 900px) {
  .ov-journey__body > .ov-panel-slot .ov-panel {
    margin-top: var(--s4);
  }
}
@keyframes ov-reveal {
  from {
    opacity: 0;
    transform: translateY(-10px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}
.ov-panel.is-anim {
  animation: ov-reveal 360ms var(--ease) both;
  animation-delay: 80ms;
}
.ov-panel__head {
  margin-bottom: var(--s3);
}
.ov-panel__title {
  font-size: var(--fs-lg);
  margin: 0 0 var(--s1);
}
.ov-panel__meta {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 2px var(--s2);
  margin: 0;
  color: var(--ink-2);
  font-size: var(--fs-sm);
}
.ov-panel__meta .ov-num {
  font-weight: 650;
  color: var(--ink);
  font-variant-numeric: tabular-nums;
}
.ov-panel__empty {
  margin: var(--s3) 0;
  color: var(--ink-2);
}
.ov-txhead {
  display: none;
}
.ov-txlist {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 6px;
}
.ov-tx {
  display: grid;
  grid-template-columns: 32px minmax(0, 1fr) auto;
  grid-template-areas:
    'icon cp cp'
    'icon when amt';
  align-items: center;
  gap: 2px var(--s3);
  width: 100%;
  min-height: 56px;
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface);
  color: var(--ink);
  font: inherit;
  text-align: left;
  cursor: pointer;
  transition: border-color var(--dur) var(--ease), background-color var(--dur) var(--ease);
}
.ov-tx:hover {
  border-color: var(--line-strong);
  background: color-mix(in srgb, var(--surface-2) 40%, var(--surface));
}
.ov-tx:focus-visible {
  outline: none;
  box-shadow: var(--focus-ring);
}
.ov-tx__icon {
  grid-area: icon;
}
.ov-tx__cp {
  grid-area: cp;
  font-weight: 600;
  min-width: 0;
  overflow-wrap: break-word;
}
.ov-tx__amt {
  grid-area: amt;
  text-align: right;
}
.ov-tx__when {
  grid-area: when;
  min-width: 0;
  font-size: var(--fs-xs);
  color: var(--muted);
}
.ov-tx__type {
  color: var(--ink-2);
}
.ov-tx__go {
  display: none;
}
@media (max-width: 479px) {
  .ov-unit {
    display: none;
  }
  .ov-panel {
    padding: var(--s3);
  }
}
@media (max-width: 379px) {
  .ov-tx {
    grid-template-columns: minmax(0, 1fr) auto;
    grid-template-areas:
      'cp cp'
      'when amt';
  }
  .ov-tx__icon {
    display: none;
  }
  .jr > .ov-panel-slot {
    margin-left: 0;
  }
}
@media (min-width: 720px) {
  .ov-txhead,
  .ov-tx {
    grid-template-columns: 32px 8.5rem 6.5rem minmax(0, 1fr) auto 16px;
    grid-template-areas: 'icon date type cp amt go';
    column-gap: var(--s4);
  }
  .ov-txhead {
    display: grid;
    padding: 0 13px 6px;
    font-size: var(--fs-xs);
    font-weight: 650;
    color: var(--muted);
  }
  .ov-txhead__amt {
    text-align: right;
  }
  .ov-tx {
    min-height: 52px;
  }
  .ov-tx__when {
    display: contents;
  }
  .ov-tx__sep {
    display: none;
  }
  .ov-tx__date,
  .ov-tx__type {
    font-size: var(--fs-sm);
    color: var(--ink-2);
  }
  .ov-tx__date {
    grid-area: date;
  }
  .ov-tx__type {
    grid-area: type;
  }
  .ov-tx__go {
    display: inline-flex;
    grid-area: go;
    color: var(--muted);
  }
}

/* Sum line: the rows, added up, matching the step. */
.ov-sum {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: center;
  gap: var(--s1) var(--s4);
  margin-top: var(--s3);
  padding: var(--s3) 12px 0;
  border-top: 2px solid var(--line-strong);
}
.ov-sum__label {
  font-weight: 700;
}
.ov-sum__value {
  text-align: right;
  font-size: var(--fs-md);
}
.ov-sum__check {
  grid-column: 1 / -1;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: var(--fs-sm);
  color: var(--ink-2);
}
.ov-sum--ok .ov-sum__check .icon {
  color: var(--ok);
}
.ov-sum--bad .ov-sum__check .icon {
  color: var(--danger);
}
.ov-sum__math {
  grid-column: 1 / -1;
  font-size: var(--fs-xs);
  color: var(--muted);
  font-variant-numeric: tabular-nums;
  overflow-wrap: anywhere;
}
@media (min-width: 720px) {
  .ov-sum {
    padding-right: calc(12px + 16px + var(--s4));
  }
  .ov-sum__check,
  .ov-sum__math {
    grid-column: 1;
  }
  .ov-sum__math {
    grid-row: 2;
    grid-column: 2;
    text-align: right;
    max-width: 32rem;
  }
}
.ov-panel__actions {
  display: flex;
  flex-wrap: wrap;
  gap: var(--s2);
  margin-top: var(--s4);
}
@media (max-width: 479px) {
  .ov-panel__actions .btn {
    flex: 1 1 100%;
  }
}

/* Equation: the same arithmetic as text. */
.jr-eq {
  margin-top: var(--s5);
  padding-top: var(--s4);
  border-top: 1px solid var(--line);
}
.jr-eq__title {
  margin: 0 0 var(--s2);
  font-size: var(--fs-xs);
  font-weight: 650;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--muted);
}
.jr-eq__line {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-start;
  gap: var(--s2) var(--s5);
  margin: 0;
}
.jr-eq__term {
  display: inline-flex;
  flex-direction: column;
}
.jr-eq__num {
  font-weight: 650;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.jr-eq__lbl {
  font-size: var(--fs-xs);
  color: var(--muted);
}
.jr-eq__op {
  font-weight: 650;
  color: var(--ink-2);
  margin-right: 0.35em;
}
.jr-eq__term--total .jr-eq__num {
  font-weight: 800;
}

/* Table views */
.ov-tablebox {
  margin-top: var(--s4);
}
.ov-tablebox > summary .icon,
.ov-learn .icon {
  color: var(--muted);
}
.ov-table th[scope='row'] {
  font-weight: 600;
}
.ov-table .amount {
  font-weight: 600;
}
.ov-table__date {
  display: block;
  font-size: var(--fs-xs);
  font-weight: 400;
  color: var(--muted);
}
.ov-table__label {
  display: block;
}
.ov-table__sub {
  display: none;
  font-size: var(--fs-xs);
  font-weight: 400;
  color: var(--muted);
}
.ov-table__tx {
  display: inline-block;
  min-height: 24px;
  padding: 2px 0;
  text-align: left;
  white-space: normal;
  font-size: var(--fs-sm);
}
@media (max-width: 479px) {
  .ov-tablebox .disclosure__body {
    padding: 0 var(--s2) var(--s2);
  }
  .ov-table th,
  .ov-table td {
    padding: 8px;
  }
  .ov-table thead th,
  .ov-table thead th.num {
    white-space: normal;
  }
  .ov-table caption {
    padding: var(--s3) var(--s2);
  }
  /* Phones: the count joins the step cell instead of taking its own column. */
  .ov-table .ov-col-count {
    display: none;
  }
  .ov-table__sub {
    display: block;
  }
}

@media (max-width: 399px) {
  .ov-tablebox .disclosure__body {
    padding: 0 0 var(--s2);
  }
  .ov-tablebox .table-wrap {
    border-width: 1px 0 0;
    border-radius: 0;
  }
  .ov-table {
    font-size: var(--fs-xs);
  }
  .ov-table th,
  .ov-table td {
    padding: 8px 6px;
  }
  .ov-table th[scope='row'] {
    hyphens: auto;
    overflow-wrap: anywhere;
  }
}

.ov-exception {
  margin-top: var(--s2);
}

/* --------------------------------------------------- Why it changed */
.ov-why__grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: var(--s5);
}
.ov-chartcard {
  min-width: 0;
}
.ov-why__aside {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: var(--s5);
  align-items: start;
}
@media (min-width: 720px) {
  .ov-why__aside {
    grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr);
  }
}
.ov-cardhead {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: var(--s2) var(--s4);
  margin-bottom: var(--s1);
}
.ov-cardhead h3 {
  margin: 0;
}
.ov-cardlede {
  margin: 0;
  color: var(--ink-2);
  font-size: var(--fs-sm);
}
.ov-cardtitle {
  display: flex;
  align-items: center;
  gap: var(--s2);
  margin-bottom: var(--s3);
}
.ov-cardactions {
  display: flex;
  flex-wrap: wrap;
  gap: var(--s2);
  margin-top: var(--s4);
}

/* Running-balance chart */
.ov-chart {
  margin: var(--s4) 0 0;
}
.ov-chart .ov-legend {
  margin-bottom: var(--s2);
}
.ov-lkey {
  display: block;
}
.ov-lkey__line {
  stroke: var(--total);
  stroke-width: 2;
  stroke-linecap: round;
}
.ov-chart__plot {
  position: relative;
  width: 100%;
  cursor: crosshair;
  touch-action: pan-y;
}
.ov-chart__svg {
  display: block;
  max-width: none;
  overflow: visible;
}
.ov-chart__svg .c-grid {
  stroke: var(--grid);
  stroke-width: 1;
}
.ov-chart__svg .c-zero,
.ov-chart__svg .c-xtick {
  stroke: var(--axis);
  stroke-width: 1;
}
.ov-chart__svg text {
  fill: var(--muted);
  font-family: var(--yes-font);
  font-size: 12px;
  font-variant-numeric: tabular-nums;
}
.ov-chart__svg .c-end {
  fill: var(--ink-2);
  font-weight: 650;
}
.ov-chart__svg .c-area {
  fill: var(--total);
  opacity: 0.1;
}
.ov-chart__svg .c-line {
  fill: none;
  stroke: var(--total);
  stroke-width: 2;
  stroke-linejoin: round;
  stroke-linecap: round;
}
.ov-mk {
  stroke: var(--surface);
  stroke-width: 2;
  stroke-linejoin: round;
  paint-order: stroke;
  transform-box: fill-box;
  transform-origin: center;
  transition: transform 120ms var(--ease);
}
.ov-mk--in {
  fill: var(--in);
}
.ov-mk--out {
  fill: var(--out);
}
.ov-mk.is-active {
  transform: scale(1.45);
}
.ov-cross {
  position: absolute;
  width: 1px;
  margin-left: -0.5px;
  background: var(--line-strong);
  pointer-events: none;
}
.ov-pts {
  position: absolute;
  inset: 0;
  pointer-events: none;
}
.ov-pt {
  position: absolute;
  width: 28px;
  height: 28px;
  margin: -14px 0 0 -14px;
  padding: 0;
  border: 0;
  border-radius: 50%;
  background: transparent;
  pointer-events: auto;
  cursor: pointer;
  z-index: 2;
}
.ov-pt--minor {
  z-index: 1;
}
.ov-pt:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 0;
  border-radius: 50%;
}
.ov-tip {
  position: absolute;
  z-index: 3;
  min-width: 11rem;
  max-width: 16rem;
  padding: var(--s2) var(--s3);
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  background: var(--surface);
  box-shadow: var(--shadow-2);
  color: var(--ink-2);
  font-size: var(--fs-xs);
  line-height: 1.45;
  pointer-events: none;
}
.ov-tip p {
  margin: 0;
}
.ov-tip__value {
  font-size: var(--fs-base);
  font-weight: 700;
  color: var(--ink);
  font-variant-numeric: tabular-nums;
}
.ov-tip__label {
  color: var(--muted);
  margin-bottom: 4px !important;
}
.ov-tip__row {
  display: flex;
  align-items: center;
  gap: 6px;
  color: var(--ink);
}
.ov-tip__row strong {
  font-variant-numeric: tabular-nums;
}
.ov-tip__key {
  flex: none;
}
.ov-tip__hint {
  margin-top: 4px !important;
  padding-top: 4px;
  border-top: 1px solid var(--line);
  color: var(--muted);
}
.ov-chart__summary {
  margin-top: var(--s3);
  color: var(--ink-2);
  font-size: var(--fs-sm);
}
.ov-lowdata {
  margin-top: var(--s4);
}

/* Mini rows (fees, low-data list) */
.ov-minilist {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 6px;
}
.ov-lowlist {
  margin-top: var(--s3);
}
.ov-mini {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  grid-template-areas:
    'main amt'
    'date date';
  gap: 0 var(--s3);
  align-items: baseline;
  width: 100%;
  min-height: 48px;
  padding: 8px 12px;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  background: var(--surface);
  color: var(--ink);
  font: inherit;
  font-size: var(--fs-sm);
  text-align: left;
  cursor: pointer;
}
.ov-mini:hover {
  border-color: var(--line-strong);
}
.ov-mini:focus-visible {
  outline: none;
  box-shadow: var(--focus-ring);
}
.ov-mini__main {
  grid-area: main;
  min-width: 0;
}
.ov-mini__amt {
  grid-area: amt;
  text-align: right;
}
.ov-mini__date {
  grid-area: date;
  font-size: var(--fs-xs);
  color: var(--muted);
}

/* Fees */
.ov-fees__total {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 2px var(--s3);
  margin-bottom: var(--s3);
}
.ov-fees__label {
  width: 100%;
  font-size: var(--fs-sm);
  color: var(--ink-2);
  font-weight: 650;
}
.ov-fees__value {
  font-size: var(--fs-xl);
}
.ov-fees__value .amount {
  font-variant-numeric: proportional-nums;
}
.ov-fees__count {
  color: var(--ink-2);
  font-size: var(--fs-sm);
}
.ov-fees__note,
.ov-fees__foreign {
  margin: var(--s3) 0 0;
  font-size: var(--fs-xs);
  color: var(--ink-2);
}
.ov-fees__foreign {
  margin-top: var(--s1);
}
.ov-fees__foreignlist {
  margin: var(--s1) 0 0;
  padding-left: 1.2em;
  font-size: var(--fs-sm);
}

/* Insight */
.ov-insight__body {
  color: var(--ink-2);
  margin: 0;
}
.ov-learn {
  padding-inline: var(--s3);
}

/* ------------------------------------------------- Video placeholder */
.ov-video {
  margin-top: var(--s10);
  display: grid;
  gap: var(--s5);
  align-items: center;
}
@media (min-width: 720px) {
  .ov-video {
    grid-template-columns: minmax(0, 320px) minmax(0, 1fr);
    gap: var(--s6);
  }
}
.ov-video__poster {
  position: relative;
  aspect-ratio: 16 / 9;
  border-radius: var(--radius);
  overflow: hidden;
  background: var(--primary);
}
.ov-poster__svg,
.ov-poster__img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.ov-poster__bg {
  fill: var(--primary);
}
.ov-poster__glow {
  fill: var(--on-primary);
  opacity: 0.08;
}
.ov-poster__logo {
  fill: var(--on-primary);
}
.ov-poster__logotext {
  fill: var(--primary);
  font-family: var(--yes-font);
  font-size: 13px;
  font-weight: 800;
  letter-spacing: 0.04em;
}
.ov-poster__hello {
  fill: var(--on-primary);
  font-family: var(--yes-font);
  font-size: 21px;
  font-weight: 700;
}
.ov-poster__sub {
  fill: var(--on-primary);
  opacity: 0.88;
  font-family: var(--yes-font);
  font-size: 12px;
}
.ov-poster__bar {
  fill: var(--on-primary);
  opacity: 0.26;
}
.ov-poster__base {
  stroke: var(--on-primary);
  stroke-width: 1;
  opacity: 0.4;
}
.ov-video__play {
  position: absolute;
  left: 12px;
  bottom: 12px;
  display: inline-flex;
  align-items: center;
  gap: var(--s2);
  min-height: 44px;
  padding: 0 var(--s4) 0 6px;
  border: 0;
  border-radius: 999px;
  background: var(--surface);
  color: var(--ink);
  font-weight: 650;
  font-size: var(--fs-sm);
  box-shadow: var(--shadow-2);
  transition: transform var(--dur) var(--ease);
}
.ov-video__play:hover {
  transform: translateY(-1px);
}
.ov-video__play:focus-visible {
  outline: none;
  box-shadow: var(--shadow-2), var(--focus-ring);
}
.ov-video__playicon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: var(--primary);
  color: var(--on-primary);
}
.ov-video__playicon .icon {
  fill: currentColor;
  margin-left: 2px;
}
.ov-video__dur {
  position: absolute;
  right: 12px;
  bottom: 18px;
  padding: 2px 8px;
  border-radius: 999px;
  background: color-mix(in srgb, var(--ink) 78%, transparent);
  color: var(--surface);
  font-size: var(--fs-xs);
  font-weight: 650;
  font-variant-numeric: tabular-nums;
}
.ov-video__title {
  margin-bottom: var(--s2);
}
.ov-video__desc {
  color: var(--ink-2);
  max-width: 56ch;
}
.ov-video__meta {
  display: flex;
  flex-wrap: wrap;
  gap: var(--s1) var(--s4);
  list-style: none;
  margin: 0 0 var(--s3);
  padding: 0;
  font-size: var(--fs-sm);
  color: var(--ink-2);
}
.ov-video__meta li {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.ov-video__meta .icon {
  color: var(--muted);
}
.ov-video__ph {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--s1) var(--s2);
  margin: 0;
  font-size: var(--fs-xs);
  color: var(--ink-2);
}

/* Video storyboard dialog */
.ov-vdlg:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: -4px;
}
@media (min-width: 720px) {
  dialog.dlg--video {
    width: min(760px, calc(100vw - 32px));
  }
}
.ov-vdlg__h {
  font-size: var(--fs-md);
  margin: var(--s5) 0 var(--s3);
}
.ov-story {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: var(--s2);
}
.ov-story__frame {
  display: grid;
  grid-template-columns: 88px minmax(0, 1fr);
  gap: var(--s3);
  align-items: start;
  padding: var(--s3);
  border: 1px solid var(--line);
  border-radius: var(--radius);
}
.ov-story__thumb {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  aspect-ratio: 16 / 9;
  border-radius: var(--radius-sm);
  background: var(--primary-wash);
  color: var(--primary-ink);
}
.ov-story__n {
  position: absolute;
  left: 6px;
  top: 3px;
  font-size: var(--fs-xs);
  font-weight: 750;
}
.ov-story__time {
  margin: 0;
  font-size: var(--fs-xs);
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.ov-story__title {
  margin: 2px 0 4px;
  font-size: var(--fs-base);
}
.ov-story__screen {
  margin: 0;
  font-size: var(--fs-sm);
  color: var(--ink-2);
}
.ov-story__label {
  font-weight: 650;
  color: var(--ink);
}
.ov-vdlg__note {
  margin: var(--s2) 0 0;
  font-size: var(--fs-xs);
  color: var(--muted);
}
.ov-transcript p {
  display: grid;
  grid-template-columns: 2.75rem minmax(0, 1fr);
  gap: var(--s2);
  margin-bottom: var(--s2);
  font-size: var(--fs-sm);
}
.ov-transcript__time {
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.ov-req {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: var(--s2);
  font-size: var(--fs-sm);
}
.ov-req li {
  display: flex;
  gap: var(--s2);
  align-items: flex-start;
}
.ov-req .icon {
  margin-top: 2px;
  color: var(--ok);
}

/* Motion is optional: nothing here may move under reduced motion. */
@media (prefers-reduced-motion: reduce) {
  .jr-step.is-anim .jr-bar,
  .ov-panel.is-anim {
    animation: none;
  }
  .ov-mk,
  .jr-bar,
  .ov-video__play {
    transition: none;
  }
}

/* Forced colours: keep the bridge and chart marks visible. */
@media (forced-colors: active) {
  .jr-bar,
  .ov-key,
  .jr-group::before {
    forced-color-adjust: none;
    background: CanvasText;
  }
  .jr-step--in .jr-bar,
  .ov-key--in {
    background: Highlight;
  }
  .jr-step[aria-pressed='true'],
  .jr-group[aria-pressed='true'] {
    outline: 3px solid Highlight;
  }
  .ov-mk,
  .ov-chart__svg .c-line {
    forced-color-adjust: none;
  }
}

/* ---- css/20-explorer.css ---- */
/*
 * Explorer — Transactions view: search bar, filter panel, active-filter chips,
 * results (desktop table / mobile cards), transaction detail dialog, export.
 * Composes the shared components; only module layout lives here.
 */

/* ------------------------------------------------------------ Header */
.tx-head .view-lede {
  margin-bottom: var(--s5);
}
.tx-head .view-lede strong {
  font-weight: 650;
  color: var(--ink);
}

/* ------------------------------------------------- Search + toolbar */
.tx-bar {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-start;
  gap: var(--s3) var(--s4);
  margin-bottom: var(--s5);
}
.tx-search {
  flex: 1 1 100%;
}
.tx-search__box {
  position: relative;
}
.tx-search__box > .input {
  padding-right: 48px;
}
.tx-search__box > .input::-webkit-search-cancel-button {
  -webkit-appearance: none;
  appearance: none;
}
.tx-search__clear {
  position: absolute;
  right: 2px;
  top: 50%;
  transform: translateY(-50%);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 40px;
  height: 40px;
  border: 0;
  border-radius: 50%;
  background: transparent;
  color: var(--ink-2);
}
.tx-search__clear:hover {
  background: var(--surface-2);
  color: var(--ink);
}
.tx-search__clear:focus-visible {
  outline: none;
  box-shadow: var(--focus-ring);
}
.tx-bar__tools {
  display: flex;
  flex: 1 1 100%;
  align-items: flex-end;
  gap: var(--s3);
  min-width: 0;
}
.tx-sort {
  flex: 1 1 12rem;
  min-width: 0;
}
.tx-sort .select {
  text-overflow: ellipsis;
}
.tx-filter-toggle {
  flex: 0 0 auto;
  border-radius: var(--radius-sm);
}
.tx-filter-toggle__chev {
  transition: transform var(--dur) var(--ease);
}
.tx-filter-toggle[aria-expanded='true'] .tx-filter-toggle__chev {
  transform: rotate(180deg);
}
@media (max-width: 400px) {
  .tx-filter-toggle__chev {
    display: none;
  }
  .tx-filter-toggle {
    padding: 0 var(--s3);
  }
}
.tx-filter-toggle[aria-expanded='true'] {
  border-color: var(--primary);
  background: var(--primary-wash);
}
.tx-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 22px;
  height: 22px;
  padding: 0 6px;
  border-radius: 999px;
  background: var(--primary);
  color: var(--on-primary);
  font-size: var(--fs-xs);
  font-weight: 700;
  font-variant-numeric: tabular-nums;
}

/* ------------------------------------------------------------ Layout */
.tx-layout {
  display: grid;
  gap: var(--s5);
  align-items: start;
}
.tx-main {
  min-width: 0;
}

/* ----------------------------------------------------- Filter panel */
.tx-filters {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-1);
  padding: var(--s4) var(--s5) var(--s5);
}
.tx-filters__title {
  display: flex;
  align-items: center;
  gap: var(--s2);
  font-size: var(--fs-md);
  margin: 0 0 var(--s3);
}
.tx-filters__title .icon {
  color: var(--muted);
}
.tx-filters__form {
  display: grid;
  gap: 0;
}
.tx-fs {
  padding-block: var(--s4);
  border-top: 1px solid var(--line);
}
.tx-fs__legend {
  float: left; /* lets the fieldset padding apply above the legend consistently */
  width: 100%;
  margin-bottom: var(--s2);
  font-size: var(--fs-sm);
  font-weight: 650;
  color: var(--ink);
}
.tx-fs__legend + * {
  clear: both;
}
.tx-fs__hint {
  clear: both;
  margin: 0 0 var(--s2);
}
.tx-fs .field__error {
  margin: var(--s2) 0 0;
}
.tx-pair {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(128px, 1fr));
  gap: var(--s3);
}
.tx-sublabel {
  font-weight: 600;
  color: var(--ink-2);
  font-size: var(--fs-xs);
}
.tx-date-input {
  min-width: 0;
}

/* Checkbox rows */
.tx-checks {
  display: grid;
  gap: 2px;
  margin-inline: calc(var(--s2) * -1);
}
.tx-check {
  display: flex;
  align-items: center;
  gap: var(--s3);
  min-height: 44px;
  padding: 0 var(--s2);
  border-radius: var(--radius-sm);
  font-size: var(--fs-sm);
  cursor: pointer;
}
.tx-check:hover {
  background: var(--surface-2);
}
.tx-check input {
  width: 18px;
  height: 18px;
  margin: 0;
  accent-color: var(--primary);
  flex-shrink: 0;
}
.tx-check:has(input:focus-visible) {
  box-shadow: var(--focus-ring);
}
.tx-check:has(input:checked) .tx-check__label {
  font-weight: 650;
}
.tx-check__n {
  margin-left: auto;
  min-width: 24px;
  padding: 0 6px;
  border-radius: 999px;
  background: var(--surface-2);
  color: var(--ink-2);
  font-size: var(--fs-xs);
  font-variant-numeric: tabular-nums;
  text-align: center;
}

.tx-check__icon {
  color: var(--muted);
  margin-left: -4px;
}
.tx-check--radio input {
  accent-color: var(--primary);
}

.tx-filters__foot {
  display: flex;
  flex-wrap: wrap;
  gap: var(--s2);
  padding-top: var(--s4);
  border-top: 1px solid var(--line);
}
.tx-filters__foot .btn--primary {
  flex: 1 1 auto;
}

/* Collapsible below the desktop breakpoint; always visible as a sidebar above it. */
@media (max-width: 1023px) {
  .tx-filters[data-open='false'] {
    display: none;
  }
  .tx-filters {
    animation: yes-fade-up var(--dur) var(--ease);
  }
}
@media (min-width: 600px) and (max-width: 1023px) {
  .tx-sort {
    flex: 0 1 320px;
    margin-left: auto;
  }
  .tx-filters__form {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    column-gap: var(--s6);
  }
}
@media (min-width: 1024px) {
  .tx-bar {
    flex-wrap: nowrap;
  }
  .tx-search {
    flex: 1 1 auto;
  }
  .tx-bar__tools {
    flex: 0 0 auto;
    width: 272px;
  }
  .tx-filter-toggle,
  .tx-filters__foot {
    display: none;
  }
  .tx-layout {
    grid-template-columns: 264px minmax(0, 1fr);
    gap: var(--s6);
  }
  .tx-check {
    min-height: 36px;
  }
  .tx-fs:last-child {
    padding-bottom: 0;
  }
}

/* ------------------------------------------------------ Active chips */
.tx-chips-wrap:empty {
  display: none;
}
.tx-chips {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--s2);
  margin-bottom: var(--s4);
}
.tx-chips__label {
  font-size: var(--fs-xs);
  font-weight: 650;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--muted);
  margin-right: var(--s1);
}
.tx-chips__list {
  display: flex;
  flex-wrap: wrap;
  gap: var(--s2);
  list-style: none;
  margin: 0;
  padding: 0;
  min-width: 0;
}
.tx-chips__list li {
  min-width: 0;
  max-width: 100%;
}
.tx-chip {
  max-width: 100%;
  min-height: 36px;
  padding: 0 6px 0 12px;
  cursor: pointer;
  text-align: left;
}
.tx-chip__label {
  overflow-wrap: anywhere;
  padding-block: 6px;
}
.tx-chip__x {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  color: var(--ink-2);
  flex-shrink: 0;
}
.tx-chip:hover .tx-chip__x {
  background: color-mix(in srgb, var(--primary) 16%, transparent);
  color: var(--ink);
}
.tx-chip:focus-visible {
  outline: none;
  box-shadow: var(--focus-ring);
}
.tx-chips__clear {
  min-height: 36px;
}
.tx-chips__back {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 36px;
  padding: 0 var(--s2);
  font-size: var(--fs-sm);
  font-weight: 600;
  border-radius: var(--radius-sm);
}
@media (max-width: 1023px) {
  .tx-chip,
  .tx-chips__clear,
  .tx-chips__back {
    min-height: 44px;
  }
}

/* ---------------------------------------------------- Results header */
.tx-results__head {
  margin-bottom: var(--s3);
}
.tx-results__count {
  font-size: var(--fs-lg);
  margin: 0 0 var(--s1);
}
.tx-results__count,
.tx-chips-wrap {
  /* Added to the page's scroll-padding so the sticky masthead never covers them. */
  scroll-margin-top: var(--s8);
}
.tx-total {
  margin: 0;
  color: var(--ink-2);
  font-size: var(--fs-sm);
}
.tx-total strong .amount {
  color: var(--ink);
}
.tx-pending-note,
.tx-basis-note {
  display: flex;
  align-items: flex-start;
  gap: 6px;
  margin: var(--s2) 0 0;
  font-size: var(--fs-sm);
  color: var(--ink-2);
}
.tx-pending-note .icon {
  color: var(--warn);
  margin-top: 2px;
}
.tx-basis-note .icon {
  color: var(--info);
  margin-top: 2px;
}
.tx-caption {
  font-size: var(--fs-xs) !important;
  font-weight: 500 !important;
  color: var(--muted) !important;
}
.tx-caption--cards {
  margin: 0 0 var(--s2);
}

/* ------------------------------------------------------ Shared row bits */
.tx-dir {
  width: 34px;
  height: 34px;
}
.tx-open {
  display: inline;
  padding: 2px 0;
  margin: 0;
  border: 0;
  background: none;
  color: var(--ink);
  font: inherit;
  font-weight: 650;
  text-align: left;
  line-height: 1.35;
  border-radius: 3px;
  cursor: pointer;
}
.tx-open:hover {
  color: var(--primary-ink);
  text-decoration: underline;
  text-underline-offset: 2px;
}
.tx-open:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 2px;
}
.tx-sub {
  display: block;
  color: var(--ink-2);
  font-size: var(--fs-xs);
  margin-top: 2px;
  overflow-wrap: anywhere;
}
.tx-memo {
  font-style: italic;
}
.tx-notin {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  margin-top: 4px;
  font-size: var(--fs-xs);
  font-weight: 650;
  color: var(--warn);
}
.tx-match {
  display: flex;
  align-items: flex-start;
  gap: 4px;
  margin: 6px 0 0;
  font-size: var(--fs-xs);
  color: var(--ink-2);
}
.tx-match .icon {
  margin-top: 2px;
  color: var(--muted);
}
.tx-match__label {
  font-weight: 650;
}
.tx-match__value {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;
  overflow-wrap: anywhere;
}
.tx-prev {
  margin-top: 4px;
  font-size: 0.75rem;
}

/* ---------------------------------------------------- Desktop table */
.tx-table-wrap {
  box-shadow: var(--shadow-1);
  overflow-x: auto; /* fallback only: the layout is sized so the table fits */
}
.tx-table caption.tx-caption {
  padding: var(--s3) var(--s4);
  border-bottom: 1px solid var(--line);
  background: var(--surface);
}
.tx-table th,
.tx-table td {
  padding: 12px var(--s3);
  vertical-align: top;
}
.tx-table th:first-child,
.tx-table td:first-child {
  padding-left: var(--s4);
}
.tx-table th:last-child,
.tx-table td:last-child {
  padding-right: var(--s4);
}
.tx-table thead th {
  vertical-align: bottom;
}
.tx-row {
  cursor: pointer;
}
.tx-row:hover .tx-open {
  color: var(--primary-ink);
}
.tx-row--pending {
  background: color-mix(in srgb, var(--warn-wash) 55%, var(--surface));
}
.tx-row--pending td:first-child {
  box-shadow: inset 3px 0 0 var(--warn-line);
}
.tx-date {
  width: 6.5rem;
}
.tx-date__day {
  display: block;
  font-weight: 650;
  white-space: nowrap;
}
.tx-date__time {
  display: block;
  color: var(--muted);
  font-size: var(--fs-xs);
}
.tx-desc {
  display: flex;
  align-items: flex-start;
  gap: var(--s3);
  min-width: 10rem;
}
.tx-desc__text {
  min-width: 0;
}
.tx-status {
  white-space: nowrap;
}
.tx-amount,
.tx-balance {
  font-variant-numeric: tabular-nums;
}
.tx-balance {
  color: var(--ink-2);
}
.tx-table .amount {
  font-size: var(--fs-base);
}
.tx-type-inline {
  font-weight: 650;
  color: var(--ink);
}

/* ------------------------------------------------------ Mobile cards */
.tx-cards {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: var(--s2);
}
.tx-card {
  position: relative;
  display: grid;
  grid-template-columns: 32px minmax(0, 1fr);
  gap: var(--s3);
  padding: var(--s3) var(--s4) var(--s3) var(--s3);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow-1);
}
.tx-card:hover {
  border-color: var(--line-strong);
}
.tx-card:has(.tx-open:focus-visible) {
  box-shadow: var(--focus-ring);
}
.tx-card .tx-open {
  display: block;
  margin-top: 2px;
}
.tx-card > .tx-dir {
  width: 32px;
  height: 32px;
  margin-top: 2px;
}
.tx-card .tx-open::after {
  /* The whole card is the touch target; the real control is this button. */
  content: '';
  position: absolute;
  inset: 0;
  border-radius: inherit;
}
.tx-card .tx-open:focus-visible {
  outline: none;
}
.tx-card__body {
  min-width: 0;
}
.tx-card__top {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  justify-content: space-between;
  gap: 0 var(--s2);
}
.tx-card__meta {
  font-size: var(--fs-xs);
  color: var(--muted);
}
.tx-card__type {
  font-weight: 650;
  color: var(--ink-2);
}
.tx-card__amount {
  font-size: var(--fs-md);
  margin-left: auto;
}
.tx-card .tx-open {
  font-size: 0.9375rem;
}
.tx-card__foot {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--s1) var(--s2);
  margin-top: var(--s2);
}
.tx-card__foot .tx-notin {
  margin-top: 0;
}
.tx-card__bal {
  font-size: var(--fs-xs);
  color: var(--ink-2);
  font-variant-numeric: tabular-nums;
}
.tx-card--pending {
  background: color-mix(in srgb, var(--warn-wash) 55%, var(--surface));
  border-color: var(--warn-line);
  border-style: dashed;
}
@media (max-width: 359px) {
  .tx-card {
    grid-template-columns: minmax(0, 1fr);
    padding: var(--s3) var(--s4);
  }
  .tx-card > .tx-dir {
    display: none;
  }
  .tx-card__amount {
    font-size: var(--fs-base);
  }
}

/* Rows arriving from a journey step slide in (skipped under reduced motion). */
@media (prefers-reduced-motion: no-preference) {
  .tx-cards.is-entering > .tx-card {
    animation: yes-fade-up 320ms var(--ease) both;
    animation-delay: calc(var(--i, 0) * 28ms);
  }
  .tx-table-wrap.is-entering tbody tr {
    animation: yes-fade-up 320ms var(--ease) both;
  }
}

/* -------------------------------------------------------- Empty state */
.tx-empty {
  background: var(--surface);
  border: 1px dashed var(--line-strong);
  border-radius: var(--radius-lg);
  padding: var(--s8) var(--s5);
}
.tx-empty__applied {
  color: var(--ink);
  font-weight: 600;
  max-width: 52ch;
  margin-inline: auto;
  overflow-wrap: anywhere;
}
.tx-empty__hint {
  max-width: 52ch;
  margin-inline: auto;
  margin-bottom: var(--s5);
}

/* ------------------------------------------------------------- Export */
.tx-export {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: var(--s4) var(--s6);
  margin-top: var(--s8);
}
.tx-export__text {
  flex: 1 1 22rem;
  min-width: 0;
}
.tx-export__title {
  display: flex;
  align-items: center;
  gap: var(--s2);
  font-size: var(--fs-md);
  margin-bottom: var(--s1);
}
.tx-export__title .icon {
  color: var(--muted);
}
.tx-export__body {
  margin: 0;
  font-size: var(--fs-sm);
  color: var(--ink-2);
  max-width: 62ch;
}
.tx-export__actions {
  display: flex;
  flex-wrap: wrap;
  gap: var(--s2);
}
@media (max-width: 719px) {
  .tx-export__actions {
    flex-direction: column;
    width: 100%;
  }
  .tx-export__actions .btn {
    width: 100%;
    white-space: normal;
    text-align: center;
  }
}

/* ------------------------------------------------- Detail dialog */
@media (min-width: 720px) {
  dialog.dlg--tx {
    width: min(680px, calc(100vw - 32px));
  }
}
.tx-dlg__head {
  align-items: center;
}
.tx-dlg__head > .tx-dir {
  width: 40px;
  height: 40px;
}
.tx-dlg__headtext {
  flex: 1;
  min-width: 0;
}
.tx-dlg__eyebrow {
  margin: 0;
  font-size: var(--fs-xs);
  font-weight: 650;
  color: var(--muted);
  letter-spacing: 0.02em;
}
.tx-dlg__headtext .dlg__title {
  margin: 2px 0 0;
}
.tx-dlg__close {
  flex-shrink: 0;
}
.tx-dlg__hero {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--s1) var(--s4);
