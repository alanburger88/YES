  /** The same arithmetic as text: labelled terms, a plain equation and a spoken sentence. */
  function equationHtml() {
    var steps = YES.calc.journey();
    var first = steps[0];
    var last = steps[steps.length - 1];
    var plainEq = plain(first.value);
    var spoken = t('cat.opening') + ' ' + YES.fmt.amountSpoken(first.value);
    var terms = '<span class="jr-eq__term"><span class="jr-eq__num">' + esc(plain(first.value)) + '</span><span class="jr-eq__lbl">' + esc(t('cat.opening')) + '</span></span>';
    steps.slice(1, -1).forEach(function (s) {
      var op = s.value < 0 ? YES.fmt.MINUS : '+';
      plainEq += ' ' + op + ' ' + num(s.value);
      spoken += ', ' + t(s.value < 0 ? 'fmt.minus' : 'fmt.plus') + ' ' + t('cat.' + s.id) + ' ' + YES.fmt.amount(Math.abs(s.value), { sign: 'never' });
      terms +=
        '<span class="jr-eq__term"><span class="jr-eq__num"><span class="jr-eq__op">' +
        esc(op) +
        '</span>' +
        esc(num(s.value)) +
        '</span><span class="jr-eq__lbl">' +
        esc(t('cat.' + s.id)) +
        '</span></span>';
    });
    var closing = plain(last.value) + ' ' + sym();
    plainEq += ' = ' + closing;
    spoken += ', ' + t('overview.journey.equals') + ' ' + t('cat.closing') + ' ' + YES.fmt.amountSpoken(last.value) + '.';
    terms +=
      '<span class="jr-eq__term jr-eq__term--total"><span class="jr-eq__num"><span class="jr-eq__op">=</span>' +
      esc(closing) +
      '</span><span class="jr-eq__lbl">' +
      esc(t('cat.closing')) +
      '</span></span>';
    return (
      '<div class="jr-eq" data-equation="' +
      esc(plainEq) +
      '">' +
      '<p class="jr-eq__title">' +
      esc(t('overview.journey.eqTitle')) +
      '</p>' +
      '<p class="jr-eq__line" aria-hidden="true">' +
      terms +
      '</p>' +
      '<p class="sr-only">' +

  /** Reflect YES.state.journeyStep in place (keeps transitions), then redraw the panel. */
  function syncJourney() {
    var body = doc.getElementById('ov-journey-body');
    if (!body) return;
    var jr = body.querySelector('.jr');
    if (!jr) return;
    var anim = pendingAnim && !ui.reducedMotion();
    pendingAnim = false;
    var info = selectionInfo(YES.state.journeyStep);
    jr.classList.toggle('has-selection', !!info);
    ui.$$('[data-ov-step]', jr).forEach(function (b) {
      b.setAttribute('aria-pressed', String(!!info && info.id === b.getAttribute('data-ov-step')));
    });
    ui.$$('.jr-step', jr).forEach(function (el) {
      var id = el.getAttribute('data-step');
      var member = !!info && info.members.indexOf(id) !== -1;
      el.classList.toggle('is-selected', member && info.id === id);
      el.classList.toggle('is-member', member && info.id !== id);
      el.classList.toggle('is-dim', !!info && !member);
      el.classList.remove('is-anim');
    });
    ui.$$('.jr-group', jr).forEach(function (el) {
      var gid = el.getAttribute('data-group');
      var cats = (YES.calc.groups()[gid] || { categories: [] }).categories;
      var related =
        !!info &&
        (info.id === gid ||
          info.members.some(function (m) {
            return cats.indexOf(m) !== -1;
          }));
      el.classList.toggle('is-dim', !!info && !related);
    });
    placePanel(info);
    var slot = doc.getElementById('ov-panel');
    ui.render(slot, panelHtml(info));
    if (anim && info) {
      info.members.forEach(function (id, i) {
        var el = jr.querySelector('.jr-step[data-step="' + id + '"]');
        if (!el) return;
        void el.offsetWidth; // restart the keyframes on an element that stays in place
        el.style.setProperty('--i', i);
        el.classList.add('is-anim');
      });
      var panel = slot.firstElementChild;
      if (panel) panel.classList.add('is-anim');
    }
  }

  /** Move the panel slot next to the selection on narrow screens, below the journey on wide ones. */
  function placePanel(info) {
    var slot = doc.getElementById('ov-panel');
    var body = doc.getElementById('ov-journey-body');
    if (!slot || !body) return;
    var jr = body.querySelector('.jr');
    var anchorId = panelAnchorId(info === undefined ? selectionInfo(YES.state.journeyStep) : info);
    var anchor = anchorId ? jr.querySelector('.jr-step[data-step="' + anchorId + '"]') : null;
    if (anchor) {
      if (anchor.nextElementSibling !== slot) anchor.parentNode.insertBefore(slot, anchor.nextSibling);
    } else if (slot.parentNode !== body || slot.previousElementSibling !== jr) {
      body.insertBefore(slot, jr.nextSibling);
    }
  }

  /** Scroll just enough to show the panel without hiding the control that opened it. */
  function reveal(el, keepVisible) {
    if (!el || !el.getBoundingClientRect) return;
    var r = el.getBoundingClientRect();
    var vh = root.innerHeight || doc.documentElement.clientHeight;
    var mast = doc.getElementById('masthead');
    var topLimit = (mast ? mast.getBoundingClientRect().bottom : 0) + 12;
    var keepTop = keepVisible ? keepVisible.getBoundingClientRect().top : r.top;
    var delta = 0;
    if (r.bottom > vh - 12) delta = Math.min(r.bottom - vh + 12, keepTop - topLimit);
    else if (r.top < topLimit) delta = r.top - topLimit;
    if (Math.abs(delta) > 1 && root.scrollBy) root.scrollBy({ top: delta, behavior: ui.reducedMotion() ? 'auto' : 'smooth' });
  }

  function select(id, opts) {
    opts = opts || {};
    var info = selectionInfo(id);
    if (!info) return false;
    pendingAnim = true;
    if (opts.navigate && YES.state.view !== 'overview') YES.nav.go('overview', { param: id, focus: false });
    YES.set({ journeyStep: id });
    pendingAnim = false;
    if (YES.state.view === 'overview') YES.nav.setParam(id);
    ui.announce(
      t('overview.journey.selected', {
        label: info.label,
        count: YES.txCount(rowsFor(info.txIds).length),
        amount: YES.fmt.amountSpoken(info.value, { sign: 'always' })
      })
    );
    var panel = doc.getElementById('ov-panel-section');
    if (panel) {
      if (opts.focusPanel) {
        var h = doc.getElementById('ov-panel-title');
        if (h) h.focus({ preventScroll: true });
        reveal(panel, panel);
      } else {
        reveal(panel, opts.trigger || null);
      }
    }
    return true;
  }

  function clearSelection(opts) {
    var prev = YES.state.journeyStep;
    if (!prev) return;
    YES.set({ journeyStep: null });
    if (YES.state.view === 'overview') YES.nav.setParam(null);
    ui.announce(t('overview.journey.cleared'));
    if (opts && opts.returnFocus) ui.focusKey('ov-step-' + prev);
  }

  /* ------------------------------------------------------------------ */
  /* 4. Why it changed: running balance, fees, insight                   */
  /* ------------------------------------------------------------------ */
  function triPath(x, y, up, s) {
    s = s || 1;
    var h = 6 * s;
    var w = 5.5 * s;
    var b = 4 * s;
    return up
      ? 'M' + x + ' ' + (y - h) + 'L' + (x + w) + ' ' + (y + b) + 'L' + (x - w) + ' ' + (y + b) + 'Z'
      : 'M' + x + ' ' + (y + h) + 'L' + (x + w) + ' ' + (y - b) + 'L' + (x - w) + ' ' + (y - b) + 'Z';
  }
  function r1(v) {
    return Math.round(v * 10) / 10;
  }

  function pointLabel(p) {
    return t('overview.chart.point', {
      date: YES.fmt.date(p.iso, 'datetime'),
      type: ui.typeLabel(p.tx.type),
      amount: YES.fmt.amountSpoken(p.delta, { sign: 'always' }),
      counterparty: YES.L(p.tx.counterparty),
      balance: YES.fmt.amountSpoken(p.balance)
    });
  }

  /** The SVG chart plus its keyboard/pointer layer, drawn at the host's pixel width. */
  function plotInner(width) {
    var s = st();
    var running = YES.calc.running();
    var byId = {};
    YES.calc.posted().forEach(function (tx) {
      byId[tx.id] = tx;
    });
    var W = Math.max(240, Math.round(width));
    var compact = W < 560;
    var H = compact ? 230 : 270;
    var m = { l: compact ? 46 : 54, r: 14, t: 26, b: 32 };
    var x0 = Date.parse(s.periodStart);
    var x1 = Date.parse(s.periodEnd);
    var lo = Math.min(0, s.opening);
    var hi = s.opening;
    running.forEach(function (p) {
      lo = Math.min(lo, p.balance);
      hi = Math.max(hi, p.balance);
    });
    var tk = ticks(lo, hi, compact ? 3 : 4);
    var y0 = tk[0];
    var y1 = tk[tk.length - 1];
    var pw = W - m.l - m.r;
    var ph = H - m.t - m.b;
    function X(ms) {
      return r1(m.l + ((ms - x0) / (x1 - x0)) * pw);
    }
    function Y(v) {
      return r1(m.t + (1 - (v - y0) / (y1 - y0)) * ph);
    }
    var svg = [];
    tk.forEach(function (v) {
      var y = Y(v);
      svg.push('<line class="' + (v === 0 ? 'c-zero' : 'c-grid') + '" x1="' + m.l + '" x2="' + (W - m.r) + '" y1="' + y + '" y2="' + y + '"/>');
      svg.push('<text class="c-tick" x="' + (m.l - 8) + '" y="' + y + '" text-anchor="end" dominant-baseline="middle">' + esc(tickLabel(v)) + '</text>');
    });
    var DAY = 86400000;
    for (var d = 0; x0 + d * DAY <= x1; d += 7) {
      var ms = x0 + d * DAY;
      var x = X(ms);
      svg.push('<line class="c-xtick" x1="' + x + '" x2="' + x + '" y1="' + (H - m.b) + '" y2="' + (H - m.b + 4) + '"/>');
      svg.push('<text class="c-tick" x="' + x + '" y="' + (H - m.b + 19) + '" text-anchor="middle">' + esc(YES.fmt.date(new Date(ms).toISOString(), 'short')) + '</text>');
    }
    chart.pts = [];
    chart.xs = [];
    chart.ys = [];
    var path = 'M' + X(x0) + ' ' + Y(s.opening);
    running.forEach(function (p) {
      var px = X(Date.parse(p.at));
      var py = Y(p.balance);
      path += 'H' + px + 'V' + py;
      chart.pts.push({ id: p.txId, at: Date.parse(p.at), iso: p.at, balance: p.balance, delta: p.delta, tx: byId[p.txId] });
      chart.xs.push(px);
      chart.ys.push(py);
    });
    path += 'H' + X(x1);
    var base = Y(Math.min(Math.max(0, y0), y1));
    svg.push('<path class="c-area" d="' + path + 'V' + base + 'H' + X(x0) + 'Z"/>');
    svg.push('<path class="c-line" d="' + path + '"/>');
    chart.pts.forEach(function (p, i) {
      svg.push('<path class="ov-mk ov-mk--' + (p.delta < 0 ? 'out' : 'in') + '" data-i="' + i + '" d="' + triPath(chart.xs[i], chart.ys[i], p.delta >= 0) + '"/>');
    });
    var endBalance = running.length ? running[running.length - 1].balance : s.opening;
    svg.push('<text class="c-end" x="' + (W - m.r) + '" y="' + (Y(endBalance) - 12) + '" text-anchor="end">' + esc(plain(endBalance)) + '</text>');

    chart.w = W;
    if (chart.focusIdx >= chart.pts.length) chart.focusIdx = 0;
    var points = chart.pts
      .map(function (p, i) {
        return (
          '<button type="button" class="ov-pt' +
          (p.tx.type === 'fee' ? ' ov-pt--minor' : '') +
          '" data-ov-pt="' +
          i +
          '" data-ov-tx="' +
          esc(p.id) +
          '" data-fk="ov-pt-' +
          esc(p.id) +
          '" tabindex="' +
          (i === chart.focusIdx ? '0' : '-1') +
          '" style="left:' +
          chart.xs[i] +
          'px;top:' +
          chart.ys[i] +
          'px" aria-label="' +
          esc(pointLabel(p)) +
          '"></button>'
        );
      })
      .join('');
    return (
      '<svg class="ov-chart__svg" width="' +
      W +
      '" height="' +
      H +
      '" viewBox="0 0 ' +
      W +
      ' ' +
      H +
      '" aria-hidden="true" focusable="false">' +
      svg.join('') +
      '</svg>' +
      '<div class="ov-cross" aria-hidden="true" hidden style="top:' +
      m.t +
      'px;height:' +
      ph +
      'px"></div>' +
      '<div class="ov-pts" role="group" aria-label="' +
      esc(t('overview.chart.pointsLabel')) +
      '">' +
      points +
      '</div>' +
      '<div class="ov-tip" aria-hidden="true" hidden></div>'
    );
  }

  function renderPlot() {
    var host = doc.getElementById('ov-chart-plot');

    chart.lastW = w;

  function chartSummary() {
    var s = st();
    var running = YES.calc.running();
    var best = { v: s.opening, at: s.periodStart };
    var worst = { v: s.opening, at: s.periodStart };
    running.forEach(function (p) {
      if (p.balance > best.v) best = { v: p.balance, at: p.at };
      if (p.balance < worst.v) worst = { v: p.balance, at: p.at };
    });
    var end = running.length ? running[running.length - 1].balance : s.opening;
    return t('overview.chart.summary', {
      max: amt(best.v),
      maxDate: YES.fmt.date(best.at, 'long'),
      min: amt(worst.v),
      minDate: YES.fmt.date(worst.at, 'long'),
      closing: amt(end)
    });
  }

  function showTip(i) {
    var host = plotHost();
    if (!host || !chart.pts[i]) return;
    var tip = host.querySelector('.ov-tip');
    var cross = host.querySelector('.ov-cross');
    if (!tip || !cross) return;
    tip.innerHTML = tipHtml(i);
    tip.hidden = false;
    cross.hidden = false;
    var x = chart.xs[i];
    var y = chart.ys[i];
    cross.style.left = x + 'px';
    var tw = tip.offsetWidth;
    var th = tip.offsetHeight;
    var left = Math.max(0, Math.min(chart.w - tw, x - tw / 2));
    var top = y - th - 16;
    if (top < 0) top = y + 16;
    tip.style.left = left + 'px';
    tip.style.top = top + 'px';
    ui.$$('.ov-mk', host).forEach(function (mk) {
      mk.classList.toggle('is-active', mk.getAttribute('data-i') === String(i));
    });
  }

  function hideTip() {
    var host = plotHost();
    if (!host) return;
    var tip = host.querySelector('.ov-tip');
    var cross = host.querySelector('.ov-cross');
    if (tip) tip.hidden = true;
    if (cross) cross.hidden = true;
    ui.$$('.ov-mk.is-active', host).forEach(function (mk) {
      mk.classList.remove('is-active');
    });
  }

  function pointFocused() {
    var a = doc.activeElement;
    return !!(a && a.closest && a.closest('[data-ov-pt]'));
  }

  /** Nearest point by x; among same-time points prefer the movement over its fee, then the closest y. */
  function nearestAt(clientX, clientY) {
    var host = plotHost();
    if (!host || !chart.pts.length) return -1;
    var r = host.getBoundingClientRect();
    var px = clientX - r.left;
    var py = clientY - r.top;
    var best = -1;
    var bdx = Infinity;
    for (var i = 0; i < chart.xs.length; i++) {
      var dx = Math.abs(chart.xs[i] - px);
      if (best === -1 || dx < bdx - 0.5) {
        best = i;
        bdx = dx;
      } else if (Math.abs(dx - bdx) <= 0.5) {
        var feeI = chart.pts[i].tx.type === 'fee';
        var feeB = chart.pts[best].tx.type === 'fee';
        if ((feeB && !feeI) || (feeB === feeI && Math.abs(chart.ys[i] - py) < Math.abs(chart.ys[best] - py))) {
          best = i;
          bdx = dx;
        }
      }
    }
    return best;
  }

  function pointButton(i) {
    var host = plotHost();
    return host ? host.querySelector('[data-ov-pt="' + i + '"]') : null;
  }

  function setRoving(i) {
    chart.focusIdx = i;
    var host = plotHost();
    if (!host) return;
    ui.$$('[data-ov-pt]', host).forEach(function (b) {
      b.setAttribute('tabindex', b.getAttribute('data-ov-pt') === String(i) ? '0' : '-1');
    });
  }

  function onPointKey(e, b) {
    var i = +b.getAttribute('data-ov-pt');
    var n = chart.pts.length;
    var j = null;
    switch (e.key) {
      case 'ArrowRight':
      case 'ArrowDown':
        j = Math.min(n - 1, i + 1);
        break;
      case 'ArrowLeft':
      case 'ArrowUp':
        j = Math.max(0, i - 1);
        break;
      case 'Home':
        j = 0;
        break;
      case 'End':
        j = n - 1;
        break;
      case 'Escape':
        hideTip();
        return;
      default:
        return;
    }
    e.preventDefault();
    setRoving(j);
    var next = pointButton(j);
    if (next) next.focus();
  }

    init: function () {
      var el = doc.getElementById('overview-root');
      var dlg = doc.getElementById('video-dialog');
      if (!el) return;

      // Journey: steps and groups are toggles.
      ui.delegate(el, 'click', '[data-ov-step]', function (e, b) {
        var id = b.getAttribute('data-ov-step');
        if (YES.state.journeyStep === id) clearSelection({ returnFocus: false });
        else select(id, { trigger: b });
      });
      ui.delegate(el, 'click', '[data-ov-clear]', function () {
        clearSelection({ returnFocus: true });
      });
      ui.delegate(el, 'click', '[data-ov-show]', function (e, b) {
        showInTransactions({ step: b.getAttribute('data-ov-show') });
      });
      ui.delegate(el, 'click', '[data-ov-explore]', function () {
        showInTransactions({});
      });
      ui.delegate(el, 'click', '[data-ov-select]', function (e, b) {
        YES.overview.selectStep(b.getAttribute('data-ov-select'));
      });
      ui.delegate(el, 'click', '[data-ov-tx]', function (e, b) {
        openTx(b.getAttribute('data-ov-tx'), b);
      });
      ui.delegate(el, 'click', '[data-ov-notin-all]', function () {
        var ids = YES.calc.notInBalance().map(function (tx) {
          return tx.id;
        });
        YES.explorer.showRows(ids, t('overview.notIn.listLabel'));
        if (YES.state.view !== 'transactions') YES.nav.go('transactions');
      });
      ui.delegate(el, 'click', '[data-ov-learn]', function (e, b) {
        YES.understand.openTopic(b.getAttribute('data-ov-learn'));
      });
      ui.delegate(el, 'click', '[data-ov-help]', function () {
        YES.help.open('contact');
      });
      ui.delegate(el, 'click', '[data-ov-video]', function (e, b) {
        openVideo(b);
      });
      if (dlg) {
        ui.delegate(dlg, 'click', '[data-ov-video-close]', function () {
          ui.closeDialog(dlg);
        });
      }

      // Running-balance chart: crosshair + tooltip on hover, nearest point on click.
      el.addEventListener('pointermove', function (e) {
        var plot = e.target.closest && e.target.closest('[data-ov-plot]');
        if (!plot) {
          if (chart.hover !== -1) {
            chart.hover = -1;
            if (!pointFocused()) hideTip();
          }
          return;
        }
        if (e.pointerType === 'touch') return;
        var i = nearestAt(e.clientX, e.clientY);
        if (i !== chart.hover && i !== -1) {
          chart.hover = i;
          showTip(i);
        }
      });
      el.addEventListener('pointerleave', function () {
        chart.hover = -1;
        if (!pointFocused()) hideTip();
      });
      ui.delegate(el, 'click', '[data-ov-plot]', function (e) {
        if (e.target.closest('[data-ov-tx]')) return;
        var i = nearestAt(e.clientX, e.clientY);
        if (i !== -1) openTx(chart.pts[i].id, pointButton(i));
      });
      ui.delegate(el, 'keydown', '[data-ov-pt]', onPointKey);

  function totalsHtml(rows, filteredView) {
    var posted = rows.filter(function (r) {

      return !YES.calc.inBalance(r.tx);
    });

    if (posted.length) {
      var sum = posted.reduce(function (s, r) {
        return s + r.tx.amount;
      }, 0);

      html += '<p class="tx-total" data-tx-total>' + tHtml(key, { n: YES.fmt.count(posted.length) }, { amount: '<strong>' + ui.amountHtml(sum) + '</strong>' }) + '</p>';
    } else if (rows.length) {
      html += '<p class="tx-total" data-tx-total>' + esc(t('explorer.total.none')) + '</p>';
    }

  function matchLineHtml(match, terms) {
    if (!match || !match.length) return '';
    var parts = [];
    FIELD_ORDER.forEach(function (key) {
      var hits = match.filter(function (m) {

      });
      if (!hits.length) return;
      var shown = hits.filter(function (m) {
        return m.shown;
      });
      var label = esc(t('explorer.field.' + key));
      if (shown.length) parts.push(label);
      else parts.push(label + ' <span class="tx-match__value">' + hl(hits[0].text, terms) + '</span>');
    });
    return '<p class="tx-match">' + ui.icon('search', { size: 14 }) + '<span><span class="tx-match__label">' + esc(t('explorer.match.in')) + '</span> ' + parts.join(' · ') + '</span></p>';
  }

  /** Keep masked identifiers ("•••• 4821") on one line. */

  function setInvalid(input, bad) {
    if (!input) return;
    if (bad) input.setAttribute('aria-invalid', 'true');
    else input.removeAttribute('aria-invalid');
  }
  function showError(id, msg) {
    var el = els.root.querySelector('#' + id);
    if (!el) return;
    if (msg) {
      ui.render(el, ui.icon('alert', { size: 16 }) + '<span>' + esc(msg) + '</span>');
      el.hidden = false;
    } else {
      el.textContent = '';
      el.hidden = true;
    }
  }

  /** Bring every control in line with YES.state (values only; no re-render). */
  function syncControls(rows) {
    var r = els.root;
    if (!r || !r.firstChild) return;
    rows = rows || run();
    var f = F();
    var s = S();
    var b = basis();
    var bounds = dateBounds(b);
    var q = r.querySelector('#tx-q');
    if (q && q.value !== f.q) q.value = f.q;
    var qc = r.querySelector('[data-tx-q-clear]');
    if (qc) qc.hidden = !f.q;

    ['from', 'to'].forEach(function (w) {
      var el = r.querySelector('#tx-' + w);
      if (!el) return;
      if (el.value !== f[w]) el.value = f[w];
      // Touch the bounds only when the basis changes them (rewriting them rebuilds Chrome's date editor).
      if (el.min !== bounds.min) el.min = bounds.min;
      if (el.max !== bounds.max) el.max = bounds.max;
    });
    var legend = r.querySelector('#tx-date-legend');
    if (legend) legend.textContent = t('explorer.filters.dateLegend', { basis: t('explorer.basis.' + b) });
    var badOrder = f.from && f.to && f.from > f.to;
    setInvalid(r.querySelector('#tx-to'), badOrder);
    showError('tx-date-err', badOrder ? t('explorer.filters.dateError') : '');

    ui.$$('[data-tx-f="direction"]', r).forEach(function (el) {
      el.checked = el.value === f.direction;
    });
    ['types', 'statuses', 'rails'].forEach(function (g) {
      ui.$$('[data-tx-f="' + g + '"]', r).forEach(function (el) {
        el.checked = f[g].indexOf(el.value) !== -1;
      });
    });
    var mn = parseAmount(f.min);
    var mx = parseAmount(f.max);
    ['min', 'max'].forEach(function (w) {
      var el = r.querySelector('#tx-' + w);
      if (el && el.value !== f[w]) el.value = f[w];
    });
    var amtErr = '';
    if (mn.error || mx.error) amtErr = t('explorer.filters.amountInvalid');
    else if (mn.value != null && mx.value != null && mn.value > mx.value) amtErr = t('explorer.filters.amountOrder');
    setInvalid(r.querySelector('#tx-min'), !!mn.error);
    setInvalid(r.querySelector('#tx-max'), !!mx.error || (!mn.error && !mx.error && mn.value != null && mx.value != null && mn.value > mx.value));
    showError('tx-amt-err', amtErr);

    var sel = r.querySelector('#tx-sort');
    if (sel && sel.value !== s.key + ':' + s.dir) sel.value = s.key + ':' + s.dir;

    var n = panelCount();
    var badge = r.querySelector('[data-tx-badge]');
    if (badge) {
      badge.hidden = !n;
      badge.firstChild.textContent = YES.fmt.count(n);
      badge.lastChild.textContent = t('explorer.filters.activeN', { n: YES.fmt.count(n) });
    }
    var open = !!viewPrefs().filtersOpen;
    var toggle = r.querySelector('[data-tx-toggle]');
    if (toggle) toggle.setAttribute('aria-expanded', String(open));
    var panel = r.querySelector('#tx-filter-panel');
    if (panel) panel.setAttribute('data-open', String(open));
    var done = r.querySelector('[data-tx-done]');
    if (done) done.textContent = t('explorer.filters.showResults', { n: YES.fmt.count(rows.length) });

    var csv = r.querySelector('[data-tx-csv="filtered"]');
    if (csv) {
      csv.disabled = !rows.length;
      var lbl = csv.querySelector('[data-tx-csv-label]');
      if (lbl) lbl.textContent = t('explorer.export.view', { n: YES.fmt.count(rows.length) });
    }
  }

    var rows = run();

    return countText(rows.length, allTx().length, list.length > 0) + '.';

  function announceCount(delay) {

  function focusResults() {
    var el = els.root && els.root.querySelector('#tx-results-title');
    if (!el) return;
    el.focus({ preventScroll: true });
    if (!el.scrollIntoView) return;
    var behavior = ui.reducedMotion() ? 'auto' : 'smooth';
    if (ui.isNarrow()) {
      // On small screens bring the active chips and the first rows into view together.
      var chipsEl = els.root.querySelector('#tx-chips');
      (chipsEl && chipsEl.firstChild ? chipsEl : el).scrollIntoView({ block: 'start', behavior: behavior });
    } else {
      el.scrollIntoView({ block: 'nearest', behavior: behavior });
    }
  }

  /* ------------------------------------------------------------------ */
  /* Public filter API                                                   */
  /* ------------------------------------------------------------------ */
  function applyFilter(partial, opts) {
    partial = partial || {};
    opts = opts || {};
    var navigate = opts.navigate !== false;
    var focus = opts.focus === undefined ? 'results' : opts.focus;
    var f = opts.reset ? YES.defaultFilters() : F();
    if (!opts.reset) f.idsLabel = F().idsLabel;
    Object.keys(partial).forEach(function (k) {
      f[k] = Array.isArray(partial[k]) ? partial[k].slice() : partial[k];
    });
    // A journey step and an explicit id list are alternative scopes.
    if (partial.step && !('ids' in partial)) {
      f.ids = null;
      f.idsLabel = null;
    }
    if (partial.ids && !('step' in partial)) f.step = null;
    if (!f.ids) f.idsLabel = null;
    enterNext = !!(partial.step || partial.ids);
    YES.set({ filters: f });
    enterNext = false;
    if (navigate && YES.state.view !== 'transactions') YES.nav.go('transactions', { focus: false });
    if (navigate) {
      if (focus === 'results') focusResults();
      else if (focus === 'heading') ui.focusView('transactions');
    }
    announceCount(navigate ? 120 : 0);
    return filtered();
  }

  function showRows(ids, labelText) {
    return applyFilter({ ids: (ids || []).slice(), idsLabel: labelText || null }, { reset: true });
  }

  function clearFilters(opts) {
    opts = opts || {};
    YES.set({ filters: YES.defaultFilters() });
    if (opts.focus !== false && els.root && YES.state.view === 'transactions') focusResults();
    announceCount(60);
  }

    if (els.dlg && els.dlg.open) return; // re-opened before a late 'close' event arrived
    YES.set({ selectedTx: null });
    if (els.dlg) els.dlg.removeAttribute('data-tx');
    dlgCtx.view = null;
    var cur = YES.nav.current();
    if (cur.view === 'transactions' && cur.param) YES.nav.setParam(null);
  }

  /**
   * Open the transaction detail. Over the Transactions view the address becomes
   * #/transactions/<id>; over another view the dialog opens in place so focus can
   * return to the control that opened it.
   */
  /** Run fn once the dialog's pending 'close' event (and its focus return) has been handled. */
  function whenClosed(fn) {
    if (!closing) return fn();
    var done = false;
    var run = function () {
      if (done) return;
      done = true;
      closing = false;
      fn();
    };
    els.dlg.addEventListener(
      'close',
      function () {
        setTimeout(run, 0);
      },
      { once: true }
    );
    setTimeout(run, 150);
  }

  function openTx(id, opts) {
    opts = opts || {};
    var tx = id && SAFE_ID.test(String(id)) ? YES.calc.tx(String(id)) : null;
    if (!els.dlg) return;
    if (closing && !els.dlg.open) {
      whenClosed(function () {
        openTx(id, opts);
      });
      return;
    }
    if (!tx) {
      ui.toast(t('explorer.notFound', { id: String(id || '') }));
      if (opts.fromRoute) YES.nav.setParam(null);
      return;
    }
    var wasOpen = els.dlg.open;
    YES.set({ selectedTx: tx.id });
    renderDialog();
    if (YES.state.view === 'transactions') YES.nav.setParam(tx.id);
    var row = rowButton(tx.id);
    if (!wasOpen) {
      dlgCtx.view = YES.state.view;
      var trigger = opts.trigger || (visible(row) ? row : null) || (YES.state.view === 'transactions' ? els.root.querySelector('#tx-results-title') : null) || doc.activeElement;
      ui.openDialog(els.dlg, { trigger: trigger, initialFocus: '#tx-dialog-title', onClose: onDialogClose });
    } else {
      // Moving between transactions inside the dialog: return focus to the row now shown.
      if (visible(row)) els.dlg._trigger = row;
      var h = els.dlg.querySelector('#tx-dialog-title');
      if (h) h.focus({ preventScroll: true });
      var b = els.dlg.querySelector('.dlg__body');
      if (b) b.scrollTop = 0;
      ui.announce(t('explorer.dlg.showing', { description: YES.L(tx.description) }));
    }
  }

  function closeTx() {
    if (!els.dlg || !els.dlg.open) return;
    closing = true;
    ui.closeDialog(els.dlg);
    // The native 'close' event fires a task later; settle state and route now so
    // callers see the closed state immediately (onDialogClose is idempotent).
    onDialogClose();
  }

  function onRoute(r) {
    if (!els.dlg) return;
    var open = els.dlg.open;
    if (r.view === 'transactions' && r.param) {
      if (!(open && YES.state.selectedTx === r.param)) openTx(r.param, { fromRoute: true });
      return;
    }
    if (open && dlgCtx.view && (r.view !== dlgCtx.view || r.view === 'transactions')) closeTx();
  }

  /* ------------------------------------------------------------------ */
  /* CSV export                                                          */
  /* ------------------------------------------------------------------ */
  function plainAmount(minor) {
    // Machine-readable decimal with '.' and ASCII minus, at the asset precision.
    if (minor == null) return '';
    var p = asset().precision;
    var abs = Math.abs(minor);
    var unit = Math.pow(10, p);
    var frac = String(abs % unit);
    while (frac.length < p) frac = '0' + frac;
    return (minor < 0 ? '-' : '') + Math.floor(abs / unit) + (p ? '.' + frac : '');
  }
  var timeFmt = null;
  function isoTime(iso) {
    if (!iso) return '';
    if (!timeFmt) timeFmt = new Intl.DateTimeFormat('en-GB', { timeZone: st().timezone, hour: '2-digit', minute: '2-digit', hourCycle: 'h23' });
    return timeFmt.format(new Date(iso));
  }
  function csvCell(v, text) {
    var s = v == null ? '' : String(v);
    if (text && /^[=+\-@\t\r]/.test(s)) s = "'" + s; // keep spreadsheet formulas inert
    if (/[",;\r\n]/.test(s)) s = '"' + s.replace(/"/g, '""') + '"';
    return s;
  }
  var CSV_COLS = [
    ['statementId', function () { return st().id; }, true],
    ['txId', function (tx) { return tx.id; }, true],
    ['postedDate', function (tx) { return YES.fmt.isoDate(tx.postedAt); }],
    ['postedTime', function (tx) { return isoTime(tx.postedAt); }],
    ['initiatedDate', function (tx) { return YES.fmt.isoDate(tx.initiatedAt); }],
    ['initiatedTime', function (tx) { return isoTime(tx.initiatedAt); }],
    ['timezone', function () { return st().timezone; }, true],
    ['type', function (tx) { return tx.type; }, true],
    ['typeLabel', function (tx) { return ui.typeLabel(tx.type); }, true],
    ['description', function (tx) { return YES.L(tx.description); }, true],
    ['counterparty', function (tx) { return YES.L(tx.counterparty); }, true],
    ['memo', function (tx) { return tx.memo ? YES.L(tx.memo) : ''; }, true],
    ['direction', function (tx) { return tx.amount < 0 ? 'outgoing' : tx.amount > 0 ? 'incoming' : 'none'; }, true],
    ['amount', function (tx) { return plainAmount(tx.amount); }],
    ['asset', function (tx) { return tx.asset; }, true],
    ['balanceAfter', function (tx) { return YES.calc.inBalance(tx) ? plainAmount(tx.balanceAfter) : ''; }],
    ['status', function (tx) { return tx.status; }, true],
    ['included', function (tx) { return YES.calc.inBalance(tx) ? 'true' : 'false'; }],
    ['rail', function (tx) { return tx.rail; }, true],
    ['method', function (tx) { return tx.method || ''; }, true],
    ['reference', function (tx) { return tx.reference || ''; }, true],
    ['parentId', function (tx) { return tx.parentId || ''; }, true],
    ['classification', function () { return CLASSIFICATION; }, true]
  ];
  function completeList() {
    var posted = YES.calc.posted();
    var other = YES.calc.notInBalance().sort(function (a, b) {
      return ms(a.initiatedAt) - ms(b.initiatedAt) || (a.seq || 0) - (b.seq || 0);
    });
    return posted.concat(other);
  }
  function buildCsv(which) {
    var list = which === 'filtered' ? filtered() : completeList();
    var lines = [
      CSV_COLS.map(function (c) {
        return csvCell(t('explorer.csv.' + c[0]), true);
      }).join(',')
    ];
    list.forEach(function (tx) {
      lines.push(
        CSV_COLS.map(function (c) {
          return csvCell(c[1](tx), !!c[2]);
        }).join(',')
      );
    });
    return { list: list, content: '﻿' + lines.join('\r\n') + '\r\n' };
  }
  function exportCsv(which) {
    which = which === 'filtered' ? 'filtered' : 'all';
    var out = buildCsv(which);
    if (which === 'filtered' && !out.list.length) {
      ui.toast(t('explorer.export.empty'));
      return null;
    }
    var name = st().id + '_' + (which === 'filtered' ? 'current-view' : 'complete-record') + '_DEMO.csv';
    ui.download(name, out.content, 'text/csv;charset=utf-8');
    ui.toast(t('explorer.export.done', { count: YES.txCount(out.list.length) }));
    return name;
  }

  /* ------------------------------------------------------------------ */
  /* Events                                                              */
  /* ------------------------------------------------------------------ */
  function readGroup(group) {
    return ui
      .$$('[data-tx-f="' + group + '"]', els.root)
      .filter(function (el) {
        return el.checked;
      })
      .map(function (el) {
        return el.value;
      });
  }

  function setPanelOpen(open) {
    var v = {};
    var cur = viewPrefs();
    for (var k in cur) v[k] = cur[k];
    v.filtersOpen = !!open;
    YES.set({ explorer: v });
    syncControls();
  }

  function bind() {
    var r = els.root;
    r.addEventListener('submit', function (e) {
      e.preventDefault();
    });
    r.addEventListener('input', function (e) {
      var el = e.target;
      if (el.hasAttribute('data-tx-q')) {
        setFilters({ q: el.value });
        announceCount(700);
        return;
      }
      var kind = el.getAttribute('data-tx-f');
      if (kind === 'min' || kind === 'max') {
        var patch = {};
        patch[kind] = el.value;
        setFilters(patch);
        announceCount(700);
      }
    });
    r.addEventListener('change', function (e) {
      var el = e.target;
      if (el.hasAttribute('data-tx-sort')) {
        var p = el.value.split(':');
        YES.set({ sort: { key: p[0], dir: p[1] } });
        clearTimeout(timers.announce);
        timers.announce = setTimeout(function () {
          ui.announce(t('explorer.sort.announce', { label: t('explorer.sort.' + S().key + '.' + S().dir) }) + ' ' + countAnnouncement());
        }, 100);
        return;
      }
      var kind = el.getAttribute('data-tx-f');
      if (!kind || kind === 'min' || kind === 'max') return;
      var patch = {};
      if (kind === 'types' || kind === 'statuses' || kind === 'rails') patch[kind] = readGroup(kind);
      else if (kind === 'direction') patch.direction = el.value;
      else if (kind === 'from' || kind === 'to') patch[kind] = el.value || '';
      setFilters(patch);
      announceCount(200);
    });
    r.addEventListener('keydown', function (e) {
      // Escape in a non-empty search box clears it (and keeps focus there).
      if (e.key === 'Escape' && e.target.hasAttribute && e.target.hasAttribute('data-tx-q') && e.target.value) {
        e.preventDefault();
        setFilters({ q: '' });
        announceCount(200);
      }
    });

    ui.delegate(r, 'click', '[data-tx-q-clear]', function () {
      setFilters({ q: '' });
      var q = r.querySelector('#tx-q');
      if (q) q.focus();
      announceCount(200);
    });
    ui.delegate(r, 'click', '[data-tx-open]', function (e, b) {
      e.preventDefault();
      openTx(b.getAttribute('data-tx-open'), { trigger: b });
    });
    ui.delegate(r, 'click', '[data-tx-row]', function (e, row) {
      if (e.target.closest('button, a, input, select, label, summary')) return;
      var sel = root.getSelection && root.getSelection();
      if (sel && String(sel).length) return; // the customer is selecting text, not opening
      var b = row.querySelector('[data-tx-open]');
      if (b) openTx(b.getAttribute('data-tx-open'), { trigger: b });
    });
    ui.delegate(r, 'click', '[data-tx-chip]', function (e, b) {
      var all = ui.$$('[data-tx-chip]', r);
      var idx = all.indexOf(b);
      var label = b.querySelector('.tx-chip__label').textContent;
      removeChip(b.getAttribute('data-tx-chip'));
      var left = ui.$$('[data-tx-chip]', r);
      var target = left[idx] || left[idx - 1] || r.querySelector('#tx-results-title');
      if (target) target.focus({ preventScroll: true });
      clearTimeout(timers.announce);
      timers.announce = setTimeout(function () {
        ui.announce(t('explorer.chip.removed', { label: label }) + ' ' + countAnnouncement());
      }, 100);
    });
    ui.delegate(r, 'click', '[data-tx-clear]', function () {
      YES.set({ filters: YES.defaultFilters() });
      focusResults();
      clearTimeout(timers.announce);
      timers.announce = setTimeout(function () {
        ui.announce(t('explorer.cleared') + ' ' + countAnnouncement());
      }, 100);
    });
    ui.delegate(r, 'click', '[data-tx-toggle]', function () {
      setPanelOpen(!viewPrefs().filtersOpen);
    });
    ui.delegate(r, 'click', '[data-tx-done]', function () {
      setPanelOpen(false);
      focusResults();
      announceCount(100);
    });
    ui.delegate(r, 'click', '[data-tx-csv]', function (e, b) {
      exportCsv(b.getAttribute('data-tx-csv'));
    });
    ui.delegate(r, 'click', '[data-tx-print]', function () {
      if (typeof root.print === 'function') root.print();
    });

    var d = els.dlg;
    if (d) {
      // State and route follow every close (button, Escape, backdrop, programmatic).
      d.addEventListener('close', function () {
        closing = false;
        onDialogClose();
      });
      ui.delegate(d, 'click', '[data-txd-close]', function () {
        closeTx();
      });
      ui.delegate(d, 'click', '[data-txd-go]', function (e, b) {
        var id = b.getAttribute('data-txd-go');
        if (id) openTx(id, { inDialog: true });
      });
      ui.delegate(d, 'click', '[data-txd-copy]', function (e, b) {
        var tx = YES.calc.tx(YES.state.selectedTx);
        if (!tx) return;
        var k = b.getAttribute('data-txd-copy');
        var v = k === 'ref' ? tx.reference : k === 'id' ? tx.id : k === 'hash' && tx.onchain ? tx.onchain.hash : '';
        if (v) ui.copy(v);
      });
      ui.delegate(d, 'click', '[data-txd-ask]', function (e, b) {
        YES.inquiry.start(b.getAttribute('data-txd-ask'), { trigger: b });
      });
      // "Explain with AI" hands over to the assistant: the detail closes first so the
      // drawer is never left behind a modal, and closing the drawer returns focus to
      // the row that opened the detail.
      ui.delegate(d, 'click', '[data-explain]', function (e, b) {
        e.preventDefault();
        e.stopPropagation();
        var ctx = { topic: b.getAttribute('data-explain'), id: b.getAttribute('data-explain-id') || null };
        var back = d._trigger;
        var row = rowButton(ctx.id);
        if (!visible(back) && visible(row)) back = row;
        closing = true;
        ui.closeDialog(d, { returnFocus: false });
        onDialogClose();
        YES.assistant.open({ topic: ctx.topic, id: ctx.id, trigger: visible(back) ? back : null });
      });
    }

    YES.on('route', onRoute);

    if (root.matchMedia) {
      var mq = root.matchMedia('(max-width: 719px)');
      var onMq = function () {
        update();
      };
      if (mq.addEventListener) mq.addEventListener('change', onMq);
      else if (mq.addListener) mq.addListener(onMq);
    }
  }

/*
 * Transaction inquiry — a complete LOCAL mock (PRD 5.4, 9 "Inquiry").
 *
 * Four steps in the #inquiry-dialog: (1) the transaction carried in, (2) reason,
 * optional description and preferred reply channel, (3) review, (4) a
 * confirmation that says "Demo only — no inquiry was sent" with a clearly
 * fictional local reference. Nothing is sent, nothing is stored outside
 * YES.state, and no contact details are ever requested.
 *
 * State (YES.state.inquiry) — survives closing the dialog and language switches:
 *   { txId, step: 'transaction'|'details'|'review'|'done', reason, description,
 *     channel, status: 'draft'|'submitted', ref, attempt, seq,
 *     errors: null|{ field: code }, notice: null|'resumed'|'duplicate',
 *     prior: null|<submitted record kept while a new demo inquiry is untouched>,
 *     others: { txId: record } }   ← inquiries parked for other transactions
 * The top-level fields describe the active inquiry; `others` keeps drafts and
 * completed demo inquiries for other transactions, so each one survives.
 */
(function (root) {
  'use strict';
  var YES = root.YES;
  var ui = YES.ui;
  var t = YES.t;
  var esc = ui.esc;
  var doc = root.document;

  var STEPS = ['transaction', 'details', 'review', 'done'];
  var REASONS = ['unrecognised', 'amount', 'pending', 'fee', 'other'];
  var CHANNELS = ['in_app', 'email', 'phone'];
  var CHANNEL_ICONS = { in_app: 'chat', email: 'mail', phone: 'phone' };
  var FIELDS = ['reason', 'description', 'channel']; // form order (error summary order)
  var MAX = 500;
  var SAFE_ID = /^[A-Za-z0-9_-]{1,64}$/;
  var REF_ALPHABET = '23456789ABCDEFGHJKLMNPQRSTUVWXYZ'; // no 0/O or 1/I look-alikes
  /* A run of 12+ digits (spaces or hyphens allowed) looks like a full card or account number. */
  var SENSITIVE_NUMBER = /(?:\d[ -]?){12,}/;

  var els = { dlg: null, shell: null, live: null, liveA: null };
  /* DOM references cannot live in state: the control focus returns to, and the
     control that opened the transaction detail ("Back to transaction" target). */
  var ctx = { trigger: null, origin: null };
  var timers = {};
  var seqCounter = 0;
  var selfWrite = false;

  /* ------------------------------------------------------------------ */
  /* State helpers                                                       */
  /* ------------------------------------------------------------------ */
  function assign(target) {
    for (var i = 1; i < arguments.length; i++) {
      var src = arguments[i];
      if (!src) continue;
      for (var k in src) if (Object.prototype.hasOwnProperty.call(src, k)) target[k] = src[k];
    }
    return target;
  }
  function raw() {
    var s = YES.state.inquiry;
    return s && typeof s === 'object' ? s : null;
  }
  function current() {
    var s = raw();
    return s && s.txId ? s : null;
  }
  function othersOf(s) {
    return s && s.others && typeof s.others === 'object' ? s.others : {};
  }
  function blank(txId, attempt) {
    return { txId: txId, step: 'transaction', reason: '', description: '', channel: '', status: 'draft', ref: null, attempt: attempt || 1, seq: 0, errors: null, notice: null, prior: null };
  }
  /** Tolerate partial or foreign shapes (e.g. { txId, step: 2, status }) without breaking. */
  function normalize(rec) {
    var r = assign(blank(rec.txId), rec);
    r.status = r.status === 'submitted' ? 'submitted' : 'draft';
    if (STEPS.indexOf(r.step) === -1) r.step = r.status === 'submitted' ? 'done' : 'transaction';
    if (r.status === 'submitted') r.step = 'done';
    else if (r.step === 'done') r.step = 'review';
    if (REASONS.indexOf(r.reason) === -1) r.reason = '';
    if (CHANNELS.indexOf(r.channel) === -1) r.channel = '';
    r.description = typeof r.description === 'string' ? r.description.slice(0, MAX) : '';
    r.attempt = r.attempt > 0 ? Math.floor(r.attempt) : 1;
    if (r.status === 'submitted' && !r.ref) r.ref = makeRef(r.txId, r.attempt);
    if (!r.errors || typeof r.errors !== 'object') r.errors = null;
    return r;
  }
  /** The persistable part of one inquiry (transient UI flags dropped). */
  function clean(rec) {
    return {
      txId: rec.txId,
      step: rec.step,
      reason: rec.reason || '',
      description: rec.description || '',
      channel: rec.channel || '',
      status: rec.status,
      ref: rec.ref || null,
      attempt: rec.attempt || 1,
      seq: rec.seq || 0
    };
  }
  /** Worth keeping: the customer moved on or entered something, or it was submitted. */
  function touched(rec) {
    return !!rec && (rec.status === 'submitted' || (rec.step && rec.step !== 'transaction') || !!rec.reason || !!rec.channel || !!(rec.description && rec.description.trim()));
  }

  function activate(txId) {

  function makeRef(txId, attempt) {
    var h = 2166136261;
    var str = String(txId);

      code += REF_ALPHABET.charAt(h % 32);

      t('inquiry.tx.status'),
      '<span class="inq-status">' +
        ui.statusHtml(tx.status) +
        (pending ? '<span class="inq-notin">' + ui.icon('clock', { size: 14 }) + '<span>' + esc(t('status.notInBalance')) + '</span></span>' : '') +
        '</span>'
    );
    var fees = YES.calc.feesFor(tx.id);
    if (fees.length) {
      var feeSum = fees.reduce(function (a, f) {
        return a + f.amount;
      }, 0);
      rows += kvRow(t('inquiry.tx.fee'), ui.amountHtml(feeSum));
    }
    if (tx.parentId) {
      var parent = YES.calc.tx(tx.parentId);
      if (parent) rows += kvRow(t('inquiry.tx.feeFor'), esc(YES.L(parent.description)));
    }
    rows += kvRow(t('inquiry.tx.reference'), '<span class="mono" data-inq-txref>' + esc(tx.reference || '') + '</span>');
    rows += kvRow(t('inquiry.tx.id'), '<span class="mono">' + esc(tx.id) + '</span>');
    return (
      '<div class="inq-tx' +
      (pending ? ' inq-tx--pending' : '') +
      '" role="group" aria-labelledby="inq-tx-name" data-inq-tx="' +
      esc(tx.id) +
      '">' +
      '<div class="inq-tx__top">' +
      '<span class="dir dir--' +
      dirClass(tx) +
      '">' +
      ui.icon(ui.typeIcon(tx.type), { size: 18 }) +
      '</span>' +
      '<div class="inq-tx__name" id="inq-tx-name"><span class="inq-tx__type">' +
      esc(ui.typeLabel(tx.type)) +
      '<span class="sr-only">: </span></span><span class="inq-tx__desc">' +
      esc(YES.L(tx.description)) +
      '</span></div>' +
      '<p class="inq-tx__amount">' +
      ui.amountHtml(tx.amount) +
      '</p>' +
      '</div>' +
      '<dl class="kv inq-kv">' +
      rows +
      '</dl>' +
      '<p class="inq-tz">' +
      esc(t('term.timezone', { tz: YES.fmt.tz(tx.postedAt || tx.initiatedAt) })) +
      '</p>' +
      '</div>'
    );
  }

  function keepNoteHtml() {
    return '<p class="inq-keep">' + ui.icon('lock', { size: 16 }) + '<span>' + esc(t('inquiry.keep')) + '</span></p>';
  }

  function noticeHtml(s) {
    if (s.notice === 'resumed' && s.status !== 'submitted') {

        '<div class="notice notice--info inq-flash" data-inq-notice="resumed">' +

  function txStepHtml(s, tx) {

  /* ----------------------------- Details ---------------------------- */
  /* One message per field (state errors hold 'required' for the radio groups, 'sensitive' for the description). */
  function errorHtml(field) {
    var key = 'inquiry.err.' + field;
    return (
      '<p class="field__error inq-error" id="inq-' +
      field +
      '-error">' +
      ui.icon('alert', { size: 18 }) +

      esc(t('inquiry.err.prefix')) +
      ' </span>' +
      esc(t(key)) +
      '</span></p>'
    );
  }
  function firstInputId(field, s) {
    if (field === 'description') return 'inq-desc';
    var list = field === 'reason' ? REASONS : CHANNELS;
    var v = s && s[field];
    return 'inq-' + field + '-' + (list.indexOf(v) !== -1 ? v : list[0]);
  }
  function summaryHtml(e, s) {
    var fields = FIELDS.filter(function (f) {
      return e && e[f];
    });
    if (!fields.length) return '';
    return (
      '<div class="inq-errors" role="alert" tabindex="-1" data-fk="inq-errors" aria-labelledby="inq-errors-title">' +
      ui.icon('alert', { size: 22 }) +
      '<div class="inq-errors__body"><h3 id="inq-errors-title" class="inq-errors__title">' +
      esc(t('inquiry.err.title')) +
      '</h3><ul class="inq-errors__list">' +
      fields
        .map(function (f) {
          return (
            '<li data-inq-err="' +
            f +
            '"><a href="#' +
            firstInputId(f, s) +
            '" data-inq-errlink="' +
            f +
            '" data-fk="inq-errlink-' +
            f +
            '">' +
            esc(t('inquiry.err.' + f)) +
            '</a></li>'
          );

        .join('') +

  function groupDescribedBy(field, err) {
    var ids = [];
    if (err) ids.push('inq-' + field + '-error');
    if (field === 'channel') ids.push('inq-channel-hint');
    if (field === 'description') ids.push('inq-desc-hint', 'inq-desc-warn', 'inq-desc-count');
    return ids.join(' ');
  }

  function radioGroupHtml(field, options, s, e, o) {
    var err = e[field];
    var legendId = 'inq-' + field + '-legend';
    var describedBy = groupDescribedBy(field, err);
    var choices = options
      .map(function (id) {
        var inputId = 'inq-' + field + '-' + id;

        return (
          '<label class="choice inq-choice" for="' +
          inputId +
          '"><input type="radio" id="' +
          inputId +
          '" name="inq-' +
          field +
          '" value="' +
          id +
          '" data-inq-field="' +
          field +
          '" data-fk="' +
          inputId +
          '"' +
          (s[field] === id ? ' checked' : '') +
          (err ? ' aria-invalid="true"' : '') +
          '>' +
          (o.icons ? ui.icon(o.icons[id], { size: 18, cls: 'inq-choice__icon' }) : '') +
          '<span class="inq-choice__text"><span class="inq-choice__label">' +
          esc(t('inquiry.' + field + '.' + id)) +
          '</span>' +
          (hint ? '<span class="inq-choice__hint">' + esc(hint) + '</span>' : '') +
          '</span></label>'
        );

      .join('');
    return (
      '<fieldset class="inq-field inq-group' +
      (err ? ' is-invalid' : '') +
      '" role="radiogroup" aria-labelledby="' +
      legendId +
      '" aria-required="true"' +
      (describedBy ? ' aria-describedby="' + describedBy + '"' : '') +
      (err ? ' aria-invalid="true"' : '') +
      ' data-inq-group="' +
      field +
      '">' +
      '<legend id="' +
      legendId +
      '" class="inq-legend">' +
      esc(t(o.legend)) +
      ' <span class="inq-req">' +

      field +

  function countText(len) {
    var left = MAX - len;
    if (left <= 0) return t('inquiry.description.limit', { max: YES.fmt.count(MAX) });
    if (left === 1) return t('inquiry.description.left1');
    return t('inquiry.description.left', { n: YES.fmt.count(left) });

      '<p class="field__hint" id="inq-desc-hint">' +

  function footHtml(s) {
    var back =
      '<button type="button" class="btn inq-foot__back" data-inq-prev data-fk="inq-prev">' + ui.icon('arrow-left', { size: 18 }) + '<span>' + esc(t('inquiry.back')) + '</span></button>';
    var b = '';
    if (s.step === 'transaction') {
      b = '<button type="button" class="btn btn--primary" data-inq-next data-fk="inq-next"><span>' + esc(t('inquiry.next')) + '</span>' + ui.icon('arrow-right', { size: 18 }) + '</button>';
    } else if (s.step === 'details') {
      b = back + '<button type="button" class="btn btn--primary" data-inq-next data-fk="inq-next"><span>' + esc(t('inquiry.next')) + '</span>' + ui.icon('arrow-right', { size: 18 }) + '</button>';
    } else if (s.step === 'review') {
      b = back + '<button type="button" class="btn btn--primary" data-inq-submit data-fk="inq-submit">' + ui.icon('check', { size: 18 }) + '<span>' + esc(t('inquiry.submit')) + '</span></button>';
    } else {
      b = '<button type="button" class="btn btn--primary" data-inq-close data-fk="inq-done">' + esc(t('inquiry.done')) + '</button>';
    }
    return '<div class="dlg__foot inq-foot inq-foot--' + esc(s.step) + '">' + b + '</div>';
  }

  function shellHtml(s, tx) {
    var body;
    if (s.step === 'details') body = detailsStepHtml(s);
    else if (s.step === 'review') body = reviewStepHtml(s, tx);
    else if (s.step === 'done') body = doneStepHtml(s, tx);
    else body = txStepHtml(s, tx);
    return headHtml(s) + '<div class="dlg__body inq-body" data-inq-body data-step="' + esc(s.step) + '">' + body + '</div>' + footHtml(s);
  }

  function renderShell(opts) {
    var s = current();
    var tx = s ? YES.calc.tx(s.txId) : null;
    if (!els.shell || !s || !tx) return;
    var body = q('[data-inq-body]');
    var same = body && body.getAttribute('data-step') === s.step;
    var scroll = body ? body.scrollTop : 0;
    ui.render(els.shell, shellHtml(normalize(s), tx));
    els.dlg.setAttribute('data-step', s.step);
    var nb = q('[data-inq-body]');
    if (!nb) return;
    if (opts && opts.enter) nb.classList.add('inq-body--enter');
    else if (same) nb.scrollTop = scroll;
    syncScrollable();
  }

  /**
   * Keyboard users must be able to scroll the step content even when it holds
   * no focusable control (e.g. the transaction or confirmation step on a small
   * screen): a scrolling body becomes a named, focusable region.
   */
  function syncScrollable() {
    var body = q('[data-inq-body]');
    if (!body || !els.dlg || !els.dlg.open) return;
    var scrolls = body.scrollHeight > body.clientHeight + 1;
    if (scrolls) {
      body.setAttribute('tabindex', '0');
      body.setAttribute('role', 'region');
      body.setAttribute('aria-labelledby', 'inquiry-dialog-title');
    } else if (body.hasAttribute('tabindex')) {
      if (doc.activeElement === body) focusHeading();
      body.removeAttribute('tabindex');
      body.removeAttribute('role');
      body.removeAttribute('aria-labelledby');
    }
  }

  /* ------------------------------------------------------------------ */
  /* Focus                                                               */
  /* ------------------------------------------------------------------ */
  function focusTitle() {
    var h = q('#inquiry-dialog-title');
    if (h) h.focus({ preventScroll: true });
  }
  function focusHeading() {
    var h = q('[data-inq-heading]') || q('#inquiry-dialog-title');
    if (h) h.focus({ preventScroll: true });
  }
  function focusField(field) {
    var el =
      field === 'description'
        ? q('#inq-desc')
        : q('input[name="inq-' + field + '"]:checked') || q('input[name="inq-' + field + '"]');
    if (!el) return;
    el.focus({ preventScroll: true });
    var target = el.closest('[data-inq-group]') || el;
    if (target.scrollIntoView) target.scrollIntoView({ block: 'nearest', behavior: ui.reducedMotion() ? 'auto' : 'smooth' });
  }

  /* ------------------------------------------------------------------ */
  /* Actions                                                             */
  /* ------------------------------------------------------------------ */
  function go(step, field) {
    if (!update({ step: step, errors: null, notice: null })) return;
    renderShell({ enter: true });
    var body = q('[data-inq-body]');
    if (body) body.scrollTop = 0;
    if (field) focusField(field);
    else focusHeading();
  }

  function showErrors(errors, step) {
    var p = { errors: errors, notice: null };
    if (step) p.step = step;
    update(p);
    renderShell({ enter: !!step });
    var body = q('[data-inq-body]');
    if (body) body.scrollTop = 0;
    var sum = q('[data-fk="inq-errors"]');
    if (sum) sum.focus({ preventScroll: true });
    var n = Object.keys(errors).length;
    say(n === 1 ? t('inquiry.err.announce1') : t('inquiry.err.announceN', { n: YES.fmt.count(n) }), true);
  }

  function next() {
    var s = current();
    if (!s) return;
    if (s.step === 'transaction') return go('details');
    if (s.step === 'details') {
      var errors = validate(s);
      if (errors) return showErrors(errors);
      return go('review');
    }
    if (s.step === 'review') return submit();
  }

  function prev() {
    var s = current();
    if (!s) return;
    var i = STEPS.indexOf(s.step);
    if (i > 0 && s.step !== 'done') go(STEPS[i - 1]);
  }

  function submit() {
    var s = current();
    if (!s || s.status === 'submitted') return;
    var errors = validate(s);
    if (errors) return showErrors(errors, 'details');
    var ref = makeRef(s.txId, s.attempt || 1);
    update({ status: 'submitted', ref: ref, step: 'done', errors: null, notice: null, prior: null });
    renderShell({ enter: true });
    var body = q('[data-inq-body]');
    if (body) body.scrollTop = 0;
    focusTitle();
    say(t('inquiry.done.announce', { ref: ref }), true);
  }

  function edit(target) {
    if (target === 'transaction') return go('transaction');
    go('details', target);
  }

  function setField(field, value) {
    var s = current();
    if (!s || FIELDS.indexOf(field) === -1) return;
    var p = {};
    p[field] = value;
    var fixed = !!(s.errors && s.errors[field]);
    if (fixed) p.errors = without(s.errors, field);
    update(p);
    if (fixed) syncFieldError(field);
  }

  function setDescription(value) {
    var s = current();
    if (!s) return;
    var v = String(value || '').slice(0, MAX);
    var p = { description: v };
    var fixed = !!(s.errors && s.errors.description && !looksSensitive(v));
    if (fixed) p.errors = without(s.errors, 'description');
    update(p);
    if (fixed) syncFieldError('description');
    var c = q('[data-inq-count]');
    if (c) {
      c.textContent = countText(v.length);
      c.classList.toggle('is-low', MAX - v.length <= 50);
    }
    clearTimeout(timers.count);
    timers.count = setTimeout(function () {
      if (MAX - v.length <= 100 && els.dlg && els.dlg.open) say(countText(v.length));
    }, 900);
  }

  /** Remove a fixed field's inline error and summary entry without re-rendering the form. */
  function syncFieldError(field) {
    var s = current();
    var e = (s && s.errors) || {};
    var err = e[field];
    var slot = q('[data-inq-errslot="' + field + '"]');
    if (slot) slot.innerHTML = err ? errorHtml(field) : '';
    var group = q('[data-inq-group="' + field + '"]');
    if (group) {
      group.classList.toggle('is-invalid', !!err);
      var targets = field === 'description' ? ui.$$('#inq-desc', group) : [group].concat(ui.$$('input[type="radio"]', group));
      targets.forEach(function (el) {
        if (err) el.setAttribute('aria-invalid', 'true');
        else el.removeAttribute('aria-invalid');
      });
      var describedEl = field === 'description' ? q('#inq-desc') : group;
      var ids = groupDescribedBy(field, err);
      if (describedEl) {
        if (ids) describedEl.setAttribute('aria-describedby', ids);
        else describedEl.removeAttribute('aria-describedby');
      }
    }
    var sum = q('.inq-errors');
    if (sum) {
      if (!err) {
        var li = sum.querySelector('[data-inq-err="' + field + '"]');
        if (li) li.parentNode.removeChild(li);
      }
      if (!sum.querySelector('[data-inq-err]')) {
        var hadFocus = sum.contains(doc.activeElement);
        sum.parentNode.removeChild(sum);
        if (hadFocus) focusHeading();
      }
    }
    syncScrollable();
  }

  function startNew() {
    var s = current();
    if (!s) return;
    var rec = blank(s.txId, (s.attempt || 1) + 1);
    rec.seq = ++seqCounter;
    // Keep the completed demo inquiry until the new one is actually used.
    if (s.status === 'submitted') rec.prior = clean(s);
    write(rec, othersOf(raw()));
    renderShell({ enter: true });
    focusHeading();
    say(t('inquiry.dup.started'));
  }

  function discard() {
    var s = current();
    if (!s) return;
    var rec = blank(s.txId, s.attempt || 1);
    rec.seq = ++seqCounter;
    write(rec, othersOf(raw()));
    renderShell({ enter: true });
    focusHeading();
    say(t('inquiry.resumed.discarded'));
  }

  /* ------------------------------------------------------------------ */
  /* Dialog hand-offs                                                    */
  /* ------------------------------------------------------------------ */
  /**
   * If the transaction detail is open, close it first (no focus return) and
   * remember the control that opened it, so focus returns somewhere sensible.
   */
  function leaveTxDetail(trigger) {
    var txd = doc.getElementById('tx-dialog');
    var origin = null;
    if (txd && txd.open) {
      origin = txd._trigger || null; // set by ui.openDialog: the row or button that opened the detail
      ui.closeDialog(txd, { returnFocus: false });
    }
    if (trigger && txd && txd.contains(trigger)) trigger = null;
    if (trigger && els.dlg && els.dlg.contains(trigger)) trigger = null;
    origin = resolve(origin);
    trigger = resolve(trigger) || origin;
    if (!trigger) {
      var a = doc.activeElement;
      if (a && a !== doc.body && a !== doc.documentElement && !(txd && txd.contains(a)) && !(els.dlg && els.dlg.contains(a))) trigger = a;
    }
    return { trigger: trigger, origin: origin };
  }

  function backToTx() {
    var s = current();
    if (!s) return;
    var target = resolve(ctx.origin) || resolve(ctx.trigger);
    els.dlg._trigger = null; // hand-off: the transaction detail takes focus, not the old trigger
    ui.closeDialog(els.dlg, { returnFocus: false });
    YES.explorer.openTx(s.txId, target ? { trigger: target } : {});
  }

  function onClose() {
    clearTimeout(timers.count);
    if (!els.dlg || els.dlg.open) return; // re-opened before a late 'close' event
    var s = raw();
    var cur = current();
    if (cur) {
      var others = assign({}, othersOf(s));
      if (touched(cur)) {
        write(clean(normalize(cur)), others);
      } else if (cur.prior) {
        write(cur.prior, others); // a "new demo inquiry" that was never used: keep the completed one
      } else {
        // Nothing entered: no draft to keep. Re-activate the most recent parked inquiry, if any.
        var best = null;
        Object.keys(others).forEach(function (k) {
          if (!best || (others[k].seq || 0) > (best.seq || 0)) best = others[k];
        });
        if (best) delete others[best.txId];
        write(best ? clean(normalize(best)) : null, others);
      }
    }
    els.dlg.removeAttribute('data-step');
    // If focus was not returned (trigger hidden or gone), land on the current view's heading.
    setTimeout(function () {
      var a = doc.activeElement;
      if (a && a !== doc.body && a !== doc.documentElement) return;
      if (ui.anyModalOpen()) return;
      var trg = resolve(ctx.trigger);
      if (visible(trg)) return trg.focus({ preventScroll: true });
      var h = doc.querySelector('#view-' + YES.state.view + ' [data-view-heading]') || doc.getElementById('main');
      if (h) h.focus({ preventScroll: true });
    }, 0);
  }

  /* ------------------------------------------------------------------ */
  /* Public API                                                          */
  /* ------------------------------------------------------------------ */
  /** Start (or resume) the inquiry for a transaction. */
  function start(txId, opts) {
    opts = opts || {};
    var tx = txId && SAFE_ID.test(String(txId)) ? YES.calc.tx(String(txId)) : null;
    if (!tx) {
      ui.toast(t('inquiry.notFound', { id: String(txId || '') }));
      return;
    }
    if (!els.dlg) return;
    var wasOpen = els.dlg.open;
    var hand = wasOpen ? { trigger: null, origin: null } : leaveTxDetail(opts.trigger || null);

    var a = activate(tx.id);
    var rec = a.rec;
    rec.errors = null;
    rec.notice = rec.status === 'submitted' ? 'duplicate' : touched(rec) ? 'resumed' : null;
    rec.seq = ++seqCounter;
    write(rec, a.others);

    if (wasOpen) {
      renderShell({ enter: true });
      focusTitle();
      return;
    }
    ctx.trigger = hand.trigger;
    ctx.origin = hand.origin || hand.trigger;
    renderShell();
    ui.openDialog(els.dlg, { trigger: hand.trigger, initialFocus: '#inquiry-dialog-title' });
    syncScrollable();
  }

  /** Reopen the inquiry in progress (the active one, else the most recent draft). */
  function resume(opts) {
    var cur = current();
    var id = cur ? cur.txId : null;
    if (!id) {
      var others = othersOf(raw());
      var best = null;
      Object.keys(others).forEach(function (k) {
        var r = others[k];
        if (r.status !== 'submitted' && (!best || (r.seq || 0) > (best.seq || 0))) best = r;
      });
      id = best ? best.txId : null;
    }
    if (!id) {
      ui.toast(t('inquiry.noDraft'));
      return;
    }
    start(id, opts);
  }

  /** The draft or completed demo inquiry for a transaction, or null. */
  function draftFor(txId) {
    var s = raw();
    if (!s || !txId) return null;
    var rec = s.txId === txId ? s : othersOf(s)[txId] || null;
    if (!rec || !touched(rec)) return null;
    var r = normalize(rec);
    return { txId: r.txId, step: r.step, status: r.status, ref: r.ref || null, reason: r.reason, channel: r.channel, description: r.description };
  }

  YES.inquiry = { start: start, resume: resume, draftFor: draftFor };
