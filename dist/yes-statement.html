  padding: var(--s4) var(--s5);
  border-radius: var(--radius);
  background: var(--surface-2);
  margin-bottom: var(--s5);
}
.tx-dlg__hero--pending {
  background: color-mix(in srgb, var(--warn-wash) 70%, var(--surface));
  box-shadow: inset 0 0 0 1px var(--warn-line);
}
.tx-dlg__amount {
  margin: 0;
  font-size: clamp(1.75rem, 3vw + 1rem, 2.25rem);
  line-height: 1.15;
  letter-spacing: -0.01em;
}
.tx-dlg__amount .amount {
  font-weight: 700;
}
.tx-dlg__unit {
  flex-basis: 100%;
  order: 3;
  margin: 0;
  font-size: var(--fs-sm);
  color: var(--ink-2);
}
.tx-dlg__heroStatus {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--s2);
  margin-left: auto;
}
.tx-dlg__heroStatus .tx-notin {
  margin-top: 0;
}
.tx-dlg__inq {
  margin-bottom: var(--s5);
}
.tx-dlg__section + .tx-dlg__section {
  margin-top: var(--s6);
  padding-top: var(--s5);
  border-top: 1px solid var(--line);
}
.tx-dlg__section > h3 {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--s2);
  font-size: var(--fs-base);
  margin-bottom: var(--s3);
}
.tx-dlg__section > h3 > .icon {
  color: var(--muted);
}
.tx-kv {
  grid-template-columns: minmax(7.5rem, 36%) 1fr;
  row-gap: var(--s3);
}
.tx-kv dt.tx-kv__copy {
  align-self: center;
}
.tx-kv dd .status {
  vertical-align: middle;
}
.tx-kv dd .tx-notin {
  margin-top: 0;
  vertical-align: middle;
}
.tx-canon {
  display: block;
  margin-top: 2px;
  font-size: var(--fs-xs);
  color: var(--muted);
}
.tx-canon code {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;
  font-size: 0.95em;
  padding: 0 4px;
  border-radius: 4px;
  background: var(--surface-2);
  color: var(--ink-2);
}
.tx-prevnote {
  display: block;
  margin-top: 4px;
}
.tx-copy {
  display: inline-flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--s2);
  max-width: 100%;
}
.tx-copy__value {
  min-width: 0;
}
.tx-copy__btn {
  min-height: 32px;
  padding: 0 10px;
}
.tx-dlg__small {
  margin: var(--s2) 0 0;
  font-size: var(--fs-xs);
  color: var(--muted);
}
.tx-dlg__muted {
  margin: 0;
  font-size: var(--fs-sm);
  color: var(--ink-2);
}
.tx-dlg__lead {
  margin: 0 0 var(--s2);
  font-size: var(--fs-sm);
  color: var(--ink-2);
}
.tx-dlg__tz {
  margin-top: var(--s3);
}

/* Fee lines and linked parent */
.tx-fees {
  list-style: none;
  margin: 0;
  padding: 0;
  border: 1px solid var(--line);
  border-radius: var(--radius);
}
.tx-fee,
.tx-link-card {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--s2) var(--s4);
  padding: var(--s3) var(--s4);
}
.tx-fee + .tx-fee {
  border-top: 1px solid var(--line);
}
.tx-link-card {
  border: 1px solid var(--line);
  border-radius: var(--radius);
}
.tx-fee__text,
.tx-link-card__text {
  flex: 1 1 10rem;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.tx-fee__kind,
.tx-link-card__title {
  font-weight: 650;
  font-size: var(--fs-sm);
}
.tx-fee__id,
.tx-link-card__meta {
  font-size: var(--fs-xs);
  color: var(--muted);
}
.tx-fee__amt {
  margin-left: auto;
}
.tx-fees__total {
  display: flex;
  justify-content: space-between;
  gap: var(--s4);
  margin: var(--s2) 0 0;
  padding: var(--s2) var(--s4);
  font-size: var(--fs-sm);
  font-weight: 650;
}

/* On-chain */
.tx-onchain__notice {
  margin-bottom: var(--s4);
}
.tx-onchain__label {
  margin-bottom: var(--s1);
}
.tx-notes {
  margin: 0;
  padding-left: 1.2em;
  font-size: var(--fs-sm);
  color: var(--ink-2);
}
.tx-notes li + li {
  margin-top: var(--s2);
}

/* Footer: pager + actions */
.tx-dlg__foot {
  justify-content: space-between;
  align-items: center;
}
.tx-pager {
  display: flex;
  align-items: center;
  gap: var(--s1);
}
.tx-pager__pos {
  min-width: 4.5em;
  text-align: center;
  font-size: var(--fs-xs);
  color: var(--muted);
  font-variant-numeric: tabular-nums;
}
.tx-pager__btn {
  width: 40px;
  min-height: 40px;
}
.tx-dlg__actions {
  display: flex;
  flex-wrap: wrap;
  gap: var(--s2);
  margin-left: auto;
}
@media (max-width: 719px) {
  .tx-dlg__head {
    padding-left: var(--s4);
  }
  .tx-dlg__head > .tx-dir {
    display: none;
  }
  .dlg__body.tx-dlg__body {
    padding: var(--s4);
  }
  .tx-dlg__hero {
    padding: var(--s4);
  }
  .tx-dlg__heroStatus {
    margin-left: 0;
  }
  /* Sheet footer: pager + Explain on one row, the primary action full width below. */
  .tx-dlg__foot {
    flex-wrap: wrap;
    justify-content: space-between;
    gap: var(--s2);
    padding: var(--s3) var(--s4);
  }
  .tx-dlg__actions {
    display: contents;
  }
  .dlg__foot.tx-dlg__foot .btn {
    flex: 0 0 auto;
  }
  .dlg__foot.tx-dlg__foot .btn--ai {
    flex: 1 1 auto;
  }
  .dlg__foot.tx-dlg__foot .btn--primary {
    flex: 1 1 100%;
  }
  .tx-pager__btn {
    width: 44px;
    min-height: 44px;
  }
}

@media (forced-colors: active) {
  .tx-check:has(input:checked) {
    outline: 2px solid Highlight;
  }
  .tx-card,
  .tx-filters,
  .tx-empty {
    border: 1px solid CanvasText;
  }
}

/* ---- css/30-inquiry.css ---- */
/*
 * Transaction inquiry dialog (PRD 5.4): a local mock, labelled as a demo at
 * every step. Composes the shared dialog, form, notice and steps components.
 */
@media (min-width: 720px) {
  dialog.dlg--inquiry {
    width: min(640px, calc(100vw - 32px));
  }
}
.inq-shell {
  display: flex;
  flex-direction: column;
  flex: 1 1 auto;
  min-height: 0;
}

/* ------------------------------------------------------------- Header */
.dlg__head.inq-head {
  flex-direction: column;
  align-items: stretch;
  gap: var(--s1);
  padding: var(--s2) var(--s3) var(--s4) var(--s5);
}
.inq-head__bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--s2);
  margin-left: calc(-1 * var(--s3));
}
.btn.inq-head__back {
  padding-inline: var(--s3) var(--s4);
  color: var(--primary-ink);
  font-weight: 650;
}
.inq-head__close {
  flex-shrink: 0;
}
.inq-head__titlebar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--s2) var(--s3);
  padding-right: var(--s3);
}
.dlg__title.inq-head__title {
  flex: 0 1 auto;
  margin: 0;
}
.steps.inq-steps {
  margin: var(--s3) var(--s3) 0 0;
}
.inq-steps__label {
  overflow-wrap: anywhere;
}
.inq-steps li.is-done {
  color: var(--ink-2);
}

/* --------------------------------------------------------------- Body */
.dlg__body.inq-body {
  padding: var(--s5) var(--s5) var(--s6);
}
.inq-body[tabindex='0']:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: -4px;
  border-radius: 0;
}
.inq-body--enter > * {
  animation: yes-fade-up var(--dur) var(--ease) both;
}
.inq-step__title {
  display: flex;
  flex-direction: column;
  gap: 2px;
  margin: 0 0 var(--s2);
  font-size: var(--fs-md);
}
.inq-step__count {
  font-size: var(--fs-xs);
  font-weight: 650;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--muted);
}
.inq-lede {
  margin: 0 0 var(--s4);
  font-size: var(--fs-sm);
  color: var(--ink-2);
  max-width: 60ch;
}
.inq-muted {
  color: var(--muted);
}
.inq-flash {
  margin-bottom: var(--s5);
}
.inq-flash p + p {
  margin-top: var(--s2);
}
.btn--link.inq-linkbtn {
  min-height: 44px;
  margin-block: -12px;
  text-align: left;
  white-space: normal;
}
.inq-note {
  margin-top: var(--s4);
}
.inq-keep {
  display: flex;
  align-items: flex-start;
  gap: var(--s2);
  margin: var(--s6) 0 0;
  font-size: var(--fs-xs);
  color: var(--muted);
}
.inq-keep .icon {
  margin-top: 1px;
}

/* Transaction carried into the inquiry */
.inq-tx {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface);
  overflow: hidden;
}
.inq-tx__top {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--s2) var(--s3);
  padding: var(--s4);
  background: var(--surface-2);
  border-bottom: 1px solid var(--line);
}
.inq-tx--pending .inq-tx__top {
  background: color-mix(in srgb, var(--warn-wash) 70%, var(--surface));
}
.inq-tx__top > .dir {
  width: 40px;
  height: 40px;
}
.inq-tx__name {
  flex: 1 1 12rem;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.inq-tx__type {
  font-size: var(--fs-xs);
  font-weight: 650;
  letter-spacing: 0.02em;
  color: var(--muted);
}
.inq-tx__desc {
  font-weight: 650;
  line-height: 1.35;
}
.inq-tx__amount {
  margin: 0 0 0 auto;
  font-size: var(--fs-lg);
  line-height: 1.2;
}
.inq-kv {
  padding: var(--s4);
  row-gap: var(--s2);
}
.inq-status {
  display: inline-flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--s2);
}
.inq-notin {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: var(--fs-xs);
  font-weight: 600;
  color: var(--ink-2);
}
.inq-tz {
  margin: calc(-1 * var(--s1)) 0 0;
  padding: 0 var(--s4) var(--s4);
  font-size: var(--fs-xs);
  color: var(--muted);
}

/* ----------------------------------------------------------- Details */
.inq-form > * + * {
  margin-top: var(--s6);
}
.inq-form {
  margin-top: var(--s4);
}
.inq-field {
  display: flex;
  flex-direction: column;
  gap: var(--s2);
  min-width: 0;
}
.inq-field.is-invalid {
  padding-left: var(--s4);
  border-left: 4px solid var(--danger);
}
.inq-legend {
  padding: 0;
  margin: 0;
  font-size: var(--fs-base);
  font-weight: 650;
  color: var(--ink);
}
fieldset.inq-group > .inq-legend {
  margin-bottom: var(--s2);
}
.inq-req,
.inq-opt {
  display: inline-block;
  padding: 0 8px;
  border-radius: 999px;
  font-size: var(--fs-xs);
  font-weight: 600;
  line-height: 1.6;
  vertical-align: 2px;
  white-space: nowrap;
}
.inq-req {
  background: var(--surface-2);
  border: 1px solid var(--line-strong);
  color: var(--ink-2);
}
.inq-opt {
  border: 1px solid var(--line);
  color: var(--muted);
}
.inq-hint {
  display: flex;
  align-items: flex-start;
  gap: 6px;
  margin: 0;
}
.inq-hint .icon {
  margin-top: 2px;
}
fieldset.inq-group > .inq-hint {
  margin-bottom: var(--s1);
}
.inq-field .field__hint {
  margin: 0;
}
.inq-error {
  margin: 0;
}
.inq-error .icon {
  margin-top: 1px;
}
.choice.inq-choice {
  font-size: var(--fs-base);
  align-items: flex-start;
  padding: 11px 14px;
  min-height: 48px;
}
.inq-choice__icon {
  color: var(--ink-2);
  margin-top: 2px;
}
.inq-choice__text {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}
.inq-choice__label {
  color: var(--ink);
  font-weight: 400;
  line-height: 1.4;
}
.inq-choice:has(input:checked) .inq-choice__label {
  font-weight: 650;
}
.inq-choice__hint {
  font-size: var(--fs-xs);
  color: var(--muted);
  line-height: 1.4;
}
.inq-choices--channel .inq-choice__label {
  font-size: var(--fs-sm);
  font-weight: 650;
}
.inq-group.is-invalid .inq-choice {
  border-color: color-mix(in srgb, var(--danger) 45%, var(--line));
}
.inq-group.is-invalid .inq-choice:has(input:checked) {
  border-color: var(--primary);
}
@media (min-width: 600px) {
  .inq-choices--channel {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
  .inq-choices--channel .inq-choice {
    flex-wrap: wrap;
    align-content: flex-start;
  }
  .inq-choices--channel .inq-choice__text {
    flex-basis: 100%;
  }
}
.inq-warn {
  padding: var(--s2) var(--s3);
}
.inq-warn p {
  margin: 0;
}
.textarea.inq-textarea {
  min-height: 112px;
  line-height: 1.5;
}
.inq-count {
  margin: 0;
  font-size: var(--fs-xs);
  color: var(--muted);
  text-align: right;
  font-variant-numeric: tabular-nums;
}
.inq-count.is-low {
  color: var(--warn);
  font-weight: 650;
}

/* Error summary: role="alert", focus target, links to each field */
.inq-errors {
  display: flex;
  gap: var(--s3);
  align-items: flex-start;
  margin-bottom: var(--s5);
  padding: var(--s4);
  border: 2px solid var(--danger);
  border-radius: var(--radius);
  background: var(--danger-wash);
  color: var(--ink);
}
.inq-errors > .icon {
  color: var(--danger);
  margin-top: 1px;
}
.inq-errors:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 3px;
}
.inq-errors__body {
  min-width: 0;
}
.inq-errors__title {
  margin: 0 0 var(--s1);
  font-size: var(--fs-base);
}
.inq-errors__list {
  margin: 0;
  padding-left: 1.1em;
  font-size: var(--fs-sm);
}
/* Block links: the bullet aligns with the first line and each target is 44px tall. */
.inq-errors__list a {
  display: block;
  min-height: 44px;
  padding-block: 11px;
  line-height: 1.5;
  color: var(--danger);
  font-weight: 650;
}

/* ------------------------------------------------------------ Review */
.inq-demo-note {
  margin: var(--s2) 0 var(--s5);
}
.inq-review {
  margin: 0;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface);
}
.inq-review__row {
  display: grid;
  grid-template-columns: minmax(7.5rem, 30%) minmax(0, 1fr) auto;
  gap: var(--s1) var(--s4);
  align-items: start;
  padding: var(--s4);
}
.inq-review__row + .inq-review__row {
  border-top: 1px solid var(--line);
}
.inq-review dt {
  font-size: var(--fs-sm);
  color: var(--muted);
}
.inq-review dd {
  margin: 0;
}
.inq-review__value,
.inq-stack {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
  font-size: var(--fs-sm);
  color: var(--ink);
  overflow-wrap: anywhere;
}
.inq-review__strong {
  font-weight: 650;
}
.inq-review__value .amount {
  font-weight: 650;
}
.inq-quote {
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.inq-review__action {
  justify-self: end;
}
@media (max-width: 559px) {
  .inq-review__row {
    grid-template-columns: minmax(0, 1fr) auto;
  }
  .inq-review__row > dt {
    grid-column: 1;
    grid-row: 1;
    align-self: center;
  }
  .inq-review__action {
    grid-column: 2;
    grid-row: 1;
  }
  .inq-review__value {
    grid-column: 1 / -1;
    grid-row: 2;
  }
}

/* ------------------------------------------------------ Confirmation */
.inq-receipt {
  display: flex;
  gap: var(--s4);
  align-items: flex-start;
  padding: var(--s5);
  border: 1px dashed var(--demo-line);
  border-radius: var(--radius-lg);
  background: var(--demo-bg);
  color: var(--ink);
}
.inq-receipt__icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  border: 1px solid var(--demo-line);
  background: var(--surface);
  color: var(--demo-ink);
}
.inq-receipt__main {
  min-width: 0;
}
.inq-receipt__label {
  margin: 0 0 var(--s1);
  font-size: var(--fs-xs);
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--demo-ink);
}
.inq-receipt__ref {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--s2) var(--s3);
  margin: 0 0 var(--s3);
}
.inq-receipt__code {
  font-size: clamp(1.25rem, 1.5vw + 0.95rem, 1.6rem);
  font-weight: 700;
  letter-spacing: 0.04em;
  color: var(--ink);
}
.inq-receipt__ref .tag {
  white-space: normal;
}
.inq-receipt__body {
  margin: 0;
  font-size: var(--fs-sm);
  color: var(--ink);
}
.inq-sec {
  margin-top: var(--s6);
}
.inq-sec__title {
  font-size: var(--fs-base);
  margin-bottom: var(--s3);
}
.inq-sec__p {
  font-size: var(--fs-sm);
  color: var(--ink-2);
}
.inq-kv--done {
  padding: 0;
}
.inq-prod {
  display: grid;
  gap: var(--s3);
  margin: 0;
  padding: 0;
  list-style: none;
}
.inq-prod li {
  display: flex;
  align-items: flex-start;
  gap: var(--s3);
  font-size: var(--fs-sm);
  color: var(--ink-2);
}
.inq-prod__icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  width: 28px;
  height: 28px;
  margin-top: -3px;
  border-radius: 50%;
  background: var(--primary-wash);
  color: var(--primary-ink);
}
.inq-placeholder .tag {
  margin-bottom: var(--s1);
}
.inq-placeholder p {
  margin-bottom: var(--s1);
}

/* ------------------------------------------------------------- Footer */
.dlg__foot.inq-foot {
  align-items: center;
}

/* ------------------------------------------------------- Small screens */
@media (max-width: 719px) {
  .dlg__head.inq-head {
    gap: 2px;
    padding: var(--s1) var(--s2) var(--s3) var(--s4);
  }
  .inq-head__titlebar {
    gap: var(--s2);
  }
  .inq-head__bar {
    margin-left: calc(-1 * var(--s3));
  }
  .inq-head__titlebar,
  .steps.inq-steps {
    padding-right: var(--s2);
    margin-right: 0;
  }
  .dlg__body.inq-body {
    padding: var(--s4) var(--s4) var(--s5);
  }
  .dlg__foot.inq-foot {
    padding: var(--s3) var(--s4);
  }
  .inq-receipt {
    padding: var(--s4);
    gap: var(--s3);
  }
}
@media (max-width: 479px) {
  /* Bars only; the step heading names the step ("Step 2 of 4"). */
  .inq-steps__label {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }
  .steps.inq-steps {
    margin-top: var(--s2);
  }
  .inq-receipt__icon {
    display: none;
  }
  .inq-tx__amount {
    flex-basis: 100%;
    margin-left: 52px;
  }
}

@media (max-width: 359px) {
  /* Keep Back and the primary action on one row; "Back" stays the accessible name. */
  .dlg__foot.inq-foot .btn.inq-foot__back {
    flex: 0 0 44px;
    width: 44px;
    padding: 0;
    border-radius: 50%;
  }
  .inq-foot__back span {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
  }
  .dlg__foot.inq-foot .btn--primary {
    white-space: normal;
    text-align: center;
  }
}

@media (forced-colors: active) {
  .inq-tx,
  .inq-review,
  .inq-receipt,
  .inq-errors {
    border: 1px solid CanvasText;
  }
  .inq-field.is-invalid {
    border-left-color: CanvasText;
  }
}

/* ---- css/40-assistant.css ---- */
/*
 * Ask YES drawer (PRD 5.5). Right-side drawer: docked (non-modal) from 1100px so
 * the page reflows beside it, a modal side drawer from 720px, and a full-screen
 * sheet below 720px. Composes the shared tokens and component classes.
 */
.asst {
  position: fixed;
  inset: 0 0 0 auto;
  z-index: 150;
  width: min(var(--drawer-w), 100vw);
  max-width: 100vw;
  height: 100vh;
  height: 100dvh;
  max-height: none;
  margin: 0;
  padding: 0;
  border: 0;
  border-left: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  box-shadow: var(--shadow-3);
  overflow: hidden;
  overflow: clip; /* the drawer itself never scrolls; only its body does */
}
.asst[open] {
  display: flex;
  flex-direction: column;
  animation: yes-slide-in-right var(--dur) var(--ease);
}
.asst::backdrop {
  background: var(--overlay);
}
.asst--docked {
  box-shadow: var(--shadow-2);
}
@media (min-width: 720px) and (max-width: 1099px) {
  .asst {
    width: min(440px, calc(100vw - 48px));
  }
}
@media (max-width: 719px) {
  .asst {
    width: 100vw;
    border-left: 0;
    box-shadow: none;
  }
  .asst[open] {
    animation-name: yes-fade-up;
  }
}

/* ------------------------------------------------------------- Header */
.asst__head {
  position: relative;
  flex: none;
  padding: var(--s3) var(--s3) var(--s3) var(--s5);
  border-bottom: 1px solid var(--line);
  background: var(--surface);
}
.asst__bar {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  grid-template-areas:
    'mark title close'
    'mark tag tag';
  align-items: center;
  column-gap: var(--s3);
  row-gap: 2px;
}
.asst__mark {
  grid-area: mark;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--ai-wash);
  color: var(--ai);
}
.asst__title {
  grid-area: title;
  margin: 0;
  font-size: var(--fs-lg);
  overflow-wrap: anywhere;
}
.asst__tagline {
  grid-area: tag;
  margin: 0;
}
.asst__close {
  grid-area: close;
  color: var(--ink-2);
}
.asst__ctx {
  margin: var(--s3) 0 0;
  padding: 6px var(--s3);
  border-radius: var(--radius);
  background: var(--surface-2);
  border: 1px solid var(--line);
  font-size: var(--fs-sm);
  line-height: 1.45;
  overflow-wrap: anywhere;
}
.asst__ctx-k {
  color: var(--ink-2);
  font-weight: 650;
  margin-right: 2px;
}
.asst__ctx-v {
  font-weight: 600;
}

/* --------------------------------------------------------------- Body */
.asst__body {
  position: relative; /* contains absolutely positioned .sr-only text inside the scroller */
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: var(--s4) var(--s5) var(--s6);
  background: var(--bg);
}
.asst__privacy {
  margin-bottom: var(--s5);
}
.asst__privacy p {
  margin: 0;
}
.asst__prod {
  margin-top: 2px;
}
.asst__prod > summary {
  display: inline-flex;
  align-items: center;
  min-height: 44px;
  cursor: pointer;
  color: var(--primary-ink);
  font-weight: 650;
  text-decoration: underline;
  text-underline-offset: 2px;
  border-radius: 4px;
}
.asst__prod > summary:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 2px;
}
.asst__prod > p {
  margin-top: var(--s2);
  color: var(--ink-2);
}

/* Thread */
.asst-thread {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: var(--s6);
}
.asst-turn {
  display: flex;
  flex-direction: column;
  gap: var(--s2);
  min-width: 0;
}
.asst-turn--new {
  animation: yes-fade-up var(--dur) var(--ease) both;
}
.asst-you {
  align-self: flex-end;
  max-width: 88%;
  margin: 0;
  padding: var(--s2) var(--s3);
  border-radius: var(--radius) var(--radius) 4px var(--radius);
  background: var(--primary-wash);
  border: 1px solid color-mix(in srgb, var(--primary) 25%, var(--line));
  font-size: var(--fs-sm);
  font-weight: 600;
  overflow-wrap: anywhere;
}
.asst-you .amount {
  font-weight: 650;
}
.asst-you--ctx {
  display: inline-flex;
  align-items: flex-start;
  gap: 6px;
  background: transparent;
  border: 1px dashed color-mix(in srgb, var(--ai) 45%, var(--line));
  color: var(--ink-2);
  font-weight: 600;
}
.asst-you--ctx > .icon {
  margin-top: 3px;
  color: var(--ai);
}
.asst-you--ctx .amount {
  color: var(--ink);
}

/* Answer card */
.asst-ans {
  min-width: 0;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-1);
  padding: var(--s4);
}
.asst-ans--policy {
  border-color: color-mix(in srgb, var(--ai) 35%, var(--line));
}
.asst-ans__tags {
  display: flex;
  flex-wrap: wrap;
  gap: var(--s1) var(--s2);
  margin: 0 0 var(--s2);
}
.asst-tag-policy .icon {
  color: var(--ai);
}
.asst-ans__title {
  font-size: var(--fs-md);
  margin: 0 0 var(--s2);
  overflow-wrap: anywhere;
}
.asst-ans__title:focus-visible {
  outline-offset: 3px;
}
.asst-ans__text {
  font-size: var(--fs-sm);
  color: var(--ink);
}
.asst-ans__text p {
  margin: 0 0 var(--s2);
}
.asst-ans__text p:last-child {
  margin-bottom: 0;
}
.asst-ans__list {
  margin: 0 0 var(--s2);
  padding-left: var(--s5);
}
.asst-ans__list li + li {
  margin-top: var(--s1);
}
.asst-num {
  font-variant-numeric: tabular-nums;
  font-weight: 650;
  white-space: nowrap;
}

/* Sections inside an answer */
.asst-sec {
  margin-top: var(--s4);
}
.asst-sec__h {
  display: flex;
  align-items: center;
  gap: 6px;
  margin: 0 0 var(--s2);
  font-size: var(--fs-xs);
  font-weight: 700;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--ink-2);
}
.asst-sec__h .icon {
  color: var(--muted);
}
.asst-figs {
  font-size: var(--fs-sm);
  border-top: 1px solid var(--line);
}
.asst-figs th,
.asst-figs td {
  padding: 7px 0;
  border-bottom: 1px solid var(--line);
  vertical-align: top;
}
.asst-figs th {
  text-align: left;
  font-weight: 500;
  color: var(--ink-2);
  padding-right: var(--s3);
}
.asst-figs td {
  text-align: right;
}
.asst-figs td.num {
  white-space: nowrap;
}
.asst-figs td.txt {
  overflow-wrap: anywhere;
  font-weight: 600;
}
.asst-figs tr.is-total th,
.asst-figs tr.is-total td {
  border-top: 2px solid var(--line-strong);
  color: var(--ink);
  font-weight: 700;
}
.asst-sum {
  display: flex;
  flex-direction: column;
  gap: 2px;
  margin: var(--s2) 0 0;
  padding: var(--s2) var(--s3);
  border-radius: var(--radius-sm);
  background: var(--surface-2);
  font-size: var(--fs-xs);
}
.asst-sum__k {
  color: var(--ink-2);
  font-weight: 650;
}
.asst-sum__eq {
  font-variant-numeric: tabular-nums;
  color: var(--ink);
}
.asst-sum__eq > span {
  white-space: nowrap;
}
.asst-sum__res {
  font-weight: 700;
}

/* Supporting rows */
.asst-rows {
  list-style: none;
  margin: 0;
  padding: 0;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
  background: var(--surface);
}
.asst-rows li + li {
  border-top: 1px solid var(--line);
}
.asst-row {
  display: flex;
  align-items: center;
  gap: var(--s3);
  width: 100%;
  min-height: 52px;
  padding: var(--s2) var(--s2) var(--s2) var(--s3);
  border: 0;
  background: transparent;
  color: var(--ink);
  text-align: left;
  transition: background-color var(--dur) var(--ease);
}
.asst-row:hover {
  background: var(--surface-2);
}
.asst-row:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: -3px;
  border-radius: var(--radius-sm);
}
.asst-row .dir {
  width: 28px;
  height: 28px;
}
.asst-row__main {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
/* Description and amount share a line when there is room; the amount drops
   below (right-aligned) on narrow screens instead of squeezing the text. */
.asst-row__top {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 2px var(--s3);
}
.asst-row__desc {
  flex: 1 1 100px;
  min-width: 0;
  font-size: var(--fs-sm);
  font-weight: 600;
  line-height: 1.3;
}
.asst-row__amt {
  flex: none;
  margin-left: auto;
  font-size: var(--fs-sm);
  text-align: right;
}
.asst-row__meta {
  font-size: var(--fs-xs);
  color: var(--muted);
}
.asst-row__id,
.asst-id {
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
.asst-row__chev {
  color: var(--muted);
}
.asst-sec__actions {
  display: flex;
  flex-wrap: wrap;
  gap: var(--s2);
  margin-top: var(--s2);
}
.asst-sec__actions .btn {
  white-space: normal;
  text-align: left;
}

/* Inline and footer suggestions */
.asst-inline-q {
  margin-top: var(--s4);
}
.asst-inline-q__k {
  margin: 0 0 var(--s2);
  font-size: var(--fs-sm);
  font-weight: 650;
}
.asst-qlist {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-wrap: wrap;
  gap: var(--s2);
}
.asst-q {
  display: inline-flex;
  align-items: center;
  gap: var(--s2);
  min-height: 44px;
  padding: var(--s2) var(--s4) var(--s2) var(--s3);
  border-radius: 22px;
  border: 1px solid color-mix(in srgb, var(--ai) 40%, var(--line));
  background: var(--surface);
  color: var(--ink);
  font-size: var(--fs-sm);
  font-weight: 600;
  line-height: 1.3;
  text-align: left;
  transition: background-color var(--dur) var(--ease), border-color var(--dur) var(--ease);
}
.asst-q .icon {
  color: var(--ai);
}
.asst-q:hover {
  background: var(--ai-wash);
  border-color: var(--ai);
}
.asst-q:focus-visible {
  outline: none;
  box-shadow: var(--focus-ring);
}

/* Source, feedback and human help */
.asst-src {
  display: flex;
  align-items: flex-start;
  gap: 6px;
  margin: var(--s4) 0 0;
  font-size: var(--fs-xs);
  color: var(--muted);
}
.asst-src .icon {
  margin-top: 2px;
}
.asst-ans__foot {
  display: flex;
  flex-direction: column;
  gap: var(--s2);
  margin-top: var(--s3);
  padding-top: var(--s3);
  border-top: 1px solid var(--line);
}
.asst-ans--welcome .asst-ans__foot {
  border-top: 0;
  padding-top: 0;
}
.asst-fb__row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--s2);
}
.asst-fb__q {
  font-size: var(--fs-sm);
  font-weight: 650;
  margin-right: auto;
}
.asst-fb__btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 44px;
  min-width: 64px;
  padding: 0 var(--s3);
  border-radius: 999px;
  border: 1px solid var(--line-strong);
  background: var(--surface);
  color: var(--ink);
  font-size: var(--fs-sm);
  font-weight: 600;
  justify-content: center;
}
.asst-fb__btn:hover {
  background: var(--surface-2);
}
.asst-fb__btn:focus-visible {
  outline: none;
  box-shadow: var(--focus-ring);
}
.asst-fb__btn[aria-pressed='true'] {
  background: var(--primary);
  border-color: var(--primary);
  color: var(--on-primary);
}
.asst-fb__note {
  display: flex;
  align-items: flex-start;
  gap: 6px;
  margin: var(--s1) 0 0;
  font-size: var(--fs-xs);
  color: var(--muted);
}
.asst-fb__note .icon {
  margin-top: 2px;
  color: var(--ok);
}
.asst-ans__links {
  display: flex;
  flex-wrap: wrap;
  gap: var(--s1) var(--s2);
  margin-left: calc(var(--s3) * -1);
}
.asst-ans__links .btn {
  color: var(--primary-ink);
}

.asst-sugg {
  margin-top: var(--s8);
}
.asst-sugg__h {
  font-size: var(--fs-sm);
  font-weight: 700;
  color: var(--ink-2);
  margin-bottom: var(--s3);
}
.asst-clear {
  margin: var(--s5) 0 0;
}
.asst-clear .btn {
  color: var(--ink-2);
}

/* ---------------------------------------------------------- Ask form */
.asst__form {
  position: relative;
  flex: none;
  padding: var(--s3) var(--s5) calc(var(--s3) + env(safe-area-inset-bottom, 0px));
  border-top: 1px solid var(--line);
  background: var(--surface);
}
.asst__label {
  display: block;
  margin-bottom: 6px;
  font-size: var(--fs-sm);
  font-weight: 650;
}
.asst__row {
  display: flex;
  gap: var(--s2);
}
.asst__row .input {
  flex: 1;
  min-width: 0;
  border-radius: 999px;
  padding-inline: var(--s4);
}
.asst__send {
  flex: none;
}
.asst__hint {
  display: flex;
  align-items: flex-start;
  gap: 6px;
  margin: var(--s2) 0 0;
  font-size: var(--fs-xs);
  color: var(--muted);
}
.asst__hint .icon {
  margin-top: 2px;
  flex: none;
}

@media (max-width: 379px) {
  .asst__head {
    padding-left: var(--s4);
  }
  .asst__mark {
    display: none;
  }
  .asst__bar {
    grid-template-columns: minmax(0, 1fr) auto;
    grid-template-areas:
      'title close'
      'tag tag';
  }
  .asst__body {
    padding-inline: var(--s3);
  }
  .asst__form {
    padding-inline: var(--s3);
  }
  .asst-ans {
    padding: var(--s3);
  }
  .asst-fb__q {
    flex-basis: 100%;
  }
  .asst__send span {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
  }
  .asst__send {
    width: 44px;
    padding: 0;
    border-radius: 50%;
  }
}

@media (forced-colors: active) {
  .asst {
    border-left: 1px solid CanvasText;
  }
  .asst-q,
  .asst-fb__btn,
  .asst-ans,
  .asst-you,
  .asst__ctx {
    border: 1px solid CanvasText;
  }
  .asst-fb__btn[aria-pressed='true'] {
    outline: 2px solid Highlight;
  }
}

/* ---- css/50-understand.css ---- */
/*
 * Understand view: stablecoin education accordion, statement versus live
 * balance, sample on-chain reference and the illustrative reserve /
 * transparency panel. Tokens only; works in both colour schemes.
 */

#understand-root {
  padding-bottom: var(--s8);
}

/* ---------------------------------------------------------------- Header */
.und-head {
  margin-bottom: var(--s6);
}
.und-lede {
  margin-bottom: var(--s3);
}
.und-gov {
  display: flex;
  align-items: flex-start;
  gap: var(--s2);
  max-width: 72ch;
  margin: 0 0 var(--s5);
  color: var(--muted);
  font-size: var(--fs-sm);
}
.und-gov .icon {
  margin-top: 2px;
  color: var(--muted);
}
.und-jump__list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-wrap: wrap;
  gap: var(--s2);
}
.und-jump__link {
  display: inline-flex;
  align-items: center;
  gap: var(--s2);
  min-height: 44px;
  padding: 0 var(--s4) 0 var(--s3);
  border-radius: 999px;
  border: 1px solid var(--line-strong);
  background: var(--surface);
  color: var(--ink);
  font-size: var(--fs-sm);
  font-weight: 600;
  text-decoration: none;
}
.und-jump__link .icon {
  color: var(--primary-ink);
}
.und-jump__link:hover {
  background: var(--surface-2);
  border-color: var(--ink-2);
}
.und-jump__link:focus-visible {
  outline: none;
  box-shadow: var(--focus-ring);
}
@media (max-width: 559px) {
  .und-jump__list {
    display: grid;
    grid-template-columns: 1fr 1fr;
  }
  .und-jump__link {
    width: 100%;
    border-radius: var(--radius);
    padding: var(--s2) var(--s3);
    line-height: 1.25;
  }
}
@media (max-width: 359px) {
  .und-jump__list {
    grid-template-columns: 1fr;
  }
}

/* ---------------------------------------------------------------- Layout */
.und-layout {
  display: grid;
  gap: var(--s6);
  align-items: start;
}
.und-main,
.und-side {
  display: grid;
  gap: var(--s6);
  min-width: 0;
}
@media (min-width: 1024px) {
  .und-layout {
    grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr);
  }
}
.und-tp {
  margin-top: var(--s6);
}

/* ----------------------------------------------------------- Panel head */
.und-panel {
  min-width: 0;
  container: und-panel / inline-size;
}
.und-panel__head {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: var(--s2) var(--s3);
  margin-bottom: var(--s2);
}
.und-panel__icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: var(--primary-wash);
  color: var(--primary-ink);
  flex-shrink: 0;
}
.und-panel__title {
  margin: 0;
  font-size: var(--fs-lg);
  flex: 1 1 0;
  min-width: 9rem;
}
.und-panel__title:focus-visible {
  outline-offset: 4px;
}
.und-panel__tag {
  flex-shrink: 0;
}
.und-panel__lede {
  color: var(--ink-2);
  font-size: var(--fs-sm);
  max-width: 62ch;
  margin-bottom: var(--s4);
}

/* -------------------------------------------------------------- Basics */
.und-basics__top {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: var(--s3);
  justify-content: space-between;
  margin-bottom: var(--s2);
}
.und-basics__top .und-panel__head {
  margin-bottom: 0;
  flex: 1 1 auto;
  min-width: 0;
}
.und-all {
  flex-shrink: 0;
}
@media (pointer: coarse), (max-width: 719px) {
  .und-all {
    min-height: 44px;
  }
}

/* Accordion */
.und-acc {
  list-style: none;
  margin: 0;
  padding: 0;
}
.und-acc__item {
  border-top: 1px solid var(--line);
}
.und-acc__item:last-child {
  border-bottom: 1px solid var(--line);
}
.und-acc__h {
  margin: 0;
  font-size: inherit;
  font-weight: inherit;
  letter-spacing: normal;
}
.und-acc__btn {
  display: flex;
  align-items: center;
  gap: var(--s3);
  width: 100%;
  min-height: 68px;
  margin: 0;
  padding: var(--s3) var(--s2);
  border: 0;
  border-radius: var(--radius-sm);
  background: transparent;
  color: var(--ink);
  text-align: left;
  font: inherit;
  transition: background-color var(--dur) var(--ease);
}
.und-acc__btn:hover {
  background: var(--surface-2);
}
.und-acc__btn:focus-visible {
  outline: none;
  box-shadow: inset 0 0 0 2px var(--focus);
}
.und-acc__icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: var(--surface-2);
  color: var(--primary-ink);
  flex-shrink: 0;
  transition: background-color var(--dur) var(--ease);
}
.und-acc__btn[aria-expanded='true'] .und-acc__icon {
  background: var(--primary-wash);
}
.und-acc__label {
  display: flex;
  flex-direction: column;
  gap: 2px;
  flex: 1;
  min-width: 0;
}
.und-acc__title {
  font-size: var(--fs-md);
  font-weight: 650;
  line-height: 1.3;
}
.und-acc__teaser {
  font-size: var(--fs-sm);
  color: var(--muted);
  line-height: 1.35;
}
.und-acc__chev {
  color: var(--ink-2);
  transition: transform var(--dur) var(--ease);
}
.und-acc__btn[aria-expanded='true'] .und-acc__chev {
  transform: rotate(180deg);
}
.und-acc__panel {
  padding: 0 var(--s2) var(--s5) calc(40px + var(--s3) + var(--s2));
}
.und-acc__text-body p {
  color: var(--ink-2);
  max-width: 64ch;
}
@media (max-width: 559px) {
  .und-acc__btn {
    padding-inline: var(--s1);
  }
  .und-acc__icon {
    width: 36px;
    height: 36px;
  }
  .und-acc__panel {
    padding: 0 var(--s1) var(--s5);
  }
}

/* Example from the customer's own statement */
.und-example {
  margin: var(--s4) 0 0;
  padding: var(--s4);
  border-radius: var(--radius);
  background: var(--surface-2);
}
.und-example__eyebrow {
  display: flex;
  align-items: center;
  gap: 6px;
  margin: 0 0 var(--s3);
  font-size: var(--fs-xs);
  font-weight: 650;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--muted);
}
.und-example__eyebrow .icon {
  color: var(--primary-ink);
}
.und-example__text {
  margin: 0;
  font-size: var(--fs-sm);
  color: var(--ink-2);
}
.und-facts {
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  gap: var(--s2);
  margin: 0;
}
@container und-panel (min-width: 440px) {
  .und-facts {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  .und-fact:last-child:nth-child(odd) {
    grid-column: 1 / -1;
  }
}
.und-example > .und-lines + .und-facts,
.und-example > .und-example__text + .und-facts {
  margin-top: var(--s3);
}
.und-fact {
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-width: 0;
  padding: var(--s3);
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  background: var(--surface);
}
.und-fact dt {
  font-size: var(--fs-xs);
  color: var(--muted);
  font-weight: 600;
  line-height: 1.35;
}
.und-fact dd {
  margin: 0;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 4px;
  min-width: 0;
}
.und-fact__value {
  font-weight: 650;
  font-variant-numeric: tabular-nums;
  color: var(--ink);
  overflow-wrap: anywhere;
}
.und-fact__value .amount {
  white-space: normal;
}
.und-fact__note {
  font-size: var(--fs-xs);
  color: var(--ink-2);
  line-height: 1.4;
}

/* Ledger-style lines (fees, redemptions) */
.und-lines {
  list-style: none;
  margin: 0;
  padding: 0;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  background: var(--surface);
  overflow: hidden;
}
.und-line {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: var(--s3);
  padding: var(--s3);
}
.und-line + .und-line {
  border-top: 1px solid var(--line);
}
.und-line__main {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}
.und-line__desc {
  font-size: var(--fs-sm);
  font-weight: 600;
  color: var(--ink);
}
.und-line__meta {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px var(--s2);
  font-size: var(--fs-xs);
  color: var(--ink-2);
}
.und-line__amt {
  font-size: var(--fs-sm);
  flex-shrink: 0;
}
.und-line--pending {
  background: color-mix(in srgb, var(--warn-wash) 55%, var(--surface));
}
.und-lines__total {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: var(--s3);
  margin: var(--s3) 0 0;
  padding: 0 var(--s3);
  font-size: var(--fs-sm);
  font-weight: 650;
}
.und-lines__count {
  font-weight: 400;
  color: var(--ink-2);
  white-space: nowrap;
}
@media (max-width: 419px) {
  .und-line {
    flex-direction: column;
    gap: var(--s1);
  }
}

/* Actions and content record */
.und-actions {
  display: flex;
  flex-wrap: wrap;
  gap: var(--s2);
  margin-top: var(--s4);
}
.und-actions .btn {
  white-space: normal;
  text-align: left;
  min-height: 44px;
}
.und-go {
  padding-inline: var(--s3);
}
.und-meta {
  margin-top: var(--s4);
  border-top: 1px dashed var(--line-strong);
  font-size: var(--fs-xs);
  color: var(--muted);
  line-height: 1.5;
}
.und-meta__sum {
  list-style: none;
  display: flex;
  align-items: center;
  gap: 6px;
  min-height: 44px;
  padding: var(--s1) var(--s1);
  margin-inline: calc(-1 * var(--s1));
  border-radius: var(--radius-sm);
  cursor: pointer;
  color: var(--ink-2);
}
.und-meta__sum::-webkit-details-marker {
  display: none;
}
.und-meta__sum:hover {
  background: var(--surface-2);
}
.und-meta__sum:focus-visible {
  outline: none;
  box-shadow: inset 0 0 0 2px var(--focus);
}
.und-meta__sum > .icon:first-child {
  color: var(--muted);
}
.und-meta__sumtext {
  flex: 1;
  min-width: 0;
}
.und-meta__title {
  font-weight: 650;
}
.und-meta__src {
  color: var(--muted);
}
.und-meta__chev {
  color: var(--ink-2);
  transition: transform var(--dur) var(--ease);
}
.und-meta[open] .und-meta__chev {
  transform: rotate(180deg);
}
.und-meta__list {
  display: flex;
  flex-wrap: wrap;
  gap: 2px var(--s4);
  margin: 0;
  padding: 0 0 var(--s1) 20px;
}
.und-meta__list > div {
  min-width: 0;
}
.und-meta__list dt {
  display: inline;
}
.und-meta__list dt::after {
  content: ': ';
}
.und-meta__list dd {
  display: inline;
  margin: 0;
  color: var(--ink-2);
  overflow-wrap: anywhere;
}
.und-meta__id {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;
  font-size: 0.95em;
  overflow-wrap: anywhere;
}

/* Unavailable (governance) states */
.und-unavail {
  margin-top: var(--s2);
}
.und-unavail-card {
  padding: var(--s4);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface);
}
.und-unavail-card__head {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: var(--s2);
  margin-bottom: var(--s2);
}
.und-unavail-card__name {
  font-weight: 650;
}
.und-unavail-card .status {
  white-space: normal;
}
.und-unavail-card p {
  margin: 0;
  font-size: var(--fs-sm);
  color: var(--ink-2);
}

/* Placeholder value: a slot where a verified value would appear */
.und-ph {
  display: inline;
  padding: 1px 6px;
  border: 1px dashed var(--line-strong);
  border-radius: var(--radius-sm);
  background: var(--surface-2);
  color: var(--ink-2);
  font-weight: 500;
  font-size: var(--fs-sm);
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
  overflow-wrap: anywhere;
}

/* --------------------------------------------- Statement versus live */
.und-live__snap,
.und-live__live {
  padding: var(--s4);
  border-radius: var(--radius);
}
.und-live__snap {
  border: 1px solid var(--line);
  border-left: 4px solid var(--primary);
  background: var(--surface);
}
.und-live__live {
  border: 1px dashed var(--line-strong);
  background: var(--surface-2);
}
.und-live__top {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: var(--s2);
  margin-bottom: var(--s2);
}
.und-live__h {
  margin: 0;
  font-size: var(--fs-base);
}
.und-live__label {
  margin: 0;
  font-size: var(--fs-xs);
  color: var(--muted);
  font-weight: 600;
}
.und-live__amount {
  margin: 0 0 var(--s2);
  font-size: 1.75rem;
  line-height: 1.2;
  letter-spacing: -0.01em;
}
.und-live__amount .amount {
  font-weight: 700;
}
.und-live__line {
  display: flex;
  align-items: flex-start;
  gap: var(--s2);
  margin: 0 0 4px;
  font-size: var(--fs-sm);
  color: var(--ink-2);
}
.und-live__line:last-child {
  margin-bottom: 0;
}
.und-live__line .icon {
  margin-top: 2px;
  color: var(--muted);
}
.und-live__divider {
  display: flex;
  align-items: center;
  gap: var(--s3);
  margin: var(--s3) 0;
  font-size: var(--fs-xs);
  font-weight: 650;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--muted);
}
.und-live__divider::before,
.und-live__divider::after {
  content: '';
  flex: 1;
  border-top: 1px dashed var(--line-strong);
}
.und-live__nc {
  font-size: var(--fs-sm);
  font-weight: 600;
  margin-bottom: var(--s3);
}
.und-live__kv {
  display: grid;
  gap: var(--s2);
  margin: 0 0 var(--s3);
  font-size: var(--fs-sm);
}
.und-live__kv > div {
  display: grid;
  grid-template-columns: minmax(7.5rem, 38%) 1fr;
  gap: var(--s3);
}
.und-live__kv dt {
  color: var(--muted);
}
.und-live__kv dd {
  margin: 0;
  color: var(--ink-2);
  min-width: 0;
}
.und-live__prod {
  margin: 0;
  font-size: var(--fs-xs);
  color: var(--ink-2);
}
.und-tag--record {
  background: var(--primary-wash);
  border-color: color-mix(in srgb, var(--primary) 35%, var(--line));
  color: var(--ink);
}
.und-tag--record .icon {
  color: var(--primary-ink);
}
.und-tag--off .icon {
  color: var(--muted);
}
.und-diff__title {
  margin: var(--s5) 0 var(--s2);
  font-size: var(--fs-base);
}
.und-diff {
  list-style: none;
  margin: 0 0 var(--s2);
  padding: 0;
}
.und-diff__item {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 6px;
  font-size: var(--fs-sm);
  color: var(--ink);
}
.und-diff__other {
  font-size: var(--fs-sm);
  color: var(--ink-2);
  margin: 0;
}
@container und-panel (max-width: 339px) {
  .und-live__kv > div {
    grid-template-columns: 1fr;
    gap: 0;
  }
}

/* --------------------------------------------------- On-chain reference */
.und-label {
  margin-bottom: var(--s4);
}
.und-label__text {
  margin-bottom: 2px;
}
.und-label p:not(.und-label__text) {
  color: var(--ink-2);
}
.und-oc__tx {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto;
  align-items: center;
  gap: var(--s1) var(--s3);
  padding: var(--s3);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  margin-bottom: var(--s4);
}
.und-oc__txmain {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}
.und-oc__desc {
  font-size: var(--fs-sm);
  font-weight: 600;
}
.und-oc__txmeta {
  font-size: var(--fs-xs);
  color: var(--ink-2);
}
.und-oc__txmeta > span {
  white-space: nowrap;
}
.und-oc__amt {
  font-size: var(--fs-sm);
  flex-shrink: 0;
}
.und-oc__kv {
  display: grid;
  gap: 0;
  margin: 0;
  font-size: var(--fs-sm);
}
.und-oc__kv > div {
  display: grid;
  grid-template-columns: minmax(7rem, 30%) 1fr;
  gap: var(--s3);
  padding: var(--s2) 0;
  border-top: 1px solid var(--line);
}
.und-oc__kv > div:first-child {
  border-top: 0;
  padding-top: 0;
}
.und-oc__kv dt {
  color: var(--muted);
}
.und-oc__kv dd {
  margin: 0;
  min-width: 0;
  color: var(--ink);
}
.und-hash {
  display: inline-block;
  max-width: 100%;
  padding: 2px 6px;
  border-radius: var(--radius-sm);
  background: var(--surface-2);
  color: var(--ink);
  line-height: 1.5;
}
.und-hash__actions {
  display: flex;
  flex-wrap: wrap;
  gap: var(--s2);
  margin-top: var(--s2);
}
@media (pointer: coarse), (max-width: 719px) {
  .und-hash__actions .btn {
    min-height: 44px;
  }
}
.und-oc__note {
  display: block;
  font-size: var(--fs-xs);
  color: var(--ink-2);
}
.und-oc__unverified,
.und-oc__nolink {
  display: flex;
  align-items: flex-start;
  gap: 6px;
}
.und-oc__unverified .icon {
  color: var(--warn);
  margin-top: 2px;
}
.und-oc__nolink .icon {
  color: var(--muted);
  margin-top: 2px;
}
.und-oc__why {
  margin-top: var(--s3);
  padding: var(--s3) var(--s4);
  border-radius: var(--radius);
  background: var(--surface-2);
}
.und-oc__why-title {
  margin: 0 0 4px;
  font-size: var(--fs-sm);
}
.und-oc__why p {
  margin: 0;
  font-size: var(--fs-sm);
  color: var(--ink-2);
}
@container und-panel (max-width: 459px) {
  .und-oc__tx {
    grid-template-columns: auto minmax(0, 1fr);
    align-items: start;
  }
  .und-oc__tx .dir {
    grid-row: span 2;
  }
  .und-oc__amt {
    grid-column: 2;
  }
}
@container und-panel (max-width: 359px) {
  .und-oc__kv > div {
    grid-template-columns: 1fr;
    gap: 2px;
  }
}

/* -------------------------------------------- Reserves and transparency */
.und-tp__grid {
  display: grid;
  gap: var(--s6);
}
@media (min-width: 860px) {
  .und-tp__grid {
    grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr);
    gap: var(--s8);
  }
}
.und-tp__col {
  min-width: 0;
}
.und-tp__h {
  font-size: var(--fs-base);
  margin-bottom: var(--s3);
}
.und-tp__hrow {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: var(--s2);
  margin-bottom: var(--s3);
}
.und-tp__hrow .und-tp__h {
  margin: 0;
}
.und-slots {
  margin: 0;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
}
.und-slot {
  display: grid;
  grid-template-columns: minmax(8.5rem, 34%) 1fr;
  gap: var(--s3);
  padding: var(--s3) var(--s4);
  font-size: var(--fs-sm);
}
.und-slot + .und-slot {
  border-top: 1px solid var(--line);
}
.und-slot dt {
  font-weight: 600;
  color: var(--ink);
}
.und-slot dd {
  margin: 0;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px var(--s2);
  min-width: 0;
}
.und-slot__rec {
  flex-basis: 100%;
  font-size: var(--fs-xs);
  color: var(--muted);
}
.und-slot__na {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  color: var(--ink-2);
}
.und-slot__prov {
  flex-basis: 100%;
  font-size: var(--fs-xs);
  color: var(--ink-2);
}
.und-tp__nolinks {
  display: flex;
  align-items: flex-start;
  gap: var(--s2);
  margin: var(--s3) 0 0;
  font-size: var(--fs-xs);
  color: var(--ink-2);
}
.und-tp__nolinks .icon {
  color: var(--muted);
  margin-top: 1px;
}
@container und-panel (max-width: 479px) {
  .und-slot {
    grid-template-columns: 1fr;
    gap: 4px;
    padding: var(--s3);
  }
}
.und-rules {
  list-style: none;
  margin: 0 0 var(--s5);
  padding: 0;
  display: grid;
  gap: var(--s3);
}
.und-rules li {
  display: flex;
  align-items: flex-start;
  gap: var(--s3);
  font-size: var(--fs-sm);
  color: var(--ink);
}
.und-rules__n {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: var(--primary-wash);
  color: var(--primary-ink);
  font-size: var(--fs-xs);
  font-weight: 700;
  flex-shrink: 0;
}
.und-preview {
  padding: var(--s4);
  border: 1px dashed var(--line-strong);
  border-radius: var(--radius);
  background: var(--surface-2);
}
.und-preview__head {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: var(--s2);
  margin-bottom: var(--s3);
}
.und-preview__title {
  margin: 0;
  font-size: var(--fs-sm);
}
@container und-panel (max-width: 300px) {
  .und-preview,
  .und-unavail-card,
  .und-example {
    padding: var(--s3);
  }
  .und-unavail-card .status {
    border-radius: var(--radius-sm);
  }
}

/* Forced colours: keep panel and placeholder boundaries visible. */
@media (forced-colors: active) {
  .und-ph,
  .und-fact,
  .und-lines,
  .und-live__snap,
  .und-live__live,
  .und-preview,
  .und-slots,
  .und-oc__tx {
    border: 1px solid CanvasText;
  }
  .und-acc__btn:focus-visible {
    outline: 2px solid Highlight;
  }
}

/* ---- css/60-help.css ---- */
/*
 * Help view: contextual help, contact placeholders, feedback, statement record,
 * integrity checks, accessibility statement, connected-enhancement table, and
 * the statement-of-record print view (#print-root, print media only).
 */

/* ------------------------------------------------------------ Layout */
#help-root {
  padding-bottom: var(--s8);
}
.help-quick {
  display: grid;
  gap: var(--s4);
  margin-bottom: var(--s8);
}
@media (min-width: 720px) {
  .help-quick {
    grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr);
  }
}
.help-quick__card {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: var(--s2);
  min-width: 0;
}
.help-quick__head {
  display: flex;
  align-items: center;
  gap: var(--s3);
}
.help-quick__title {
  font-size: var(--fs-lg);
  margin: 0;
}
.help-quick__body {
  color: var(--ink-2);
  max-width: 60ch;
  margin: 0;
}
.help-quick__card > div:last-child,
.help-quick__card > .help-actions {
  margin-top: auto;
  width: 100%;
}
.help-quick__icon,
.help-sec__icon,
.help-feature__icon,
.help-contact__icon,
.help-enh__icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  background: var(--primary-wash);
  color: var(--primary-ink);
  flex-shrink: 0;
}
.help-quick__icon {
  width: 44px;
  height: 44px;
}
.help-quick__icon--ai {
  background: var(--ai-wash);
  color: var(--ai);
}
.help-quick__note {
  margin-top: var(--s3);
}

.help-layout {
  display: grid;
  gap: var(--s6);
}
@media (min-width: 1024px) {
  .help-layout {
    grid-template-columns: 216px minmax(0, 1fr);
    gap: var(--s8);
    align-items: start;
  }
}

/* Table of contents: wrapping pills on small screens, sticky list on desktop. */
.help-toc__title {
  font-size: var(--fs-xs);
  font-weight: 650;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--muted);
  margin: 0 0 var(--s2);
}
.help-toc__list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-wrap: wrap;
  gap: var(--s2);
}
.help-toc__link {
  display: inline-flex;
  align-items: center;
  gap: var(--s2);
  min-height: 44px;
  padding: 0 var(--s4) 0 var(--s3);
  border-radius: 999px;
  border: 1px solid var(--line-strong);
  background: var(--surface);
  color: var(--ink);
  font-size: var(--fs-sm);
  font-weight: 600;
  text-decoration: none;
}
.help-toc__link .icon {
  color: var(--primary-ink);
}
.help-toc__link:hover {
  background: var(--surface-2);
  border-color: var(--ink-2);
}
.help-toc__link:focus-visible {
  outline: none;
  box-shadow: var(--focus-ring);
}
@media (max-width: 559px) {
  .help-toc__list {
    flex-direction: column;
    gap: 0;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--surface);
    overflow: hidden;
  }
  .help-toc__list li + li {
    border-top: 1px solid var(--line);
  }
  .help-toc__link {
    width: 100%;
    border: 0;
    border-radius: 0;
    padding: var(--s2) var(--s4);
    background: transparent;
  }
  .help-toc__link:focus-visible {
    box-shadow: inset 0 0 0 2px var(--focus);
  }
}
@media (min-width: 1024px) {
  .help-toc {
    position: sticky;
    top: calc(var(--masthead-h) + var(--s4));
  }
  .help-toc__list {
    flex-direction: column;
    flex-wrap: nowrap;
    gap: 2px;
    border-left: 2px solid var(--line);
  }
  .help-toc__link {
    width: 100%;
    border: 0;
    border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
    background: transparent;
    padding: 0 var(--s3);
    margin-left: -2px;
    border-left: 2px solid transparent;
    color: var(--ink-2);
  }
  .help-toc__link:hover {
    background: var(--surface-2);
    color: var(--ink);
    border-left-color: var(--line-strong);
  }
}

/* ----------------------------------------------------------- Sections */
.help-sections {
  display: grid;
  gap: var(--s6);
  min-width: 0;
}
.help-sec {
  min-width: 0;
  scroll-margin-top: var(--s2);
}
@media (max-width: 719px) {
  .help-sec {
    scroll-margin-top: var(--s8);
  }
}
.help-sec__head {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: var(--s3);
  margin-bottom: var(--s3);
}
.help-sec__icon {
  width: 40px;
  height: 40px;
}
.help-sec__title {
  margin: 0;
  font-size: var(--fs-lg);
  flex: 1 1 0;
  min-width: 8rem;
}
.help-sec__tag {
  display: flex;
  flex-basis: 100%;
}
@media (min-width: 560px) {
  .help-sec__tag {
    flex-basis: auto;
    margin-left: auto;
  }
  .help-sec__title {
    flex: 0 1 auto;
  }
}
.help-sec__lede,
.help-sub__lede {
  color: var(--ink-2);
  max-width: 68ch;
}
.help-sub {
  margin: var(--s6) 0 var(--s2);
  font-size: var(--fs-md);
}
.help-gap {
  margin-bottom: var(--s4);
}
.help-gap-top {
  margin-top: var(--s4);
}
.help-actions {
  display: flex;
  flex-wrap: wrap;
  gap: var(--s2) var(--s3);
  align-items: center;
  margin-top: var(--s4);
}
/* Long labels (Spanish, 320px) wrap inside the button instead of overflowing. */
.help-actions .btn,
.help-preview .btn {
  max-width: 100%;
  white-space: normal;
  text-align: left;
  padding-block: var(--s2);
}
#help-root .notice > div,
.help-route {
  min-width: 0;
}
.help-sec__tag .tag,
.help-sec__tag .demo-badge,
.help-route__state .tag,
.help-preview .tag,
.help-enh__state .tag {
  white-space: normal;
  max-width: 100%;
}
.help-fine {
  display: flex;
  gap: var(--s2);
  align-items: flex-start;
  margin: var(--s3) 0 0;
  font-size: var(--fs-sm);
  color: var(--muted);
  max-width: 72ch;
}
.help-fine .icon {
  margin-top: 2px;
}
.help-optional {
  font-weight: 400;
  color: var(--muted);
}
.help-kv__note {
  display: block;
  color: var(--muted);
  font-size: var(--fs-xs);
}
.help-kv,
@media (min-width: 420px) {
  .help-kv,
  .help-uw__kv {
    grid-template-columns: minmax(8rem, 12rem) minmax(0, 1fr);
  }
}

/* ------------------------------------------------------------ Contact */
.help-contact {
  list-style: none;
  margin: 0;
  padding: 0;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface);
}
.help-contact__item {
  display: flex;
  align-items: center;
  gap: var(--s3);
  padding: var(--s3) var(--s4);
}
.help-contact__item + .help-contact__item {
  border-top: 1px solid var(--line);
}
.help-contact__icon {
  width: 36px;
  height: 36px;
}
.help-contact__main {
  flex: 1 1 auto;
  min-width: 0;
  display: flex;
  flex-direction: column;
}
.help-contact__label {
  font-size: var(--fs-xs);
  color: var(--muted);
  font-weight: 600;
}
.help-contact__value {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 2px var(--s2);
  font-weight: 600;
  overflow-wrap: anywhere;
}
.help-contact__copy {
  flex-shrink: 0;
}
@media (min-width: 400px) and (max-width: 479px) {
  .help-contact__item {
    padding: var(--s3);
  }
  .help-contact__copy {
    width: 44px;
    padding: 0;
    border-radius: 50%;
  }
  .help-contact__copy span {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
  }
}
/* Very narrow: the value gets the full row; Copy sits underneath. */
@media (max-width: 399px) {
  .help-contact__icon {
    display: none;
  }
  .help-contact__item {
    flex-wrap: wrap;
    gap: var(--s2);
    padding: var(--s3);
  }
  .help-contact__main {
    flex-basis: 100%;
  }
}

.help-routes {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: var(--s3);
}
@media (min-width: 880px) {
  .help-routes {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}
.help-route {
  display: flex;
  flex-direction: column;
  gap: var(--s2);
  padding: var(--s4);
  border-radius: var(--radius);
  border: 1px solid var(--line);
  background: var(--surface-2);
}
.help-route--inquiry {
  background: var(--surface);
  border-color: color-mix(in srgb, var(--primary) 35%, var(--line));
}
.help-route__title {
  margin: 0;
  font-size: var(--fs-base);
}
.help-route__body {
  margin: 0;
  font-size: var(--fs-sm);
  color: var(--ink-2);
}
.help-route__state {
  margin: auto 0 0;
}

/* ----------------------------------------------------------- Feedback */
.help-fb__legend {
  font-size: var(--fs-base);
  margin-bottom: var(--s3);
}
.help-fb__error {
  margin: 0 0 var(--s3);
}
.help-fb__choices {
  grid-template-columns: repeat(auto-fit, minmax(10.5rem, 1fr));
}
.help-fb__choice {
  align-items: center;
  font-size: var(--fs-base);
  font-weight: 600;
}
.help-fb__choice input {
  margin-top: 0;
}
.help-fb__field {
  margin-top: var(--s5);
  max-width: 640px;
}
.help-fb__done {
  font-size: var(--fs-base);
}
.help-fb__done p {
  font-size: var(--fs-sm);
}
.help-fb__done-title {
  font-weight: 700;
  font-size: var(--fs-base) !important;
}
.help-fb__summary {
  margin-top: var(--s3);
}
.help-fb__summary dd {
  white-space: pre-wrap;
}

/* ------------------------------------------------------------- Record */


/* ---------------------------------------------------------- Integrity */
.help-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 2px 10px 2px 8px;
  border-radius: 999px;
  font-size: var(--fs-xs);
  font-weight: 700;
  line-height: 1.6;
  max-width: 100%;
}
.help-badge--ok {
  color: var(--ok);
  background: var(--ok-wash);
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--ok) 40%, transparent);
}
.help-badge--fail {
  color: var(--danger);
  background: var(--danger-wash);
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--danger) 40%, transparent);
}
.help-eq {
  padding: var(--s4);
  border-radius: var(--radius);
  background: var(--surface-2);
}
.help-eq__visual {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-start;
  gap: var(--s3) var(--s2);
  margin: 0;
}
.help-eq__item {
  display: inline-flex;
  align-items: flex-start;
  gap: var(--s2);
}
.help-eq__op {
  font-size: var(--fs-lg);
  font-weight: 650;
  line-height: 1.25;
  color: var(--ink-2);
  min-width: 0.8em;
  text-align: center;
}
.help-eq__term {
  display: inline-flex;
  flex-direction: column;
}
.help-eq__val {
  font-size: var(--fs-lg);
  font-weight: 650;
  line-height: 1.25;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.help-eq__term--total .help-eq__val {
  font-weight: 750;
}
.help-eq__item--result {
  flex-basis: 100%;
  padding-top: var(--s3);
  border-top: 1px solid var(--line-strong);
}
.help-eq__item--result .help-eq__val,
.help-eq__item--result .help-eq__op {
  font-size: var(--fs-xl);
}
@media (max-width: 399px) {

/*
 * Statement arithmetic and reconciliation (PRD 5.2, 6).
 *
 * Pure functions over the canonical data object: no DOM access, so the same code
 * runs in the browser and in the build's release gate (build.mjs).
 * All totals, the balance journey, the running-balance chart and the
 * explanations derive from these functions — nothing is typed in twice.
 */
(function (root) {
  'use strict';
  var YES = (root.YES = root.YES || {});

  function d() {
    return YES.data;
  }
  function time(iso) {
    return iso ? Date.parse(iso) : NaN;
  }
  function chrono(a, b) {
    return time(a.postedAt) - time(b.postedAt) || a.seq - b.seq;
  }
  function sum(list) {
    var s = 0;
    for (var i = 0; i < list.length; i++) s += list[i].amount;
    return s;
  }
  function ids(list) {
    return list.map(function (t) {
      return t.id;
    });
  }

  var calc = (YES.calc = {});

  calc.asset = function (data) {
    data = data || d();
    return data.assets[data.statement.assetId];
  };

  /** Every transaction (posted and not posted), in canonical data order. */
  calc.all = function (data) {
    return (data || d()).transactions.slice();
  };

  /** Posted transactions in this statement, chronological (postedAt, then seq). */
  calc.posted = function (data) {
    return (data || d()).transactions
      .filter(function (t) {
        return t.status === 'posted';
      })
      .sort(chrono);
  };

  /** Transactions not included in the statement balance (pending, failed, unknown). */
  calc.notInBalance = function (data) {
    return (data || d()).transactions.filter(function (t) {
      return t.status !== 'posted';
    });
  };

  calc.tx = function (id, data) {
    var list = (data || d()).transactions;
    for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
    return null;
  };

  calc.inBalance = function (t) {
    return t.status === 'posted';
  };

  calc.categoryOf = function (t, data) {
    var cats = (data || d()).categories;
    for (var i = 0; i < cats.length; i++) if (cats[i].types.indexOf(t.type) !== -1) return cats[i].id;
    return null;
  };

  /** Balance-journey categories with totals derived from posted transactions. */
  calc.categories = function (data) {
    data = data || d();
    var posted = calc.posted(data);
    return data.categories.map(function (c) {
      var rows = posted.filter(function (t) {
        return c.types.indexOf(t.type) !== -1;
      });
      return { id: c.id, group: c.group, types: c.types.slice(), total: sum(rows), count: rows.length, txIds: ids(rows) };
    });
  };

  calc.category = function (id, data) {
    var cats = calc.categories(data);
    for (var i = 0; i < cats.length; i++) if (cats[i].id === id) return cats[i];
    return null;
  };

  /** Incoming / outgoing groups (PRD 4: opening → incoming → outgoing & fees → closing). */
  calc.groups = function (data) {
    var cats = calc.categories(data);
    function group(g) {
      var members = cats.filter(function (c) {
        return c.group === g;
      });
      var txIds = [];
      members.forEach(function (c) {
        txIds = txIds.concat(c.txIds);
      });
      return {
        id: g,
        categories: members.map(function (c) {
          return c.id;
        }),
        total: members.reduce(function (s, c) {
          return s + c.total;
        }, 0),
        count: txIds.length,
        txIds: txIds
      };
    }
    return { incoming: group('incoming'), outgoing: group('outgoing') };
  };

  /**
   * Bridge steps: opening, each category as a floating delta, closing.
   * `start`/`end` are the running levels the step moves between.
   */
  calc.journey = function (data) {
    data = data || d();
    var s = data.statement;
    var level = s.opening;
    var steps = [{ id: 'opening', kind: 'total', value: s.opening, start: 0, end: s.opening, txIds: [], count: 0 }];
    calc.categories(data).forEach(function (c) {
      steps.push({ id: c.id, kind: 'delta', group: c.group, value: c.total, start: level, end: level + c.total, txIds: c.txIds, count: c.count });
      level += c.total;
    });
    steps.push({ id: 'closing', kind: 'total', value: s.closing, start: 0, end: s.closing, txIds: [], count: 0 });
    return steps;
  };

  /** Running balance after each posted transaction, starting from the opening balance. */
  calc.running = function (data) {
    data = data || d();
    var level = data.statement.opening;
    return calc.posted(data).map(function (t) {

/* ---- js/06-userway.js ---- */
/*
 * Accessibility widget integration point (PRD 2, 5.8, 8 Phase A).
 *
 * Loads the official UserWay widget exactly once, online only, with the account
 * ID from YES.config.userway. The statement itself is the accessibility
 * implementation; the widget only augments it. If the widget cannot load
 * (offline, blocked, timed out) the status becomes 'unavailable' and nothing
 * else changes. If the hosting viewer (e.g. InfoSlips) already provides
 * UserWay, the loader detects it and does not add a second launcher.
 *
 * Status values: idle | disabled | host | loading | loaded | unavailable
 */
(function (root) {
  'use strict';
  var YES = root.YES;
  var doc = root.document;

  var uw = (YES.userway = { status: 'idle' });

  function set(status) {
    uw.status = status;
    YES.emit('userway', status);
  }

  function hostProvidesWidget() {
    var scripts = doc.querySelectorAll('script[src]');
    for (var i = 0; i < scripts.length; i++) {
      if (/userway\.org/i.test(scripts[i].getAttribute('src')) && !scripts[i].hasAttribute('data-yes-userway')) return true;
    }
    return !!(root.UserWay || root._userway_config);
  }

  uw.load = function () {
    var cfg = YES.config.userway;
    if (!cfg || !cfg.enabled || !cfg.accountId || !cfg.src) return set('disabled');
    if (doc.querySelector('script[data-yes-userway]')) return; // already requested once
    if (hostProvidesWidget()) return set('host');
    if (root.navigator && root.navigator.onLine === false) return set('unavailable');
    if (root.location && root.location.protocol !== 'https:' && root.location.protocol !== 'http:' && root.location.protocol !== 'file:') return set('unavailable');

    set('loading');
    var s = doc.createElement('script');
    s.src = cfg.src;
    s.async = true;
    s.setAttribute('data-account', cfg.accountId);
    s.setAttribute('data-yes-userway', '');
    var timer = setTimeout(function () {
      if (uw.status === 'loading') set('unavailable');
    }, cfg.timeoutMs || 8000);
    s.onload = function () {
      clearTimeout(timer);
      set('loaded');
    };
    s.onerror = function () {
      clearTimeout(timer);
      set('unavailable');
    };
    doc.body.appendChild(s);
  };

  root.addEventListener('online', function () {
    if (uw.status === 'unavailable' && !doc.querySelector('script[data-yes-userway]')) uw.load();
  });
})(window);

/*
 * Overview — the first screen (PRD 4 "First screen", 5.1, 5.2, 5.7 and layers
 * 1–2 of the progressive uncover).
 *
 *   1. Personal heading and the warm handshake paragraph.
 *   2. Balance card: closing balance in token units, "as of" time, an optional
 *      illustrative USD equivalent (only when rate, source and timestamp exist),
 *      the signed net change, the not-in-balance notice and a secondary
 *      statement-details panel with identifiers masked.
 *   3. The interactive balance journey (signature feature): opening → categories
 *      → closing, grouped as incoming / outgoing. Every step and group is a
 *      toggle button revealing exactly the transactions behind it, with a sum
 *      line proving the rows add up. A text equation and a table state the same
 *      arithmetic. If the statement does not reconcile, an exception replaces it.
 *   4. "Why it changed": a running-balance step chart (hover/focus layer,
 *      keyboard points, summary sentence, table view; a plain list when there is
 *      too little data), a fees summary and one data-supported insight.
 *   5. The personalized-video placeholder card and its storyboard dialog.
 *
 * Every figure comes from YES.calc over YES.data — nothing is typed in twice.
 */
(function (root) {

     journey step itself lives in the shared YES.state.journeyStep. */

  var pendingAnim = false;
  var chart = { pts: [], xs: [], ys: [], w: 0, lastW: 0, focusIdx: 0, hover: -1 };
  var observer = null;

  /* ------------------------------------------------------------------ */
  /* Helpers                                                             */
  /* ------------------------------------------------------------------ */
  function st() {
    return YES.data.statement;
  }
  function asset() {
    return YES.calc.asset();
  }
  function sym() {
    return asset().symbol;
  }
  function num(minor) {
    return YES.fmt.number(minor);
  }
  function plain(minor) {
    return YES.fmt.amount(minor, { unit: false });
  }
  function amt(minor, sign) {
    return YES.fmt.amount(minor, { sign: sign || 'auto' });
  }
  function periodText() {
    return YES.fmt.range(st().periodStart, st().periodEnd);
  }
  function monthText() {
    return YES.fmt.date(st().periodEnd, 'monthYear');
  }
  function stamp(iso) {
    return YES.fmt.date(iso, 'datetime') + ' ' + YES.fmt.tz(iso);
  }
  function timecode(sec) {
    var m = Math.floor(sec / 60);
    var s = sec % 60;
    return m + ':' + (s < 10 ? '0' : '') + s;
  }
  function has(obj, k) {
    return Object.prototype.hasOwnProperty.call(obj, k);
  }
  function ovState() {
    return YES.state.overview || {};
  }
  function setOv(key, value) {
    var cur = ovState();
    var next = {};
    Object.keys(cur).forEach(function (k) {
      next[k] = cur[k];
    });
    next[key] = value;
    YES.set({ overview: next });
  }
  function wideJourney() {
    return !!(root.matchMedia && root.matchMedia(WIDE_JOURNEY).matches);
  }
  function sumOf(list) {
    var s = 0;
    for (var i = 0; i < list.length; i++) s += list[i].amount;
    return s;
  }

  /** Visual number (aria-hidden) with a spoken twin that names the unit. */
  function numHtml(minor, opts) {
    opts = opts || {};
    var sign = opts.sign || 'always';
    var visible = YES.fmt.amount(minor, { sign: sign, unit: !!opts.unit });
    var spoken = YES.fmt.amountSpoken(minor, { sign: sign === 'never' ? 'auto' : sign });
    return (
      '<span class="ov-num' +
      (opts.cls ? ' ' + opts.cls : '') +
      '"><span aria-hidden="true">' +
      esc(visible) +
      '</span><span class="sr-only">' +
      esc(spoken) +
      '</span></span>'
    );
  }

  /** "—" in a table cell, with a spoken equivalent. */
  function naHtml() {
    return '<span aria-hidden="true">—</span><span class="sr-only">' + esc(t('common.none')) + '</span>';
  }

  /** Nice axis ticks (minor units) covering [lo, hi]. */
  function ticks(lo, hi, target) {
    var f = Math.pow(10, asset().precision);
    var loM = lo / f;
    var hiM = hi / f;
    if (hiM <= loM) hiM = loM + 1;
    var raw = (hiM - loM) / (target || 4);
    var mag = Math.pow(10, Math.floor(Math.log(raw) / Math.LN10));
    var n = raw / mag;
    var step = (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * mag;
    var start = Math.floor(loM / step) * step;
    var end = Math.ceil(hiM / step) * step;
    var out = [];
    for (var k = 0; start + k * step <= end + step / 1e6; k++) out.push(Math.round((start + k * step) * f));
    return out;
  }
  function tickLabel(minor) {
    var f = Math.pow(10, asset().precision);
    return minor % f === 0 ? YES.fmt.count(minor / f) : YES.fmt.number(minor);
  }

  /* ------------------------------------------------------------------ */
  /* Selection model                                                     */
  /* ------------------------------------------------------------------ */
  /** A selectable journey step (category) or group (incoming / outgoing). */
  function selectionInfo(id) {
    if (!id || typeof id !== 'string') return null;
    var cat = YES.calc.category(id);
    if (cat) return { id: id, kind: 'step', label: t('cat.' + id), value: cat.total, txIds: cat.txIds, members: [id] };
    var groups = YES.calc.groups();
    if (has(groups, id)) {
      var g = groups[id];
      return { id: id, kind: 'group', label: t('group.' + id), value: g.total, txIds: g.txIds, members: g.categories.slice() };
    }
    return null;
  }

  /** The posted transactions behind a selection, in chronological order. */
  function rowsFor(txIds) {
    var set = {};
    txIds.forEach(function (id) {
      set[id] = true;
    });
    return YES.calc.posted().filter(function (tx) {
      return set[tx.id];
    });
  }

  /* ------------------------------------------------------------------ */

  function catIcon(id) {
    var cats = YES.data.categories;
    for (var i = 0; i < cats.length; i++) if (cats[i].id === id) return ui.typeIcon(cats[i].types[0]);
    return 'balance';
  }

  /** Shown only while a step or group is pressed, so selection never relies on colour. */
  var CHECK = '<span class="jr-check" aria-hidden="true">' + ui.icon('check', { size: 14 }) + '</span>';

  function stepHtml(s, col, pct, info, hasNext) {
    var total = s.kind === 'total';
    var dir = total ? 'total' : s.value < 0 ? 'out' : 'in';
    var lo = pct(Math.min(s.start, s.end));
    var hi = pct(Math.max(s.start, s.end));
    var style = '--col:' + col + ';--lo:' + lo.toFixed(3) + '%;--hi:' + hi.toFixed(3) + '%;--end:' + pct(s.end).toFixed(3) + '%';
    var cls = 'jr-step jr-step--' + dir + (total ? ' jr-step--total' : ' jr-step--delta');
    var member = !!info && info.members.indexOf(s.id) !== -1;
    if (info) cls += member ? (info.id === s.id ? ' is-selected' : ' is-member') : ' is-dim';
    var plot = '<span class="jr-plot" aria-hidden="true"><span class="jr-bar"></span>' + (hasNext ? '<span class="jr-link"></span>' : '') + '</span>';
    var label = '<span class="jr-label">' + (total ? '' : CHECK) + '<span>' + esc(t('cat.' + s.id)) + '</span></span>';
    if (total) {
      var when = s.id === 'opening' ? st().periodStart : st().periodEnd;
      return (
        '<div class="' +
        cls +
        '" data-step="' +
        esc(s.id) +
        '" data-value="' +
        s.value +
        '" style="' +
        style +
        '">' +
        plot +
        '<span class="jr-meta">' +
        label +
        '<span class="jr-value">' +
        numHtml(s.value, { sign: 'auto' }) +
        '</span><span class="jr-sub">' +
        esc(YES.fmt.date(when, 'short')) +
        '</span></span></div>'
      );
    }
    var pressed = !!info && info.id === s.id;
    return (
      '<button type="button" class="' +
      cls +
      '" data-step="' +
      esc(s.id) +
      '" data-value="' +
      s.value +
      '" data-ov-step="' +
      esc(s.id) +
      '" aria-pressed="' +
      pressed +
      '" aria-controls="ov-panel" data-fk="ov-step-' +
      esc(s.id) +
      '" style="' +
      style +
      '">' +
      plot +
      '<span class="jr-meta">' +
      label +
      '<span class="jr-value"><span class="dir dir--' +
      dir +
      ' jr-dir">' +
      ui.icon(catIcon(s.id), { size: 14 }) +
      '</span>' +
      numHtml(s.value) +
      '</span><span class="jr-sub">' +

      esc(t('overview.journey.after', { amount: YES.fmt.amountSpoken(s.end) })) +
      '</span></span></button>'
    );
  }

  /** Steps and group buttons (plus the axis on wide screens), as items. */
  function journeyItems(info) {
    var steps = YES.calc.journey();
    var groups = YES.calc.groups();
    var lo = 0;
    var hi = 0;
    steps.forEach(function (s) {
      lo = Math.min(lo, s.start, s.end);
      hi = Math.max(hi, s.start, s.end);
    });
    var tk = ticks(lo, hi, 4);
    var dLo = tk[0];
    var dHi = tk[tk.length - 1];
    function pct(v) {
      return ((v - dLo) / (dHi - dLo)) * 100;
    }
    var items = [];
    items.push({
      id: null,
      html:
        '<div class="jr-axis" aria-hidden="true">' +
        tk
          .map(function (v) {
            return '<span class="jr-axis__tick" style="--at:' + pct(v).toFixed(3) + '%">' + esc(tickLabel(v)) + '</span>';
          })
          .join('') +
        '</div><div class="jr-grid" aria-hidden="true">' +
        tk
          .map(function (v) {
            return '<span class="jr-grid__line' + (v === 0 ? ' jr-grid__line--zero' : '') + '" style="--at:' + pct(v).toFixed(3) + '%"></span>';
          })
          .join('') +
        '</div>'
    });
    var lastGroup = null;
    steps.forEach(function (s, i) {
      var col = i + 2;
      if (s.kind === 'delta' && s.group !== lastGroup && has(groups, s.group)) {
        var span = 0;
        for (var j = i; j < steps.length && steps[j].kind === 'delta' && steps[j].group === s.group; j++) span++;
        items.push({ id: s.group, html: groupHtml(s.group, groups[s.group], col, span, info) });
        lastGroup = s.group;
      }
      items.push({ id: s.id, html: stepHtml(s, col, pct, info, i < steps.length - 1) });
    });
    return { items: items, cols: steps.length };
  }

  /** Where the transactions panel sits: below the waterfall (wide) or right after the selection (narrow). */
  function panelAnchorId(info) {
    if (!info || wideJourney()) return null;
    return info.kind === 'group' ? info.members[info.members.length - 1] : info.id;
  }

    var anchor = panelAnchorId(info);
    var inner = built.items
      .map(function (it) {
        return it.html + (anchor && it.id === anchor ? slot : '');
      })
      .join('');
    return (
      '<div class="jr' +
      (info ? ' has-selection' : '') +
      '" role="group" aria-label="' +
      esc(t('overview.journey.stepsLabel')) +
      '" style="--cols:' +
      built.cols +
      '">' +
      inner +
      '</div>' +
      (anchor ? '' : slot)
    );
  }

  /** "−120.00 − 200.00 − 60.00 = −380.00 EXUSD": the rows, added up in the open. */
  function rowsEquation(rows, sum) {
    var s = '';

      if (i === 0) s = plain(tx.amount);
      else s += (tx.amount < 0 ? ' ' + YES.fmt.MINUS + ' ' : ' + ') + num(tx.amount);
