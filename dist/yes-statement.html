padding: 10px 12px;
border: 1px solid var(--field-line);
border-radius: var(--radius-sm);
background: var(--surface);
color: var(--ink);
font-size: var(--fs-base);
}
.textarea {
min-height: 96px;
resize: vertical;
}
.select {
appearance: none;
-webkit-appearance: none;
padding-right: 36px;
background-image: linear-gradient(45deg, transparent 50%, var(--ink-2) 50%), linear-gradient(135deg, var(--ink-2) 50%, transparent 50%);
background-position: calc(100% - 18px) 55%, calc(100% - 13px) 55%;
background-size: 5px 5px;
background-repeat: no-repeat;
}
.input:focus-visible,
.select:focus-visible,
.textarea:focus-visible {
outline: 2px solid transparent;
border-color: var(--focus);
box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 35%, transparent);
}
.input[aria-invalid='true'],
.select[aria-invalid='true'],
.textarea[aria-invalid='true'] {
border-color: var(--danger);
box-shadow: 0 0 0 1px var(--danger);
}
.input-icon {
position: relative;
}
.input-icon > .icon {
position: absolute;
left: 12px;
top: 50%;
transform: translateY(-50%);
color: var(--muted);
pointer-events: none;
}
.input-icon > .input {
padding-left: 40px;
}
fieldset {
border: 0;
padding: 0;
margin: 0;
min-width: 0;
}
legend {
padding: 0;
font-size: var(--fs-sm);
font-weight: 650;
margin-bottom: 6px;
}
.choice {
display: flex;
align-items: flex-start;
gap: var(--s2);
min-height: 44px;
padding: 10px 12px;
border: 1px solid var(--line);
border-radius: var(--radius-sm);
background: var(--surface);
cursor: pointer;
font-size: var(--fs-sm);
}
.choice:hover {
border-color: var(--line-strong);
background: var(--surface-2);
}
.choice input {
margin: 3px 0 0;
width: 18px;
height: 18px;
accent-color: var(--primary);
flex-shrink: 0;
}
.choice:has(input:checked) {
border-color: var(--primary);
background: var(--primary-wash);
}
.choice:has(input:focus-visible) {
box-shadow: var(--focus-ring);
outline: 2px solid transparent;
}
.choices {
display: grid;
gap: var(--s2);
}
.chip {
display: inline-flex;
align-items: center;
gap: 6px;
min-height: 36px;
padding: 0 6px 0 12px;
border-radius: 999px;
border: 1px solid color-mix(in srgb, var(--primary) 40%, var(--line));
background: var(--primary-wash);
color: var(--ink);
font-size: var(--fs-sm);
font-weight: 600;
}
.chip button {
display: inline-flex;
align-items: center;
justify-content: center;
width: 28px;
height: 28px;
border: 0;
border-radius: 50%;
background: transparent;
color: var(--ink-2);
}
.chip button:hover {
background: color-mix(in srgb, var(--primary) 16%, transparent);
}
.pill {
display: inline-flex;
align-items: center;
gap: 6px;
min-height: 36px;
padding: 0 12px;
border-radius: 999px;
border: 1px solid var(--line-strong);
background: var(--surface);
font-size: var(--fs-sm);
font-weight: 600;
color: var(--ink);
}
.pill[aria-pressed='true'] {
background: var(--primary);
border-color: var(--primary);
color: var(--on-primary);
}
.seg {
display: inline-flex;
align-items: center;
gap: 2px;
padding: 3px;
border-radius: 999px;
background: var(--surface-2);
border: 1px solid var(--line);
}
.seg__icon {
margin: 0 4px 0 6px;
color: var(--muted);
}
.seg__btn {
min-height: 36px;
min-width: 44px;
padding: 0 12px;
border: 0;
border-radius: 999px;
background: transparent;
font-size: var(--fs-sm);
font-weight: 600;
color: var(--ink-2);
}
.seg__btn[aria-pressed='true'] {
background: var(--surface);
color: var(--ink);
box-shadow: var(--shadow-1), inset 0 0 0 1px var(--line-strong);
}
.seg__btn:focus-visible {
outline: 2px solid transparent;
box-shadow: var(--focus-ring);
}
.seg__short {
display: none;
}
.seg--compact .seg__long {
position: absolute;
width: 1px;
height: 1px;
margin: -1px;
padding: 0;
overflow: hidden;
clip: rect(0, 0, 0, 0);
clip-path: inset(50%);
white-space: nowrap;
border: 0;
}
.seg--compact .seg__short {
display: inline;
}
.seg--compact .seg__icon {
display: none;
}
.table-wrap {
border: 1px solid var(--line);
border-radius: var(--radius);
overflow-x: auto;
background: var(--surface);
}
.table {
font-size: var(--fs-sm);
}
.table caption {
text-align: left;
padding: var(--s3) var(--s4);
font-weight: 650;
color: var(--ink);
}
.table th,
.table td {
padding: 10px var(--s4);
text-align: left;
vertical-align: middle;
border-top: 1px solid var(--line);
}
.table thead th {
background: var(--surface-2);
font-size: var(--fs-xs);
font-weight: 650;
color: var(--ink-2);
letter-spacing: 0.02em;
border-top: 0;
white-space: nowrap;
}
.table .num {
text-align: right;
white-space: nowrap;
}
.table tbody tr:hover {
background: var(--surface-2);
}
.table tfoot td,
.table tfoot th {
font-weight: 700;
border-top: 2px solid var(--line-strong);
}
dialog.dlg {
padding: 0;
border: 0;
border-radius: var(--radius-lg);
background: var(--surface);
color: var(--ink);
box-shadow: var(--shadow-3);
width: min(640px, calc(100vw - 32px));
max-height: min(88vh, 900px);
overflow: hidden;
}
dialog.dlg[open] {
display: flex;
flex-direction: column;
animation: yes-fade-up var(--dur) var(--ease);
}
dialog.dlg::backdrop {
background: var(--overlay);
}
.dlg__head {
display: flex;
align-items: flex-start;
gap: var(--s3);
padding: var(--s4) var(--s4) var(--s3) var(--s5);
border-bottom: 1px solid var(--line);
}
.dlg__title {
font-size: var(--fs-lg);
margin: 6px 0 0;
flex: 1;
min-width: 0;
}
.dlg__body {
padding: var(--s5);
overflow-y: auto;
overscroll-behavior: contain;
flex: 1;
}
.dlg__foot {
display: flex;
flex-wrap: wrap;
gap: var(--s2);
justify-content: flex-end;
padding: var(--s3) var(--s5);
border-top: 1px solid var(--line);
background: var(--surface);
}
@media (max-width: 719px) {
dialog.dlg {
width: 100vw;
max-width: 100vw;
height: 100%;
max-height: 100%;
margin: 0;
border-radius: 0;
}
.dlg__head {
padding: var(--s3) var(--s3) var(--s3) var(--s4);
}
.dlg__body {
padding: var(--s4);
}
.dlg__foot {
justify-content: stretch;
padding: var(--s3) var(--s4);
}
.dlg__foot .btn {
flex: 1;
}
}
@media (max-height: 520px) {
dialog.dlg[open] {
display: block;
overflow-y: auto;
overscroll-behavior: contain;
}
dialog.dlg .dlg__body {
overflow: visible;
flex: none;
}
dialog.dlg .dlg__foot {
position: static;
}
}
.steps {
display: flex;
gap: var(--s2);
list-style: none;
margin: 0 0 var(--s5);
padding: 0;
font-size: var(--fs-xs);
color: var(--muted);
}
.steps li {
flex: 1;
display: flex;
flex-direction: column;
gap: 6px;
}
.steps li::before {
content: '';
height: 4px;
border-radius: 2px;
background: var(--line);
}
.steps li[aria-current='step'] {
color: var(--ink);
font-weight: 650;
}
.steps li[aria-current='step']::before,
.steps li.is-done::before {
background: var(--primary);
}
.empty {
text-align: center;
padding: var(--s10) var(--s4);
color: var(--ink-2);
}
.empty .icon {
color: var(--muted);
margin-bottom: var(--s2);
}
.empty h3 {
margin-bottom: var(--s2);
}
.toast {
position: fixed;
inset: auto var(--gutter) calc(var(--s6) + env(safe-area-inset-bottom, 0px));
margin: 0 auto;
border: 0;
overflow: visible;
width: fit-content;
height: auto;
max-width: min(560px, calc(100vw - 2 * var(--gutter)));
transform: translateY(16px);
background: var(--ink);
color: var(--surface);
padding: var(--s3) var(--s5);
border-radius: 999px;
font-size: var(--fs-sm);
font-weight: 600;
line-height: 1.45;
box-shadow: var(--shadow-2);
opacity: 0;
pointer-events: none;
transition: opacity var(--dur) var(--ease), transform var(--dur) var(--ease);
z-index: 2000;
text-align: center;
overflow-wrap: anywhere;
}
.toast.is-multiline {
border-radius: var(--radius);
padding-inline: var(--s4);
text-align: start;
}
.toast.is-visible {
opacity: 1;
transform: translateY(0);
}
.checks {
list-style: none;
margin: 0;
padding: 0;
display: grid;
gap: var(--s2);
}
.check {
display: flex;
gap: var(--s2);
align-items: flex-start;
font-size: var(--fs-sm);
}
.check--ok .icon {
color: var(--ok);
}
.check--fail .icon {
color: var(--danger);
}
.check__state {
margin-left: auto;
font-weight: 650;
font-size: var(--fs-xs);
color: var(--ink-2);
white-space: nowrap;
}
mark,
.hl {
background: color-mix(in srgb, var(--accent) 38%, transparent);
color: inherit;
border-radius: 2px;
padding: 0 1px;
}
.is-flash {
animation: yes-highlight 1.6s var(--ease);
}
@media (forced-colors: active) {
.btn,
.chip,
.pill,
.status,
.tag,
.demo-badge,
.card,
.notice {
border: 1px solid CanvasText;
}
.pill[aria-pressed='true'],
.seg__btn[aria-pressed='true'] {
border: 3px solid CanvasText;
}
.input,
.select,
.textarea {
border-color: CanvasText;
}
.toast {
border: 1px solid CanvasText;
}
}
@media (min-width: 1100px) {
html.assistant-docked .toast {
right: calc(var(--drawer-w) + var(--gutter));
max-width: min(560px, calc(100vw - var(--drawer-w) - 2 * var(--gutter)));
}
}
/* ---- css/03-shell.css ---- */
.masthead {
position: sticky;
top: 0;
z-index: 100;
container: mast / inline-size;
background: color-mix(in srgb, var(--surface) 94%, transparent);
backdrop-filter: saturate(1.4) blur(8px);
-webkit-backdrop-filter: saturate(1.4) blur(8px);
border-bottom: 1px solid var(--line);
}
.masthead.is-unpinned {
position: relative;
top: auto;
}
@media (max-height: 500px) {
.masthead {
position: relative;
top: auto;
}
}
.masthead__bar {
container: mastrow / inline-size;
display: flex;
align-items: center;
gap: var(--s2) var(--s3);
min-height: 60px;
flex-wrap: wrap;
padding-block: var(--s2);
}
.brand {
display: inline-flex;
align-items: center;
gap: var(--s3);
color: var(--ink);
text-decoration: none;
border-radius: var(--radius-sm);
min-height: 44px;
min-width: 0;
}
.brand__logo {
--logo-h: 36px;
}
.brand__text {
display: flex;
flex-direction: column;
line-height: 1.2;
min-width: 0;
}
.brand__title {
font-weight: 700;
font-size: var(--fs-sm);
}
.brand__period,
.brand__period-short {
font-size: var(--fs-xs);
color: var(--muted);
white-space: nowrap;
}
.brand__period-short {
display: none;
}
.masthead__actions,
.mast-wide {
display: flex;
justify-content: flex-end;
align-items: center;
gap: var(--s2);
min-width: 0;
}
.masthead__actions {
flex-wrap: wrap;
margin-left: auto;
}
.btn--ask,
.btn--record {
min-height: 44px;
}
.btn--ask .btn__label--short,
.btn--record .btn__label--short {
display: none;
}
.theme-toggle.btn--icon {
flex: none;
}
.theme-toggle .icon {
color: var(--ink-2);
}
.theme-toggle[aria-pressed='true'] .icon {
color: var(--ink);
fill: currentColor;
}
.theme-toggle.btn--icon[aria-pressed='true'] {
background: var(--surface-3);
border-color: var(--ink-2);
box-shadow: inset 0 0 0 1px var(--ink-2);
}
.theme-toggle.btn--icon[aria-pressed='true']:focus-visible {
box-shadow: inset 0 0 0 1px var(--ink-2), var(--focus-ring);
}
.nav {
position: relative;
border-top: 1px solid var(--line);
}
.nav__list {
display: flex;
gap: var(--s1);
list-style: none;
margin-block: 0;
overflow-x: auto;
scrollbar-width: none;
}
.nav__list::-webkit-scrollbar {
display: none;
}
.nav__list > li {
display: flex;
}
.nav__link {
display: inline-flex;
align-items: center;
min-height: 46px;
padding: 0 var(--s3);
color: var(--ink-2);
font-weight: 600;
font-size: var(--fs-sm);
text-decoration: none;
border-bottom: 3px solid transparent;
white-space: nowrap;
border-radius: 0;
}
.nav__link:hover {
color: var(--ink);
border-bottom-color: var(--line-strong);
}
.nav__link[aria-current='page'] {
color: var(--ink);
border-bottom-color: var(--primary);
}
.nav__link:focus-visible {
outline-offset: -4px;
}
.mast-menu-btn,
.mast-menu {
display: none;
}
@container mastrow (width < 59em) {
.mast-wide .seg--lang .seg__long {
position: absolute;
width: 1px;
height: 1px;
margin: -1px;
padding: 0;
overflow: hidden;
clip: rect(0, 0, 0, 0);
clip-path: inset(50%);
white-space: nowrap;
border: 0;
}
.mast-wide .seg--lang .seg__short {
display: inline;
}
.mast-wide .seg--lang .seg__icon {
display: none;
}
}
@container mastrow (width < 52em) {
.btn--record .btn__label {
display: none;
}
.btn--record .btn__label--short {
display: inline;
}
}
@container mastrow (width < 49em) {
.btn--ask {
gap: 4px;
padding: 0 12px 0 10px;
}
.btn--ask .btn__label {
display: none;
}
.btn--ask .btn__label--short {
display: inline;
}
}
@container mast (width < 45em) {
.masthead__bar {
min-height: 0;
gap: var(--s2);
padding-block: 6px;
}
.brand {
gap: var(--s2);
}
.brand__logo {
--logo-h: 34px;
}
.brand__logo--placeholder {
min-width: 44px;
padding: 0 6px;
}
.brand__title,
.brand__period {
position: absolute;
width: 1px;
height: 1px;
margin: -1px;
padding: 0;
overflow: hidden;
clip: rect(0, 0, 0, 0);
clip-path: inset(50%);
white-space: nowrap;
border: 0;
}
.brand__period-short {
display: inline;
font-weight: 650;
color: var(--ink-2);
}
.mast-wide,
.nav {
display: none;
}
.mast-menu-btn {
display: inline-flex;
gap: 4px;
padding: 0 12px 0 10px;
}
.mast-menu-btn[aria-expanded='true'] {
background: var(--surface-2);
border-color: var(--ink-2);
}
.mast-menu:not([hidden]) {
display: block;
position: absolute;
top: 100%;
left: 0;
right: 0;
max-height: var(--menu-max, 70vh);
overflow-y: auto;
overscroll-behavior: contain;
padding: var(--s2) var(--gutter) var(--s4);
background: var(--surface);
border-bottom: 1px solid var(--line-strong);
box-shadow: var(--shadow-2);
animation: yes-fade-up var(--dur) var(--ease);
}
}
@container mast (width < 22.5em) {
.btn--ask,
.mast-menu-btn {
padding: 0 8px 0 6px;
}
}
.masthead__bar.is-tight .brand__period-short {
display: none;
}
.mast-menu__list {
display: grid;
gap: 2px;
list-style: none;
margin: 0;
padding: 0;
}
.mast-menu__link {
display: flex;
align-items: center;
justify-content: space-between;
gap: var(--s3);
min-height: 48px;
padding: 0 var(--s3);
border-radius: var(--radius-sm);
color: var(--ink);
font-weight: 600;
text-decoration: none;
}
.mast-menu__link:hover {
background: var(--surface-2);
}
.mast-menu__link[aria-current='page'] {
background: var(--primary-wash);
box-shadow: inset 3px 0 0 var(--primary);
font-weight: 700;
}
.mast-menu__current {
visibility: hidden;
color: var(--primary-ink);
}
.mast-menu__link[aria-current='page'] .mast-menu__current {
visibility: visible;
}
.mast-menu__link:focus-visible,
.mast-menu__theme:focus-visible {
outline: 2px solid var(--focus);
outline-offset: -2px;
}
.mast-menu__group {
margin-top: var(--s2);
padding-top: var(--s2);
border-top: 1px solid var(--line);
}
.mast-menu__record {
width: 100%;
justify-content: flex-start;
border-radius: var(--radius-sm);
padding-inline: var(--s3);
text-align: start;
}
.mast-menu__record .btn__label--short {
display: none;
}
.mast-menu__pref {
display: flex;
flex-wrap: wrap;
align-items: center;
justify-content: space-between;
gap: var(--s2) var(--s3);
min-height: 48px;
padding: 0 0 0 var(--s3);
}
.mast-menu__pref-label {
font-weight: 600;
}
.mast-menu__theme {
display: flex;
align-items: center;
gap: var(--s3);
width: 100%;
min-height: 48px;
margin-top: 2px;
padding: 0 var(--s3);
border: 0;
border-radius: var(--radius-sm);
background: transparent;
color: var(--ink);
font-weight: 600;
text-align: start;
}
.mast-menu__theme:hover {
background: var(--surface-2);
}
.mast-menu__theme-label {
flex: 1;
min-width: 0;
}
.switch {
display: inline-flex;
align-items: center;
gap: var(--s2);
flex: none;
}
.switch__text {
font-size: var(--fs-sm);
font-weight: 600;
color: var(--ink-2);
}
.switch__track {
position: relative;
width: 42px;
height: 24px;
border-radius: 999px;
border: 1px solid var(--field-line);
background: var(--surface-2);
transition: background-color var(--dur) var(--ease), border-color var(--dur) var(--ease);
}
.switch__thumb {
position: absolute;
top: 2px;
left: 2px;
width: 18px;
height: 18px;
border-radius: 50%;
background: var(--ink-2);
transition: transform var(--dur) var(--ease), background-color var(--dur) var(--ease);
}
[aria-pressed='true'] > .switch .switch__track {
background: var(--primary);
border-color: var(--primary);
}
[aria-pressed='true'] > .switch .switch__thumb {
transform: translateX(18px);
background: var(--on-primary);
}
@media (forced-colors: active) {
.switch__track {
border-color: CanvasText;
}
.switch__thumb {
background: CanvasText;
}
[aria-pressed='true'] > .switch .switch__track {
background: Highlight;
}
.mast-menu:not([hidden]),
.mast-menu__link[aria-current='page'] {
border: 1px solid CanvasText;
}
}
main {
display: block;
padding-bottom: var(--s16);
min-height: 60vh;
}
main:focus {
outline: none;
}
.view {
animation: yes-fade-up var(--dur) var(--ease);
}
@media (min-width: 1100px) {
html.assistant-docked #app {
padding-right: var(--drawer-w);
}
}
#integrity-root:empty {
display: none;
}
html.is-withheld main,
html.is-withheld .masthead .nav,
html.is-withheld .btn--ask,
html.is-withheld [data-mast-record],
html.is-withheld .mast-menu__nav {
display: none;
}
html.is-withheld .mast-menu__group {
margin-top: 0;
padding-top: 0;
border-top: 0;
}
.withheld {
padding-block: var(--s8);
max-width: 760px;
}
.withheld__title {
font-size: var(--fs-lg);
}
.withheld__checks-title {
margin-top: var(--s6);
}
.withheld__checks .check {
align-items: center;
padding: 6px var(--s3);
border-radius: var(--radius-sm);
}
.withheld__checks .check--fail {
background: var(--danger-wash);
box-shadow: inset 3px 0 0 var(--danger);
font-weight: 650;
}
.withheld__checks .check--fail .check__state {
color: var(--danger);
font-size: var(--fs-sm);
font-weight: 750;
}
.withheld__return {
margin-top: var(--s6);
}
.site-footer {
border-top: 1px solid var(--line);
background: var(--surface);
color: var(--ink-2);
font-size: var(--fs-xs);
padding-block: var(--s6) var(--s8);
}
.footer__inner p {
max-width: 90ch;
}
.footer__demo {
display: flex;
gap: var(--s2);
align-items: flex-start;
}
.footer__powered {
color: var(--muted);
}
.noscript-summary {
max-width: 760px;
margin: var(--s8) auto;
padding: 0 var(--gutter);
}
/* ---- css/10-overview.css ---- */
#overview-root {
overflow-wrap: break-word;
}
#overview-root .vp-stage {
overflow-wrap: normal;
}
.ov-head {
margin-bottom: var(--s5);
}
.ov-head .view-title {
margin-bottom: var(--s3);
}
.ov-handshake {
max-width: 68ch;
margin: 0;
color: var(--ink-2);
font-size: var(--fs-md);

padding: var(--s5) var(--s6);
}
}
@container ov-journey (min-width: 55rem) {
.ov-journey__body > .ov-panel-slot .ov-panel {
margin-top: var(--s4);
}
}
@keyframes ov-reveal {
from {
opacity: 0;
transform: translateY(-10px);
}
to {
opacity: 1;
transform: none;
}
}
.ov-panel.is-anim {
animation: ov-reveal 360ms var(--ease) both;
animation-delay: 80ms;
}
.ov-panel__head {
margin-bottom: var(--s3);
}
.ov-panel__title {
font-size: var(--fs-lg);
margin: 0 0 var(--s1);
}
.ov-seps {
--sep-w: 1.25em;
display: block;
overflow: hidden;
}
.ov-seps__in {
display: flex;
flex-wrap: wrap;
align-items: baseline;
row-gap: 2px;
margin: 0 0 0 calc(-1 * var(--sep-w));
}
.ov-seps__in > :not(.sr-only) {
position: relative;
padding-left: var(--sep-w);
}
.ov-seps__in > :not(.sr-only)::before {
content: '·' / '';
position: absolute;
left: 0;
width: var(--sep-w);
text-align: center;
color: var(--muted);
}
.ov-panel__meta {
color: var(--ink-2);
font-size: var(--fs-sm);
}
.ov-panel__meta .ov-num {
font-weight: 650;
color: var(--ink);
font-variant-numeric: tabular-nums;
}
.ov-panel__empty {
margin: var(--s3) 0;
color: var(--ink-2);
}
.ov-txhead {
display: none;
}
.ov-txlist {
list-style: none;
margin: 0;
padding: 0;
display: grid;
gap: 6px;
}
.ov-tx {
display: grid;
grid-template-columns: 32px minmax(0, 1fr) auto;
grid-template-areas:
'icon cp cp'
'icon when amt';
align-items: center;
gap: 2px var(--s3);
width: 100%;
min-height: 56px;
padding: 10px 12px;
border: 1px solid var(--line);
border-radius: var(--radius);
background: var(--surface);
color: var(--ink);
font: inherit;
text-align: left;
cursor: pointer;
transition: border-color var(--dur) var(--ease), background-color var(--dur) var(--ease);
}
.ov-tx:hover {
border-color: var(--line-strong);
background: color-mix(in srgb, var(--surface-2) 40%, var(--surface));
}
.ov-tx:focus-visible {
outline: 2px solid transparent;
box-shadow: var(--focus-ring);
}
.ov-tx__icon {
grid-area: icon;
}
.ov-tx__cp {
grid-area: cp;
font-weight: 600;
min-width: 0;
overflow-wrap: break-word;
}
.ov-tx__amt {
grid-area: amt;
text-align: right;
}
.ov-tx__when {
grid-area: when;
min-width: 0;
font-size: var(--fs-xs);
color: var(--muted);
--sep-w: 1em;
}
.ov-tx__type {
color: var(--ink-2);
}
.ov-tx__go {
display: none;
}
@container ov-panel (max-width: 24rem) {
.ov-unit {
display: none;
}
}
@container ov-panel (max-width: 17.5rem) {
.ov-tx {
grid-template-columns: minmax(0, 1fr) auto;
grid-template-areas:
'cp cp'
'when amt';
}
.ov-tx__icon {
display: none;
}
}
@container ov-panel (max-width: 12rem) {
.ov-tx {
grid-template-columns: minmax(0, 1fr);
grid-template-areas:
'cp'
'when'
'amt';
}
.ov-tx__amt {
text-align: left;
}
}
@container ov-panel (min-width: 36rem) {
.ov-txhead,
.ov-tx {
grid-template-columns: 32px 8.5rem 6.5rem minmax(0, 1fr) auto 16px;
grid-template-areas: 'icon date type cp amt go';
column-gap: var(--s4);
}
.ov-txhead {
display: grid;
padding: 0 13px 6px;
font-size: var(--fs-xs);
font-weight: 650;
color: var(--muted);
}
.ov-txhead__amt {
text-align: right;
}
.ov-tx {
min-height: 52px;
}
.ov-tx__when,
.ov-tx__when .ov-seps__in {
display: contents;
}
.ov-tx__when .ov-seps__in > * {
padding-left: 0;
}
.ov-tx__when .ov-seps__in > *::before {
content: none;
}
.ov-tx__date,
.ov-tx__type {
font-size: var(--fs-sm);
color: var(--ink-2);
}
.ov-tx__date {
grid-area: date;
}
.ov-tx__type {
grid-area: type;
}
.ov-tx__go {
display: inline-flex;
grid-area: go;
color: var(--muted);
}
}
.ov-sum {
display: flex;
flex-wrap: wrap;
align-items: baseline;
justify-content: space-between;
gap: var(--s1) var(--s4);
margin-top: var(--s3);
padding: var(--s3) 12px 0;
border-top: 2px solid var(--line-strong);
}
.ov-sum__label {
font-weight: 700;
}
.ov-sum__value {
margin-left: auto;
text-align: right;
font-size: var(--fs-md);
}
.ov-sum__check {
flex: 1 1 100%;
display: inline-flex;
align-items: center;
gap: 6px;
font-size: var(--fs-sm);
color: var(--ink-2);
}
.ov-sum--ok .ov-sum__check .icon {
color: var(--ok);
}
.ov-sum--bad .ov-sum__check .icon {
color: var(--danger);
}
.ov-sum__math {
flex: 1 1 100%;
font-size: var(--fs-xs);
color: var(--muted);
font-variant-numeric: tabular-nums;
overflow-wrap: anywhere;
}
@container ov-panel (min-width: 36rem) {
.ov-sum {
display: grid;
grid-template-columns: minmax(0, 1fr) auto;
padding-right: calc(12px + 16px + var(--s4));
}
.ov-sum__check {
grid-column: 1;
}
.ov-sum__math {
grid-row: 2;
grid-column: 2;
text-align: right;
max-width: 32rem;
}
}
.ov-panel__actions {
display: flex;
flex-wrap: wrap;
gap: var(--s2);
margin-top: var(--s4);
}
@container ov-panel (max-width: 24rem) {
.ov-panel__actions .btn {
flex: 1 1 100%;
}
}
.jr-eq {
margin-top: var(--s5);
padding-top: var(--s4);
border-top: 1px solid var(--line);
}
.jr-eq__title {
margin: 0 0 var(--s2);
font-size: var(--fs-xs);
font-weight: 650;
letter-spacing: 0.06em;
text-transform: uppercase;
color: var(--muted);
}
.jr-eq__line {
display: flex;
flex-wrap: wrap;
align-items: flex-start;
gap: var(--s2) var(--s5);

}
.jr-eq__term {
display: inline-flex;
flex-direction: column;

max-width: 100%;
}
.jr-eq__num {
font-weight: 650;
font-variant-numeric: tabular-nums;
white-space: nowrap;
}
.jr-eq__num.ov-amt {
white-space: normal;
}
.jr-eq__lbl {
font-size: var(--fs-xs);
color: var(--muted);
overflow-wrap: break-word;
}
.jr-eq__op {
font-weight: 650;
color: var(--ink-2);
margin-right: 0.35em;
}
.jr-eq__term--total .jr-eq__num {
font-weight: 800;
}
.ov-tablebox {
margin-top: var(--s4);
}
.ov-tablenote {
display: flex;
gap: var(--s2);
align-items: flex-start;
max-width: 72ch;
margin: var(--s1) 0 var(--s3);
color: var(--ink-2);
font-size: var(--fs-sm);
}
.ov-tablenote .icon {
flex: none;
margin-top: 2px;
color: var(--muted);
}
.ov-tablebox > summary .icon,
.ov-learn .icon {
color: var(--muted);
}
.ov-table th[scope='row'] {
font-weight: 600;
}
.ov-table .amount {
font-weight: 600;
}
.ov-table__date {
display: block;
font-size: var(--fs-xs);
font-weight: 400;
color: var(--muted);
}
.ov-table__label {
display: block;
}
.ov-table__sub {
display: none;
font-size: var(--fs-xs);
font-weight: 400;
color: var(--muted);
}
.ov-table__tx {
display: inline-block;
min-height: 24px;
padding: 2px 0;
text-align: left;
white-space: normal;
font-size: var(--fs-sm);
}
@media (max-width: 479px) {
.ov-tablebox .disclosure__body {
padding: 0 var(--s2) var(--s2);
}
.ov-table th,
.ov-table td {
padding: 8px;
}
.ov-table thead th,
.ov-table thead th.num {
white-space: normal;
}
.ov-table caption {
padding: var(--s3) var(--s2);
}
.ov-table .ov-col-count {
display: none;
}
.ov-table__sub {
display: block;
}
}
@media (max-width: 399px) {
.ov-tablebox {
margin-inline: calc(-1 * var(--s5));
border-radius: 0;
border-inline-width: 0;
}
.ov-tablebox > summary {
padding-inline: var(--s5);
border-radius: 0;
}
.ov-tablebox .disclosure__body {
padding: 0 0 var(--s2);
}
.ov-tablebox .ov-tablenote,
.ov-tablebox .ov-table caption {
padding-inline: var(--s5);
}
.ov-tablebox .table-wrap {
border-width: 1px 0 0;
border-radius: 0;
}
.ov-table th:first-child {
padding-left: var(--s4);
}
.ov-table th:last-child,
.ov-table td:last-child {
padding-right: var(--s4);
}
.ov-table {
font-size: var(--fs-xs);
}
.ov-table th,
.ov-table td {
padding: 8px 6px;
}
.ov-table th[scope='row'] {
overflow-wrap: break-word;
hyphens: auto;
}
}
.ov-exception {
margin-top: var(--s2);
}
.ov-why__grid {
display: grid;
grid-template-columns: minmax(0, 1fr);
gap: var(--s5);
}
.ov-chartcard {
min-width: 0;
}
.ov-why__aside {
display: grid;
grid-template-columns: minmax(0, 1fr);
gap: var(--s5);
align-items: start;
}
@media (min-width: 720px) {
.ov-why__aside {
grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr);
}
}
.ov-cardhead {
display: flex;
flex-wrap: wrap;
align-items: center;
justify-content: space-between;
gap: var(--s2) var(--s4);
margin-bottom: var(--s1);
}
.ov-cardhead h3 {
margin: 0;
}
.ov-cardlede {
margin: 0;
color: var(--ink-2);
font-size: var(--fs-sm);
}
.ov-cardtitle {
display: flex;
align-items: center;
gap: var(--s2);
margin-bottom: var(--s3);
}
.ov-cardactions {
display: flex;
flex-wrap: wrap;
gap: var(--s2);
margin-top: var(--s4);
}
.ov-chart {
margin: var(--s4) 0 0;
}
.ov-chart .ov-legend {
margin-bottom: var(--s2);
}
.ov-lkey {
display: block;
}
.ov-lkey__line {
stroke: var(--total);
stroke-width: 2;
stroke-linecap: round;
}
.ov-chart__plot {
position: relative;
width: 100%;
cursor: crosshair;
touch-action: pan-y;
}
.ov-chart__svg {
display: block;
max-width: none;
overflow: visible;
}
.ov-chart__svg .c-grid {
stroke: var(--grid);
stroke-width: 1;
}
.ov-chart__svg .c-zero,
.ov-chart__svg .c-xtick {
stroke: var(--axis);
stroke-width: 1;
}
.ov-chart__svg text {
fill: var(--muted);
font-family: var(--yes-font);
font-size: 12px;
font-variant-numeric: tabular-nums;
}
.ov-chart__svg .c-end {
fill: var(--ink-2);
font-weight: 650;
}
.ov-chart__svg .c-area {
fill: var(--total);
opacity: 0.1;
}
.ov-chart__svg .c-line {
fill: none;
stroke: var(--total);
stroke-width: 2;
stroke-linejoin: round;
stroke-linecap: round;
}
.ov-mk {
stroke: var(--surface);
stroke-width: 2;
stroke-linejoin: round;
paint-order: stroke;
transform-box: fill-box;
transform-origin: center;
transition: transform 120ms var(--ease);
}
.ov-mk--in {
fill: var(--in);
}
.ov-mk--out {
fill: var(--out);
}
.ov-mk.is-active {
transform: scale(1.45);
}
.ov-cross {
position: absolute;
width: 1px;
margin-left: -0.5px;
background: var(--line-strong);
pointer-events: none;
}
.ov-pts {
position: absolute;
inset: 0;
pointer-events: none;
}
.ov-pt {
position: absolute;
width: 28px;
height: 28px;
margin: -14px 0 0 -14px;
padding: 0;
border: 0;
border-radius: 50%;
background: transparent;
pointer-events: auto;
cursor: pointer;
z-index: 2;
}
.ov-pt--minor {
z-index: 1;
}
.ov-pt:focus-visible {
outline: 2px solid var(--focus);
outline-offset: 0;
border-radius: 50%;
}
.ov-tip {
position: absolute;
z-index: 3;
min-width: 11rem;
max-width: 16rem;
padding: var(--s2) var(--s3);
border: 1px solid var(--line);
border-radius: var(--radius-sm);
background: var(--surface);
box-shadow: var(--shadow-2);
color: var(--ink-2);
font-size: var(--fs-xs);
line-height: 1.45;
pointer-events: none;
}
.ov-tip p {
margin: 0;
}
.ov-tip__value {
font-size: var(--fs-base);
font-weight: 700;
color: var(--ink);
font-variant-numeric: tabular-nums;
}
.ov-tip__label {
color: var(--muted);
margin-bottom: 4px !important;
}
.ov-tip__row {
display: flex;
align-items: center;
gap: 6px;

}
.ov-tip__row strong {
font-variant-numeric: tabular-nums;
}
.ov-tip__key {
flex: none;
}
.ov-tip__hint {
margin-top: 4px !important;

border-top: 1px solid var(--line);
color: var(--muted);
}
.ov-chart__summary {
margin-top: var(--s3);
color: var(--ink-2);
font-size: var(--fs-sm);
}
.ov-lowdata {
margin-top: var(--s4);
}
@media (max-width: 479px) {
.ov-mini .ov-unit {

}
}
.ov-minilist {

margin: 0;
padding: 0;

gap: 6px;
}
.ov-lowlist {
margin-top: var(--s3);
}
.ov-mini {

grid-template-columns: minmax(0, 1fr) auto;
grid-template-areas:
'main amt'
'date date';

width: 100%;
min-height: 48px;
padding: 8px 12px;
border: 1px solid var(--line);
border-radius: var(--radius-sm);

.ov-insight__body {

.ov-learn {

border-radius: 1cqw;
color: var(--muted);
font-size: 1.85cqw;
text-align: center;
}
.vs-trows {
list-style: none;
margin: 0;
padding: 0;
display: grid;
grid-template-columns: minmax(0, 1fr);
gap: 0.7cqw;
}
.vs-trow {
display: grid;
grid-template-columns: auto minmax(0, 1fr) auto;
align-items: center;
gap: 1.2cqw;
padding: 0.85cqw 1.1cqw;
border-radius: 0.9cqw;
border: 0.15cqw solid color-mix(in srgb, var(--primary) calc(var(--hl, 0) * 100%), var(--line));
background: color-mix(in srgb, var(--primary-wash) calc(var(--hl, 0) * 100%), var(--vs-card));
font-size: 1.7cqw;
}
.vs-trow__date {
color: var(--muted);
white-space: nowrap;
}
.vs-trow__desc {
overflow: hidden;
text-overflow: ellipsis;
white-space: nowrap;
}
.vs-trow__amt {
font-weight: 700;
font-variant-numeric: tabular-nums;
white-space: nowrap;
}
.vs-sum {
display: flex;
align-items: center;
gap: 1cqw;
margin: 1.2cqw 0 0;
padding: 1cqw 1.1cqw;
border-radius: 0.9cqw;
font-size: 1.75cqw;
background: color-mix(in srgb, var(--ok-wash) calc(var(--hl, 0) * 100%), transparent);
}
.vs-sum .icon {
width: 2.2cqw;
height: 2.2cqw;
color: var(--ok);
}
.vs-sum span {
flex: 1;
color: var(--ink-2);
}
.vs-sum strong {
font-variant-numeric: tabular-nums;
}
.vs-sheet {
position: absolute;
top: 0;
right: 0;
bottom: 0;
width: 55%;
padding: 2.2cqw 2.4cqw;
background: var(--vs-card);
border-left: 0.15cqw solid var(--line);
box-shadow: -1cqw 0 2.4cqw color-mix(in srgb, var(--vs-deep) 22%, transparent);
}
.vs-sheet__title {
margin: 0;
font-size: 2cqw;
font-weight: 700;
}
.vs-sheet__amt {
display: flex;
align-items: center;
gap: 1.4cqw;
margin: 0.5cqw 0 1cqw;
font-size: 3cqw;
font-weight: 750;
font-variant-numeric: tabular-nums;
}
.vs-status {
display: inline-flex;
align-items: center;
gap: 0.5cqw;
padding: 0.25cqw 0.9cqw;
border-radius: 99cqw;
background: var(--ok-wash);
color: var(--ink);
font-size: 1.5cqw;
font-weight: 650;
}
.vs-status .icon {
width: 1.7cqw;
height: 1.7cqw;
color: var(--ok);
}
.vs-kv--grid {
grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
gap: 0.5cqw 1.6cqw;
font-size: 1.6cqw;
}
.vs-kv--grid .vs-kv__row {
grid-template-columns: minmax(0, 1fr);
gap: 0.15cqw;
padding: 0.5cqw 1cqw;
}
.vs-kv--grid .vs-kv__row > :first-child {
font-size: 1.4cqw;
}
.vs-actions {
display: flex;
flex-wrap: wrap;
gap: 1cqw;
margin-top: 1.4cqw;
}
.vs-btn {
display: inline-flex;
align-items: center;
gap: 0.7cqw;
padding: 0.75cqw 1.4cqw;
border-radius: 99cqw;
border: 0.15cqw solid var(--line-strong);
background: var(--vs-card);
color: var(--ink);
font-size: 1.55cqw;
font-weight: 650;
white-space: nowrap;
box-shadow: 0 0 0 calc(var(--hl, 0) * 0.45cqw) color-mix(in srgb, var(--focus) 60%, transparent);
}
.vs-btn .icon {
width: 1.8cqw;
height: 1.8cqw;
}
.vs-btn--ai {
border-color: color-mix(in srgb, var(--ai) 45%, var(--line));
background: var(--ai-wash);
}
.vs-btn--ai .icon {
color: var(--ai);
}
.vs-pointer {
position: absolute;
left: 72%;
top: 82%;
z-index: 3;
width: 3.2cqw;
height: 3.2cqw;
margin: -1.6cqw 0 0 -1.6cqw;
border-radius: 50%;
background: color-mix(in srgb, var(--vs-deep) 42%, transparent);
border: 0.32cqw solid var(--vs-ink);
box-shadow: 0 0.3cqw 1.2cqw color-mix(in srgb, var(--vs-deep) 45%, transparent);
pointer-events: none;
}
.vs-pointer::after {
content: '';
position: absolute;
inset: -0.4cqw;
border-radius: 50%;
border: 0.3cqw solid var(--vs-ink);
opacity: var(--press, 0);
transform: scale(calc(1 + var(--press, 0) * 0.8));
}
.vs-help__cards {
position: absolute;
inset: 0;
}
.vs-help__ask,
.vs-help__help {
top: 8.4cqw;
width: 43cqw;
height: 30cqw;
box-shadow:
0 0.6cqw 2.6cqw color-mix(in srgb, var(--vs-deep) 50%, transparent),
0 0 0 calc(var(--hl, 0) * 0.5cqw) var(--vs-ink);
}
.vs-help__ask {
left: 5cqw;
}
.vs-help__help {
left: 52cqw;
}
.vs-help__t {
margin: 1.4cqw 0 0.6cqw;
font-size: 2.8cqw;
font-weight: 750;
}
.vs-help__p {
margin: 0 0 1.6cqw;
font-size: 1.9cqw;
color: var(--ink-2);
line-height: 1.35;
}
.vs-chip {
display: inline-flex;
align-items: center;
gap: 0.8cqw;
padding: 0.8cqw 1.4cqw;
border-radius: 99cqw;
background: var(--ai-wash);
border: 0.15cqw solid color-mix(in srgb, var(--ai) 40%, var(--line));
font-size: 1.75cqw;
font-weight: 600;
}
.vs-chip .icon {
width: 1.9cqw;
height: 1.9cqw;
color: var(--ai);
}
.vs-contact {
list-style: none;
margin: 0;
padding: 0;
display: grid;
gap: 1cqw;
font-size: 1.85cqw;
}
.vs-contact li {
display: flex;
align-items: center;
gap: 1cqw;
}
.vs-contact .icon {
width: 2.1cqw;
height: 2.1cqw;
color: var(--muted);
}
.vs-end {
position: absolute;
left: 8cqw;
right: 8cqw;
top: 7.5cqw;
display: grid;
justify-items: center;
gap: 1.6cqw;
text-align: center;
}
.vs-end .vs-logo {
--logo-h: 6cqw;
}
.vs-end__bye {
margin: 0.6cqw 0 0;
font-size: 5.6cqw;
font-weight: 750;
line-height: 1.1;
letter-spacing: -0.01em;
}
.vs-end__sig {
margin: 0;
font-size: 2.3cqw;
color: color-mix(in srgb, var(--vs-ink) 90%, transparent);
}
.vs-end__demo {
margin: 0.4cqw 0 0;
padding: 0.4cqw 1.3cqw;
border-radius: 99cqw;
border: 0.15cqw solid color-mix(in srgb, var(--vs-ink) 50%, transparent);
font-size: 1.55cqw;
font-weight: 650;
}
@media (prefers-reduced-motion: reduce) {
.jr-step.is-anim .jr-bar,
.ov-panel.is-anim {
animation: none;
}
.ov-mk,
.jr-bar,
.vp-big,
.vp-bar {
transition: none;
}
.vp-big:hover {
transform: none;
}
.vs-pointer::after {
transform: none;
}
}
@media (forced-colors: active) {
.jr-bar,
.ov-key,
.jr-group::before {
forced-color-adjust: none;
background: CanvasText;
}
.jr-step--in .jr-bar,
.ov-key--in,
.jr-group--in::before {
background: Highlight;
}
.jr-step--out .jr-bar,
.ov-key--out,
.jr-group--out::before {
background: repeating-linear-gradient(135deg, CanvasText 0 2px, Canvas 2px 4.5px);
box-shadow: inset 0 0 0 1px CanvasText;
}
.ov-key {
width: 12px;
height: 12px;
}
.jr .is-dim .jr-bar {
opacity: 1;
background: Canvas;
box-shadow: inset 0 0 0 1px GrayText;
}
.jr-group.is-dim::before,
.jr-group.is-dim .jr-group__bracket {
opacity: 1;
}
.jr-group__bracket {
border-color: CanvasText;
}
.jr-step[aria-pressed='true'],
.jr-group[aria-pressed='true'] {
outline: 3px solid Highlight;
}
.jr-check {
forced-color-adjust: none;
background: Highlight;
color: HighlightText;
}
.ov-mk,
.ov-chart__svg .c-line {
forced-color-adjust: none;
}
.vp-stage {
forced-color-adjust: none;
}
.vp {
border: 1px solid CanvasText;
}
.vp-track {
background: GrayText;
}
.vp-fill,
.vp-btn--cc[aria-pressed='true']::after {
background: Highlight;
}
.vp-marks span {
background: Canvas;
}
.vp-range::-webkit-slider-thumb {
background: Highlight;
box-shadow: none;
}
.vp-range:focus-visible::-webkit-slider-thumb {
outline: 2px solid CanvasText;
}
.ov-vchap__btn[aria-current='true'],
.ov-vtr__line.is-current {
outline: 2px solid Highlight;
}
}
/* ---- css/20-explorer.css ---- */
#transactions-root {
container: tx / inline-size;
}
.tx-results {
container: txres / inline-size;
}
.tx-head .view-lede {
margin-bottom: var(--s5);
}
.tx-head .view-lede strong {
font-weight: 650;
color: var(--ink);
}
.tx-bar {
display: flex;
flex-wrap: wrap;
align-items: flex-start;
gap: var(--s3) var(--s4);
margin-bottom: var(--s5);
}
.tx-search {
flex: 1 1 100%;
}
.tx-search__box {
position: relative;
}
.tx-search__box > .input {
padding-right: 48px;
text-overflow: ellipsis;
}
.tx-search__box > .input:placeholder-shown {
padding-right: var(--s3);
}
.tx-search__box > .input::-webkit-search-cancel-button {
-webkit-appearance: none;
appearance: none;
}
.tx-search__clear {
position: absolute;
right: 2px;
top: 50%;
transform: translateY(-50%);
display: inline-flex;
align-items: center;
justify-content: center;
width: 40px;
height: 40px;
border: 0;
border-radius: 50%;
background: transparent;
color: var(--ink-2);
}
.tx-search__clear:hover {
background: var(--surface-2);
color: var(--ink);
}
.tx-search__clear:focus-visible {
outline: none;
box-shadow: var(--focus-ring);
}
.tx-bar__tools {
display: flex;
flex: 1 1 100%;
align-items: flex-end;
gap: var(--s3);
min-width: 0;
}
.tx-sort {
flex: 1 1 12rem;
min-width: 0;
}
.tx-sort .select {
text-overflow: ellipsis;
}
.tx-filter-toggle {
flex: 0 0 auto;
border-radius: var(--radius-sm);
}
.tx-filter-toggle__chev {
transition: transform var(--dur) var(--ease);
}
.tx-filter-toggle[aria-expanded='true'] .tx-filter-toggle__chev {
transform: rotate(180deg);
}
@media (max-width: 400px) {
.tx-filter-toggle__chev {
display: none;
}
.tx-filter-toggle {
padding: 0 var(--s3);
}
}
@container tx (max-width: 479.98px) {
.tx-bar__tools {
display: grid;
grid-template-columns: minmax(0, 1fr) auto;
grid-template-areas: 'label toggle' 'select select';
align-items: end;
gap: var(--s2) var(--s3);
}
.tx-sort {
display: contents;
}
.tx-sort > .field__label {
grid-area: label;
margin-bottom: 0;
align-self: end;
}
.tx-sort > .select {
grid-area: select;
width: 100%;
}
.tx-filter-toggle {
grid-area: toggle;
}
}
.tx-filter-toggle[aria-expanded='true'] {
border-color: var(--primary);
background: var(--primary-wash);
}
.tx-badge {
display: inline-flex;
align-items: center;
justify-content: center;
min-width: 22px;
height: 22px;
padding: 0 6px;
border-radius: 999px;
background: var(--primary);
color: var(--on-primary);
font-size: var(--fs-xs);
font-weight: 700;
font-variant-numeric: tabular-nums;
}
.tx-layout {
display: grid;
gap: var(--s5);
align-items: start;
}
.tx-main {
min-width: 0;
}
.tx-filters {
background: var(--surface);
border: 1px solid var(--line);
border-radius: var(--radius-lg);
box-shadow: var(--shadow-1);
padding: var(--s4) var(--s5) var(--s5);
}
.tx-filters__title {
display: flex;
align-items: center;
gap: var(--s2);
font-size: var(--fs-md);
margin: 0 0 var(--s3);
}
.tx-filters__title .icon {
color: var(--muted);
}
.tx-filters__form {
display: grid;
gap: 0;
}
.tx-fs {
padding-block: var(--s4);
border-top: 1px solid var(--line);
}
.tx-fs__legend {
float: left;
width: 100%;
margin-bottom: var(--s2);
font-size: var(--fs-sm);
font-weight: 650;
color: var(--ink);
}
.tx-fs__legend + * {
clear: both;
}
.tx-fs__hint {
clear: both;
margin: 0 0 var(--s2);
}
.tx-fs .field__error {
margin: var(--s2) 0 0;
}
.tx-pair {
display: grid;
grid-template-columns: repeat(auto-fit, minmax(128px, 1fr));
gap: var(--s3);
}
.tx-sublabel {
font-weight: 600;
color: var(--ink-2);
font-size: var(--fs-xs);
}
.tx-date-input {
min-width: 0;
}
.tx-checks {

gap: 2px;
margin-inline: calc(var(--s2) * -1);
}
.tx-check {
display: flex;
align-items: center;
gap: var(--s3);
min-height: 44px;
padding: 0 var(--s2);
border-radius: var(--radius-sm);

}
.tx-check:hover {

.tx-check input {

margin: 0;

}
.tx-check:has(input:focus-visible) {

}
.tx-check:has(input:checked) .tx-check__label {

}
.tx-check__n {
margin-left: auto;
min-width: 24px;
padding: 0 6px;
border-radius: 999px;
background: var(--surface-2);
color: var(--ink-2);
font-size: var(--fs-xs);
font-variant-numeric: tabular-nums;
text-align: center;
}
.tx-check.is-zero .tx-check__label {
color: var(--muted);
}
.tx-check.is-zero .tx-check__n {
background: transparent;
box-shadow: inset 0 0 0 1px var(--line);
}
.tx-check__icon {
color: var(--muted);
margin-left: -4px;
}
.tx-check--radio input {
accent-color: var(--primary);
}
.tx-filters__foot {
display: flex;
flex-wrap: wrap;
gap: var(--s2);
padding-top: var(--s4);
border-top: 1px solid var(--line);
}
.tx-filters__foot .btn--primary {
flex: 1 1 auto;
}
@container tx (max-width: 959.98px) {

.tx-filters {

}
}
@container tx (min-width: 552px) and (max-width: 959.98px) {
.tx-sort {
flex: 0 1 320px;
margin-left: auto;
}
.tx-filters__form {

}
}
@container tx (min-width: 960px) {

flex-wrap: nowrap;
}
.tx-search {
flex: 1 1 auto;
}
.tx-bar__tools {
flex: 0 0 auto;
width: auto;
}
.tx-sort {
flex: 0 0 auto;
}
.tx-filter-toggle,
.tx-filters__foot {
display: none;
}
.tx-layout {
grid-template-columns: 264px minmax(0, 1fr);

}
.tx-check {

}
.tx-fs:last-child {
padding-bottom: 0;
}
}
.tx-chips-wrap:empty {

.inq-count {
margin: 0;
font-size: var(--fs-xs);
color: var(--muted);
text-align: right;
font-variant-numeric: tabular-nums;
}
.inq-count.is-low {
color: var(--warn);
font-weight: 650;
}
.inq-errors {
display: flex;
gap: var(--s3);
align-items: flex-start;
margin-bottom: var(--s5);
padding: var(--s4);
border: 2px solid var(--danger);
border-radius: var(--radius);
background: var(--danger-wash);
color: var(--ink);
}
.inq-errors > .icon {
color: var(--danger);
margin-top: 1px;
}
.inq-errors:focus-visible {
outline: 2px solid var(--focus);
outline-offset: 3px;
}
.inq-errors__body {
min-width: 0;
}
.inq-errors__title {
margin: 0 0 var(--s1);
font-size: var(--fs-base);
}
.inq-errors__list {
margin: 0;
padding-left: 1.1em;
font-size: var(--fs-sm);
}
.inq-errors__list a {
display: block;
min-height: 44px;
padding-block: 11px;
line-height: 1.5;
color: var(--danger);
font-weight: 650;
}
.inq-demo-note {
margin: var(--s2) 0 var(--s5);
}
.inq-review {
margin: 0;
border: 1px solid var(--line);
border-radius: var(--radius);
background: var(--surface);
}
.inq-review__row {
display: grid;
grid-template-columns: minmax(7.5rem, 30%) minmax(0, 1fr) auto;
gap: var(--s1) var(--s4);
align-items: start;
padding: var(--s4);
}
.inq-review__row + .inq-review__row {
border-top: 1px solid var(--line);
}
.inq-review dt {
font-size: var(--fs-sm);
color: var(--muted);
}
.inq-review dd {
margin: 0;
}
.inq-review__value,
.inq-stack {
display: flex;
flex-direction: column;
gap: 2px;
min-width: 0;
font-size: var(--fs-sm);
color: var(--ink);
overflow-wrap: anywhere;
}
.inq-review__strong {
font-weight: 650;
}
.inq-review__value .amount {
font-weight: 650;
}
.inq-quote {
white-space: pre-wrap;
overflow-wrap: anywhere;
}
.inq-review__action {
justify-self: end;
}
@media (max-width: 559px) {
.inq-review__row {
grid-template-columns: minmax(0, 1fr) auto;
}
.inq-review__row > dt {
grid-column: 1;
grid-row: 1;
align-self: center;
}
.inq-review__action {
grid-column: 2;
grid-row: 1;
}
.inq-review__value {
grid-column: 1 / -1;
grid-row: 2;
}
}
.inq-receipt {
display: flex;
gap: var(--s4);
align-items: flex-start;
padding: var(--s5);
border: 1px dashed var(--demo-line);
border-radius: var(--radius-lg);
background: var(--demo-bg);
color: var(--ink);
}
.inq-receipt__icon {
display: inline-flex;
align-items: center;
justify-content: center;
flex-shrink: 0;
width: 44px;
height: 44px;
border-radius: 50%;
border: 1px solid var(--demo-line);
background: var(--surface);
color: var(--demo-ink);
}
.inq-receipt__main {
min-width: 0;
}
.inq-receipt__label {
margin: 0 0 var(--s1);
font-size: var(--fs-xs);
font-weight: 700;
letter-spacing: 0.06em;
text-transform: uppercase;
color: var(--demo-ink);
}
.inq-receipt__ref {
display: flex;
flex-wrap: wrap;
align-items: center;
gap: var(--s2) var(--s3);
margin: 0 0 var(--s3);
}
.inq-receipt__code {
font-size: clamp(1.25rem, 1.5vw + 0.95rem, 1.6rem);
font-weight: 700;
letter-spacing: 0.04em;
color: var(--ink);
}
.inq-receipt__ref .tag {
white-space: normal;
}
.inq-receipt__body {
margin: 0;
font-size: var(--fs-sm);
color: var(--ink);
}
.inq-sec {
margin-top: var(--s6);
}
.inq-sec__title {
font-size: var(--fs-base);
margin-bottom: var(--s3);
}
.inq-sec__p {
font-size: var(--fs-sm);
color: var(--ink-2);
}
.inq-kv--done {
padding: 0;
}
.inq-prod {
display: grid;
gap: var(--s3);
margin: 0;
padding: 0;
list-style: none;
}
.inq-prod li {
display: flex;
align-items: flex-start;
gap: var(--s3);
font-size: var(--fs-sm);
color: var(--ink-2);
}
.inq-prod__icon {
display: inline-flex;
align-items: center;
justify-content: center;
flex-shrink: 0;
width: 28px;
height: 28px;
margin-top: -3px;
border-radius: 50%;
background: var(--primary-wash);
color: var(--primary-ink);
}
.inq-placeholder .tag {
margin-bottom: var(--s1);
}
.inq-placeholder p {
margin-bottom: var(--s1);
}
.dlg__foot.inq-foot {
align-items: center;
}
@media (max-width: 719px) {
.dlg__head.inq-head {
gap: 2px;
padding: var(--s2) var(--s2) var(--s3) var(--s4);
}
.inq-head__titlebar {
gap: var(--s2);
}
.inq-head__titlebar,
.steps.inq-steps {
padding-right: var(--s2);
margin-right: 0;
}
.dlg__body.inq-body {
padding-bottom: var(--s5);
}
.inq-receipt {
padding: var(--s4);
gap: var(--s3);
}
}
@media (max-width: 479px) {
.inq-steps__label {
position: absolute;
width: 1px;
height: 1px;
padding: 0;
margin: -1px;
overflow: hidden;
clip: rect(0, 0, 0, 0);
white-space: nowrap;
border: 0;
}
.steps.inq-steps {
margin-top: var(--s2);
}
.inq-receipt__icon {
display: none;
}
.inq-tx__amount {
flex-basis: 100%;
margin-left: 52px;
}
}
@media (max-width: 359px) {
.dlg__foot.inq-foot .btn.inq-foot__back {
flex: 0 0 44px;
width: 44px;
padding: 0;
border-radius: 50%;
}
.inq-foot__back span {
position: absolute;
width: 1px;
height: 1px;
margin: -1px;
overflow: hidden;
clip: rect(0, 0, 0, 0);
white-space: nowrap;
}
.dlg__foot.inq-foot .btn--primary {
white-space: normal;
text-align: center;
}
}
@media (forced-colors: active) {
.inq-tx,
.inq-review,
.inq-receipt,
.inq-errors {
border: 1px solid CanvasText;
}
.inq-field.is-invalid {
border-left-color: CanvasText;
}
}
/* ---- css/40-assistant.css ---- */
.asst {
position: fixed;
inset: 0 0 0 auto;
z-index: 150;
width: min(var(--drawer-w), 100vw);
max-width: 100vw;
height: 100vh;
height: 100dvh;
max-height: none;
margin: 0;
padding: 0;
border: 0;
border-left: 1px solid var(--line);
background: var(--surface);
color: var(--ink);
box-shadow: var(--shadow-3);
overflow: hidden;
overflow: clip;
}
.asst[open] {
display: flex;
flex-direction: column;
animation: yes-slide-in-right var(--dur) var(--ease);
}
.asst::backdrop {
background: var(--overlay);
}
.asst--docked {
box-shadow: var(--shadow-2);
}
@media (min-width: 720px) and (max-width: 1099px) {
.asst {
width: min(440px, calc(100vw - 48px));
}
}
@media (max-width: 719px) {
.asst {
width: 100vw;
border-left: 0;
box-shadow: none;
}
.asst[open] {
animation-name: yes-fade-up;
}
}
.asst__head {
position: relative;
flex: none;
padding: var(--s3) var(--s3) var(--s3) var(--s5);
border-bottom: 1px solid var(--line);
background: var(--surface);
}
.asst__bar {
display: grid;
grid-template-columns: auto minmax(0, 1fr) auto;
grid-template-areas:
'mark title tools'
'mark tag tag';
align-items: center;
column-gap: var(--s3);
row-gap: 2px;
}
.asst__mark {
grid-area: mark;
display: inline-flex;
align-items: center;
justify-content: center;
width: 36px;
height: 36px;
border-radius: 50%;
background: var(--ai-wash);
color: var(--ai);
}
.asst__title {
grid-area: title;
margin: 0;
font-size: var(--fs-lg);
overflow-wrap: anywhere;
}
.asst__tagline {
grid-area: tag;
margin: 0;
}
.asst__tools {
grid-area: tools;
display: flex;
align-items: center;
gap: var(--s1);
}
.asst__close {
color: var(--ink-2);
}
.asst__ctx {
margin: var(--s3) 0 0;
padding: 6px var(--s3);
border-radius: var(--radius);
background: var(--surface-2);
border: 1px solid var(--line);
font-size: var(--fs-sm);
line-height: 1.45;
overflow-wrap: anywhere;
}
.asst__ctx-k {
color: var(--ink-2);
font-weight: 650;
margin-right: 2px;
}
.asst__ctx-v {
font-weight: 600;
}
.asst__body {
position: relative;
flex: 1;
min-height: 0;
overflow-y: auto;
overscroll-behavior: contain;
padding: var(--s4) var(--s5) var(--s6);
background: var(--bg);
}
.asst__privacy {
margin-bottom: var(--s5);
}
.asst__privacy p {
margin: 0;
}
.asst__prod {
margin-top: 2px;
}
.asst__prod > summary {
display: inline-flex;
align-items: center;
min-height: 44px;
cursor: pointer;
color: var(--primary-ink);
font-weight: 650;
text-decoration: underline;
text-underline-offset: 2px;
border-radius: 4px;
}
.asst__prod > summary:focus-visible {
outline: 2px solid var(--focus);
outline-offset: 2px;
}
.asst__prod > p {
margin-top: var(--s2);
color: var(--ink-2);
}
.asst-thread {
list-style: none;
margin: 0;
padding: 0;
display: grid;
gap: var(--s6);
}
.asst-turn {
display: flex;
flex-direction: column;
gap: var(--s2);
min-width: 0;
}
.asst-turn--new {
animation: yes-fade-up var(--dur) var(--ease) both;
}
.asst-you {
align-self: flex-end;
max-width: 88%;
margin: 0;
padding: var(--s2) var(--s3);
border-radius: var(--radius) var(--radius) 4px var(--radius);
background: var(--primary-wash);
border: 1px solid color-mix(in srgb, var(--primary) 25%, var(--line));
font-size: var(--fs-sm);
font-weight: 600;
overflow-wrap: anywhere;
}
.asst-you .amount {
font-weight: 650;
}
.asst-you--ctx {
display: inline-flex;
align-items: flex-start;
gap: 6px;
background: transparent;
border: 1px dashed color-mix(in srgb, var(--ai) 45%, var(--line));
color: var(--ink-2);
font-weight: 600;
}
.asst-you--ctx > .icon {
margin-top: 3px;
color: var(--ai);
}
.asst-you--ctx .amount {
color: var(--ink);
}
.asst-ans {
min-width: 0;
background: var(--surface);
border: 1px solid var(--line);
border-radius: var(--radius-lg);
box-shadow: var(--shadow-1);
padding: var(--s4);
}
.asst-ans--policy {
border-color: color-mix(in srgb, var(--ai) 35%, var(--line));
}
.asst-ans__tags {
display: flex;
flex-wrap: wrap;
gap: var(--s1) var(--s2);
margin: 0 0 var(--s2);
}
.asst-tag-policy .icon {
color: var(--ai);
}
.asst-ans__title {
font-size: var(--fs-md);
margin: 0 0 var(--s2);
overflow-wrap: anywhere;
}
.asst-ans__title:focus-visible {
outline-offset: 3px;
}
.asst-ans__text {
font-size: var(--fs-sm);
color: var(--ink);
}
.asst-ans__text p {
margin: 0 0 var(--s2);
}
.asst-ans__text p:last-child {
margin-bottom: 0;
}
.asst-ans__list {
margin: 0 0 var(--s2);
padding-left: var(--s5);
}
.asst-ans__list li + li {
margin-top: var(--s1);
}
.asst-num {
font-variant-numeric: tabular-nums;
font-weight: 650;
white-space: nowrap;
}
.asst-sec {
margin-top: var(--s4);
}
.asst-sec__h {
display: flex;
align-items: center;
gap: 6px;
margin: 0 0 var(--s2);
font-size: var(--fs-xs);
font-weight: 700;
letter-spacing: 0.05em;
text-transform: uppercase;
color: var(--ink-2);
}
.asst-sec__h .icon {
color: var(--muted);
}
.asst-figs {
font-size: var(--fs-sm);
border-top: 1px solid var(--line);
}
.asst-figs th,
.asst-figs td {
padding: 7px 0;
border-bottom: 1px solid var(--line);
vertical-align: top;
}
.asst-figs th {
text-align: left;
font-weight: 500;
color: var(--ink-2);
padding-right: var(--s3);
}
.asst-figs td {
text-align: right;
}
.asst-figs td.num {
white-space: nowrap;
}
.asst-figs td.txt {
overflow-wrap: anywhere;
font-weight: 600;
}
.asst-figs tr.is-total th,
.asst-figs tr.is-total td {
border-top: 2px solid var(--line-strong);
color: var(--ink);
font-weight: 700;
}
.asst-sum {
display: flex;
flex-direction: column;
gap: 2px;
margin: var(--s2) 0 0;
padding: var(--s2) var(--s3);
border-radius: var(--radius-sm);
background: var(--surface-2);
font-size: var(--fs-xs);
}
.asst-sum__k {
color: var(--ink-2);
font-weight: 650;
}
.asst-sum__eq {
font-variant-numeric: tabular-nums;
color: var(--ink);
}
.asst-sum__eq > span {
white-space: nowrap;
}
.asst-sum__res {
font-weight: 700;
}
.asst-rows {
list-style: none;
margin: 0;
padding: 0;
border: 1px solid var(--line);
border-radius: var(--radius);
overflow: hidden;
background: var(--surface);
}
.asst-rows li + li {
border-top: 1px solid var(--line);
}
.asst-row {
display: flex;
align-items: center;
gap: var(--s3);
width: 100%;
min-height: 52px;
padding: var(--s2) var(--s2) var(--s2) var(--s3);
border: 0;
background: transparent;
color: var(--ink);
text-align: left;
transition: background-color var(--dur) var(--ease);
}
.asst-row:hover {
background: var(--surface-2);
}
.asst-row:focus-visible {
outline: 2px solid var(--focus);
outline-offset: -3px;
border-radius: var(--radius-sm);
}
.asst-row .dir {
width: 28px;
height: 28px;
}
.asst-row__main {
flex: 1;
min-width: 0;
display: flex;
flex-direction: column;
gap: 2px;
}
.asst-row__top {
display: flex;
flex-wrap: wrap;
align-items: baseline;
gap: 2px var(--s3);
}
.asst-row__desc {
flex: 1 1 100px;
min-width: 0;
font-size: var(--fs-sm);
font-weight: 600;
line-height: 1.3;
}
.asst-row__amt {
flex: none;
margin-left: auto;
font-size: var(--fs-sm);
text-align: right;
}
.asst-row__meta {
font-size: var(--fs-xs);
color: var(--muted);
}
.asst-row__id,
.asst-id {
white-space: nowrap;
font-variant-numeric: tabular-nums;
}
.asst-row__chev {
color: var(--muted);
}
.asst-sec__actions {
display: flex;
flex-wrap: wrap;
gap: var(--s2);
margin-top: var(--s2);
}
.asst-sec__actions .btn {
white-space: normal;
text-align: left;
}
.asst-inq {
display: flex;
flex-wrap: wrap;
align-items: center;
gap: var(--s2) var(--s3);
margin-top: var(--s4);
padding: var(--s3);
border-radius: var(--radius);
border: 1px solid var(--line);
background: var(--surface-2);
}
.asst-inq__text {
flex: 1 1 180px;
margin: 0;
font-size: var(--fs-sm);
color: var(--ink-2);
}
.asst-inq__btn {
flex: none;
max-width: 100%;
white-space: normal;
text-align: left;
}
.asst-inline-q {
margin-top: var(--s4);
}
.asst-inline-q__k {
margin: 0 0 var(--s2);
font-size: var(--fs-sm);
font-weight: 650;
}
.asst-qlist {
list-style: none;
margin: 0;
padding: 0;
display: flex;
flex-wrap: wrap;
gap: var(--s2);
}
.asst-q {
display: inline-flex;
align-items: center;
gap: var(--s2);
min-height: 44px;
padding: var(--s2) var(--s4) var(--s2) var(--s3);
border-radius: 22px;
border: 1px solid color-mix(in srgb, var(--ai) 40%, var(--line));
background: var(--surface);
color: var(--ink);
font-size: var(--fs-sm);
font-weight: 600;
line-height: 1.3;
text-align: left;
transition: background-color var(--dur) var(--ease), border-color var(--dur) var(--ease);
}
.asst-q .icon {
color: var(--ai);
}
.asst-q:hover {
background: var(--ai-wash);
border-color: var(--ai);
}
.asst-q:focus-visible {
outline: none;
box-shadow: var(--focus-ring);
}
.asst-src {
display: flex;
align-items: flex-start;
gap: 6px;
margin: var(--s4) 0 0;
font-size: var(--fs-xs);
color: var(--muted);
}
.asst-src .icon {
margin-top: 2px;
}
.asst-ans__foot {
display: flex;
flex-direction: column;
gap: var(--s2);
margin-top: var(--s3);
padding-top: var(--s3);
border-top: 1px solid var(--line);
}
.asst-ans--welcome .asst-ans__foot {
border-top: 0;
padding-top: 0;
}
.asst-fb__row {
display: flex;
flex-wrap: wrap;
align-items: center;
gap: var(--s2);
}
.asst-fb__q {
font-size: var(--fs-sm);
font-weight: 650;
margin-right: auto;
}
.asst-fb__btn {
display: inline-flex;
align-items: center;
gap: 6px;
min-height: 44px;
min-width: 64px;
padding: 0 var(--s3);
border-radius: 999px;
border: 1px solid var(--line-strong);
background: var(--surface);
color: var(--ink);
font-size: var(--fs-sm);
font-weight: 600;
justify-content: center;
}
.asst-fb__btn:hover {
background: var(--surface-2);
}
.asst-fb__btn:focus-visible {
outline: none;
box-shadow: var(--focus-ring);
}
.asst-fb__btn[aria-pressed='true'] {
background: var(--primary);
border-color: var(--primary);
color: var(--on-primary);
}
.asst-fb__note {
display: flex;
align-items: flex-start;
gap: 6px;
margin: var(--s1) 0 0;
font-size: var(--fs-xs);
color: var(--muted);
}
.asst-fb__note .icon {
margin-top: 2px;
color: var(--ok);
}
.asst-ans__links {
display: flex;
flex-wrap: wrap;
gap: var(--s1) var(--s2);
margin-left: calc(var(--s3) * -1);
}
.asst-ans__links .btn {
max-width: 100%;
color: var(--primary-ink);
white-space: normal;
text-align: left;
}
.asst-sugg {
margin-top: var(--s8);
}
.asst-sugg__h {
font-size: var(--fs-sm);
font-weight: 700;
color: var(--ink-2);
margin-bottom: var(--s3);
}
.asst-clear {
margin: var(--s5) 0 0;
}
.asst-clear .btn {
color: var(--ink-2);
}
.asst__form {
position: relative;
flex: none;
padding: var(--s3) var(--s5) calc(var(--s3) + env(safe-area-inset-bottom, 0px));
border-top: 1px solid var(--line);
background: var(--surface);
}
.asst__label {
display: block;
margin-bottom: 6px;
font-size: var(--fs-sm);
font-weight: 650;
}
.asst__row {
display: flex;
gap: var(--s2);
}
.asst__row .input {
flex: 1;
min-width: 0;
border-radius: 999px;
padding-inline: var(--s4);
}
.asst__send {
flex: none;
}
.asst__hint {
display: flex;
align-items: flex-start;
gap: 6px;
margin: var(--s2) 0 0;
font-size: var(--fs-xs);
color: var(--muted);
}
.asst__hint .icon {
margin-top: 2px;
flex: none;
}
@media (max-width: 379px) {
.asst__head {
padding-left: var(--s4);
}
.asst__body {
padding-inline: var(--s3);
}
.asst__form {
padding-inline: var(--s3);
}
.asst-ans {
padding: var(--s3);
}
.asst-fb__q {
flex-basis: 100%;
}
.asst__send span {
position: absolute;
width: 1px;
height: 1px;
overflow: hidden;
clip: rect(0, 0, 0, 0);
white-space: nowrap;
}
.asst__send {
width: 44px;
padding: 0;
border-radius: 50%;
}
}
@media (max-height: 640px) {
.asst__head {
padding: var(--s2) var(--s2) var(--s2) var(--s4);
}
.asst__mark {
display: none;
}
.asst__bar {

function journeyItems(info) {

});

init: function () {
var el = doc.getElementById('overview-root');
if (!el) return;
ui.delegate(el, 'click', '[data-ov-step]', function (e, b) {
var id = b.getAttribute('data-ov-step');
if (YES.state.journeyStep === id) clearSelection({ returnFocus: false });
else select(id, { trigger: b });
});
ui.delegate(el, 'click', '[data-ov-clear]', function () {
clearSelection({ returnFocus: true });
});
ui.delegate(el, 'click', '[data-ov-show]', function (e, b) {
showInTransactions({ step: b.getAttribute('data-ov-show') });
});
ui.delegate(el, 'click', '[data-ov-explore]', function () {
showInTransactions({});
});
ui.delegate(el, 'click', '[data-ov-select]', function (e, b) {
YES.overview.selectStep(b.getAttribute('data-ov-select'));
});
ui.delegate(el, 'click', '[data-ov-tx]', function (e, b) {
openTx(b.getAttribute('data-ov-tx'), b);
});
ui.delegate(el, 'click', '[data-ov-notin-all]', function () {
var ids = YES.calc.notInBalance().map(function (tx) {
return tx.id;
});
YES.explorer.showRows(ids, localised('overview.notIn.listLabel'));
if (YES.state.view !== 'transactions') YES.nav.go('transactions');
});
ui.delegate(el, 'click', '[data-ov-learn]', function (e, b) {
YES.understand.openTopic(b.getAttribute('data-ov-learn'));
});
ui.delegate(el, 'click', '[data-ov-help]', function () {
YES.help.open('contact');
});
bindPlayer(el);
el.addEventListener('pointermove', function (e) {
var plot = e.target.closest && e.target.closest('[data-ov-plot]');
if (!plot) {
if (chart.hover !== -1) {
chart.hover = -1;
if (!pointFocused()) hideTip();
}
return;
}
if (e.pointerType === 'touch') return;
var i = nearestAt(e.clientX, e.clientY);
if (i !== chart.hover && i !== -1) {
chart.hover = i;
showTip(i);
}
});
el.addEventListener('pointerleave', function () {
chart.hover = -1;
if (!pointFocused()) hideTip();
});
ui.delegate(el, 'click', '[data-ov-plot]', function (e) {
if (e.target.closest('[data-ov-tx]')) return;
var i = nearestAt(e.clientX, e.clientY);
if (i !== -1)
openTx(
chart.pts[i].id,
pointButton(i),
chart.pts.map(function (p) {
return p.id;
})
);
});
ui.delegate(el, 'keydown', '[data-ov-pt]', onPointKey);
el.addEventListener('focusin', function (e) {
var b = e.target.closest && e.target.closest('[data-ov-pt]');
if (!b) return;
var i = +b.getAttribute('data-ov-pt');
setRoving(i);
showTip(i);
});
el.addEventListener('focusout', function (e) {
var b = e.target.closest && e.target.closest('[data-ov-pt]');
if (!b) return;
var next = e.relatedTarget && e.relatedTarget.closest && e.relatedTarget.closest('[data-ov-pt]');
if (!next && chart.hover === -1) hideTip();
});
el.addEventListener(
'toggle',
function (e) {
var d = e.target;
var key = d && d.getAttribute && d.getAttribute('data-ov-disclosure');
if (key && !!ovState()[key] !== d.open) setOv(key, d.open);
},
true
);
var routeView = null;
YES.on('route', function (r) {
var sameView = routeView === 'overview';
routeView = r.view;
if (r.view !== 'overview' || !r.param || r.param === YES.state.journeyStep) return;
var info = selectionInfo(r.param);
if (!info) return;
pendingAnim = true;
YES.set({ journeyStep: r.param });
pendingAnim = false;
if (sameView) ui.announce(selectedMessage(info));
});
root.addEventListener('hashchange', function () {
if (!YES.nav.isRouteHash(root.location.hash)) return;
var r = YES.nav.current();
if (r.view === 'overview' && !r.param && YES.state.journeyStep) clearSelection({ fromHistory: true });
});
if (root.ResizeObserver) {
observer = new root.ResizeObserver(function () {
root.requestAnimationFrame(function () {
var host = plotHost();
if (host && host.clientWidth && Math.abs(host.clientWidth - chart.lastW) >= 2) renderPlot();
placePanel();
VP.targets = null;
draw();
});
});
} else {
root.addEventListener('resize', function () {
renderPlot();
placePanel();
});
}
render();
},
render: render,
onState: function (keys) {
if (keys.indexOf('journeyStep') === -1) return;
var prev = lastStep;
lastStep = YES.state.journeyStep || null;
syncJourney();
syncExplorer(prev, lastStep);
}
});
})(window);

}

}

function equationHtml() {

esc(label) +
'</span></span></span>'
);
var full = YES.fmt.amount(Math.abs(s.value), { sign: 'never' });

init: function () {
els.root = doc.getElementById('help-root');
els.print = doc.getElementById('print-root');
if (!els.root) return;
inited = true;
var r = els.root;
ui.delegate(r, 'click', '[data-help-go]', function (e, a) {
e.preventDefault();
open(a.getAttribute('data-help-go'));
});
ui.delegate(r, 'click', '[data-help-copy]', function (e, b) {
var sup = YES.config.support;
var v = { phone: sup.phone, email: sup.email }[b.getAttribute('data-help-copy')];
if (v) ui.copy(v);
});
ui.delegate(r, 'click', '[data-help-print]', function () {
renderPrint();
if (typeof root.print === 'function') root.print();
});
ui.delegate(r, 'click', '[data-help-pdf]', function () {
downloadPdf();
});
ui.delegate(r, 'click', '[data-help-csv]', function () {
YES.explorer.exportCsv('all');
});
ui.delegate(r, 'click', '[data-help-ask]', function (e, b) {
YES.assistant.open({ topic: 'general', trigger: b });
});
ui.delegate(r, 'click', '[data-help-resume]', function (e, b) {
YES.inquiry.resume({ trigger: b });
});
ui.delegate(r, 'click', '[data-help-opentx]', function (e, b) {
YES.explorer.openTx(b.getAttribute('data-help-opentx'), { trigger: b });
});
ui.delegate(r, 'change', 'input[name="help-fb-rating"]', function (e, input) {
var hadError = H().error;
setH({ rating: input.value, error: false });
if (hadError) renderFeedback();
});
ui.delegate(r, 'input', '#help-fb-comment', function (e, box) {
setH({ comment: box.value });
});
ui.delegate(r, 'submit', '[data-help-fb]', function (e) {
e.preventDefault();
submitFeedback();
});
ui.delegate(r, 'click', '[data-help-fb-edit]', function () {
var rec = savedFeedback();
setH({ editing: true, error: false, rating: rec ? rec.rating : '', comment: rec ? rec.comment : '' });
renderFeedback();
var target = els.root.querySelector('input[name="help-fb-rating"]:checked') || els.root.querySelector('input[name="help-fb-rating"]');
if (target) target.focus();
});
ui.delegate(r, 'click', '[data-help-fb-cancel]', function () {
setH({ editing: false, error: false });
renderFeedback();
ui.focusKey('help-fb-edit');
});
YES.on('route', onRoute);
YES.on('userway', renderUserway);
root.addEventListener('beforeprint', renderPrint);
this.render();
},
render: render,
onState: function (keys) {
if (!inited) return;
if (keys.indexOf('inquiry') !== -1) renderQuickTx();
if (keys.indexOf('feedback') !== -1) renderFeedback();
}
});

(function (root) {
'use strict';
var YES = root.YES;
var doc = root.document;
function applyBrandSlots() {
var s = YES.config.slots;
var r = doc.documentElement.style;
r.setProperty('--yes-primary-slot', s.YES_PRIMARY);
r.setProperty('--yes-primary-dark-slot', s.YES_PRIMARY_DARK || s.YES_PRIMARY);
r.setProperty('--yes-accent-slot', s.YES_ACCENT);
r.setProperty('--yes-font-slot', s.YES_FONT);
}
function initialLang() {
var fromHash = YES.nav.current().params.lang;
if (fromHash && YES.config.languages.indexOf(fromHash) !== -1) return fromHash;
try {
var stored = root.sessionStorage.getItem('yes.lang');
if (stored && YES.config.languages.indexOf(stored) !== -1) return stored;
} catch (e) {
}
return YES.data.statement.language || YES.config.defaultLanguage;
}
function boot() {
YES.theme.init();
applyBrandSlots();
var simulate = YES.nav.current().params.simulate;
if (simulate === 'mismatch') YES.data = YES.calc.simulateMismatch(YES.data);
var lang = initialLang();
YES.i18n.lang = lang;
YES.state.lang = lang;
doc.documentElement.lang = lang;
YES.integrity = YES.calc.reconcile(YES.data);
var withheld = !YES.integrity.ok && YES.config.reconciliation.blockOnMismatch;
doc.documentElement.classList.toggle('is-withheld', withheld);
if (withheld && root.console) console[YES.data.simulated ? 'warn' : 'error']('[YES] statement withheld: reconciliation failed', YES.integrity);
YES.initModules(function (m) {
return !withheld || m.name === 'shell';
});
if (withheld) {
var h = doc.getElementById('withheld-title');
if (h) h.focus();
} else {
YES.nav.apply();
}
doc.documentElement.classList.add('is-ready');
YES.ready = true;
YES.emit('ready');
root.addEventListener('hashchange', function () {
if (!YES.nav.isRouteHash(root.location.hash)) return;
var now = YES.nav.current().params.simulate || null;
if ((now || null) !== (simulate || null)) root.location.reload();
});
YES.userway.load();
}
if (doc.readyState === 'loading') doc.addEventListener('DOMContentLoaded', boot);
else boot();
})(window);
