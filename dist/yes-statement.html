/* ---- css/00-tokens.css ---- */
/*
 * Design tokens. Brand slots ([YES_PRIMARY], [YES_ACCENT], [YES_FONT]) are set
 * at boot from YES.config.slots; every component reads roles, never raw hex.
 * Light and dark schemes are selected separately (not an automatic flip).
 */
:root {
  color-scheme: light;

  /* Brand slots (placeholders until YES assets are approved) */
  --yes-primary: var(--yes-primary-slot, #0e5a8a);
  --yes-accent: var(--yes-accent-slot, #e8a33d);
  --yes-font: var(--yes-font-slot, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif);

  /* Surfaces */
  --bg: #f5f6f8; /* page plane */
  --surface: #ffffff; /* cards, dialogs, chart surface */
  --surface-2: #f0f2f5; /* insets, table header, hover wash */
  --surface-3: #e6e9ee;
  --overlay: rgba(14, 22, 33, 0.48);

  /* Ink (all text tokens ≥ 4.5:1 on --surface and --surface-2) */
  --ink: #111820;
  --ink-2: #3f4a57;
  --muted: #5d6874;
  --on-primary: #ffffff;

  /* Lines */
  --line: #dde2e8;
  --line-strong: #b9c2cd;

  /* Interaction */
  --primary: var(--yes-primary);
  --primary-hover: color-mix(in srgb, var(--yes-primary) 86%, #000);
  --primary-wash: color-mix(in srgb, var(--yes-primary) 9%, var(--surface));
  --primary-ink: color-mix(in srgb, var(--yes-primary) 88%, #000); /* primary used as text */
  --accent: var(--yes-accent);
  --focus: #1a5fd0;
  --focus-ring: 0 0 0 3px var(--surface), 0 0 0 5px var(--focus);

  /* Data: direction (validated pair, ≥3:1 on surface). Marks only — text uses ink. */
  --in: #1d6fd6;
  --in-wash: #e3eefb;
  --out: #c2552b;
  --out-wash: #fbe9e1;
  --total: #3f4a57; /* opening / closing bars */
  --grid: #e6e9ee;
  --axis: #b9c2cd;

  /* Status (always paired with icon + label) */
  --ok: #0a7a35;
  --ok-wash: #e4f4ea;
  --warn: #8a5a00;
  --warn-wash: #fff3d6;
  --warn-line: #e0a100;
  --danger: #b42318;
  --danger-wash: #fdecea;
  --info: #1a5fd0;
  --info-wash: #e7effc;

  /* Demo / illustrative marking */
  --demo-ink: #4f3800;
  --demo-bg: #fff4d1;
  --demo-line: #d9a200;
  --ai: #5b3fbf; /* "Explain with AI" accent (border/icon) */
  --ai-wash: #f1edfc;

  /* Type scale */
  --fs-hero: clamp(2.6rem, 6vw + 1rem, 3.75rem);
  --fs-xl: clamp(1.5rem, 1.6vw + 1rem, 2rem);
  --fs-lg: 1.25rem;
  --fs-md: 1.0625rem;
  --fs-base: 1rem;
  --fs-sm: 0.875rem;
  --fs-xs: 0.8125rem;
  --lh: 1.5;

  /* Space (4px grid) */
  --s1: 4px;
  --s2: 8px;
  --s3: 12px;
  --s4: 16px;
  --s5: 20px;
  --s6: 24px;
  --s8: 32px;
  --s10: 40px;
  --s12: 48px;
  --s16: 64px;

  --radius-sm: 6px;
  --radius: 10px;
  --radius-lg: 16px;
  --shadow-1: 0 1px 2px rgba(17, 24, 32, 0.06), 0 1px 1px rgba(17, 24, 32, 0.04);
  --shadow-2: 0 6px 20px rgba(17, 24, 32, 0.1), 0 2px 6px rgba(17, 24, 32, 0.06);
  --shadow-3: 0 20px 48px rgba(17, 24, 32, 0.18);

  --container: 1120px;
  --gutter: 16px;
  --masthead-h: 112px;
  --drawer-w: 400px;

  --ease: cubic-bezier(0.2, 0.7, 0.2, 1);
  --dur: 220ms;
}

@media (min-width: 720px) {
  :root {
    --gutter: 24px;
  }
}

@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --yes-primary: var(--yes-primary-dark-slot, #6cb4ee);

    --bg: #0e1116;
    --surface: #161a21;
    --surface-2: #1d222b;
    --surface-3: #262c36;
    --overlay: rgba(0, 0, 0, 0.62);

    --ink: #f1f4f8;
    --ink-2: #c5ccd6;
    --muted: #a3acb8;
    --on-primary: #0b1220;

    --line: #2b323d;
    --line-strong: #46505e;

    --primary-hover: color-mix(in srgb, var(--yes-primary) 85%, #fff);
    --primary-wash: color-mix(in srgb, var(--yes-primary) 14%, var(--surface));
    --primary-ink: var(--yes-primary);
    --focus: #8ab4ff;

    --in: #4b94ea;
    --in-wash: #182a40;
    --out: #e0703f;
    --out-wash: #3a2219;
    --total: #aeb7c3;
    --grid: #262c36;
    --axis: #46505e;

    --ok: #4cc27a;
    --ok-wash: #15291e;
    --warn: #f0b84a;
    --warn-wash: #2f2512;
    --warn-line: #b58300;
    --danger: #ff8a7f;
    --danger-wash: #3a1d1b;
    --info: #8ab4ff;
    --info-wash: #17233a;

    --demo-ink: #ffd772;
    --demo-bg: #2e2510;
    --demo-line: #8f6c10;
    --ai: #b3a2f5;
    --ai-wash: #231d3b;

    --shadow-1: 0 1px 2px rgba(0, 0, 0, 0.5);
    --shadow-2: 0 6px 20px rgba(0, 0, 0, 0.45);
    --shadow-3: 0 20px 48px rgba(0, 0, 0, 0.6);
  }
}

/* ---- css/01-base.css ---- */
/* Base: reset, typography, focus, motion, utilities. */
*,
*::before,
*::after {
  box-sizing: border-box;
}
html {
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
  scroll-padding-top: calc(var(--masthead-h) + var(--s4));
}
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--yes-font);
  font-size: var(--fs-base);
  line-height: var(--lh);
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
  min-height: 100vh;
}
html.has-modal body {
  overflow: hidden;
}
h1,
h2,
h3,
h4 {
  line-height: 1.25;
  margin: 0 0 var(--s3);
  font-weight: 650;
  letter-spacing: -0.01em;
  color: var(--ink);
}
h1 {
  font-size: var(--fs-xl);
}
h2 {
  font-size: var(--fs-lg);
}
h3 {
  font-size: var(--fs-md);
}
h4 {
  font-size: var(--fs-base);
}
p {
  margin: 0 0 var(--s3);
}
a {
  color: var(--primary-ink);
  text-underline-offset: 2px;
}
a:hover {
  text-decoration-thickness: 2px;
}
img,
svg {
  max-width: 100%;
}
svg {
  flex-shrink: 0;
}
button,
input,
select,
textarea {
  font: inherit;
  color: inherit;
}
button {
  cursor: pointer;
}
button:disabled {
  cursor: not-allowed;
}
table {
  border-collapse: collapse;
  width: 100%;
}
[hidden] {
  display: none !important;
}
:focus {
  outline: none;
}
:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 2px;
  border-radius: 4px;
}
[tabindex='-1']:focus {
  outline: none;
}
[tabindex='-1']:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 4px;
}
::selection {
  background: color-mix(in srgb, var(--focus) 30%, transparent);
}
.tabular,
td.num,
th.num {
  font-variant-numeric: tabular-nums;
}
.sr-only {
  position: absolute !important;
  width: 1px !important;
  height: 1px !important;
  padding: 0 !important;
  margin: -1px !important;
  overflow: hidden !important;
  clip: rect(0, 0, 0, 0) !important;
  white-space: nowrap !important;
  border: 0 !important;
}
.skip-link {
  position: absolute;
  left: var(--s4);
  top: -100px;
  z-index: 1000;
  background: var(--surface);
  color: var(--ink);
  padding: var(--s3) var(--s4);
  border-radius: var(--radius);
  box-shadow: var(--shadow-2);
  font-weight: 600;
}
.skip-link:focus {
  top: var(--s3);
}
.container {
  width: 100%;
  max-width: var(--container);
  margin-inline: auto;
  padding-inline: var(--gutter);
}
.muted {
  color: var(--muted);
}
.small {
  font-size: var(--fs-sm);
}
.nowrap {
  white-space: nowrap;
}
.stack > * + * {
  margin-top: var(--s4);
}
.row {
  display: flex;
  flex-wrap: wrap;
  gap: var(--s3);
  align-items: center;
}
.spacer {
  flex: 1;
}
.mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace;
  font-size: 0.92em;
  overflow-wrap: anywhere;
}

/* Motion: short, optional, never required. Disabled under reduced motion. */
@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
    scroll-behavior: auto !important;
  }
}
@keyframes yes-fade-up {
  from {
    opacity: 0;
    transform: translateY(8px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}
@keyframes yes-slide-in-right {
  from {
    transform: translateX(24px);
    opacity: 0;
  }
  to {
    transform: none;
    opacity: 1;
  }
}
@keyframes yes-highlight {
  from {
    background-color: var(--primary-wash);
  }
  to {
    background-color: transparent;
  }
}
.anim-in {
  animation: yes-fade-up var(--dur) var(--ease) both;
}

/* ---- css/02-components.css ---- */
/*
 * Shared component library. Feature modules compose these classes and add only
 * module-specific layout in their own stylesheet.
 */

/* ---------------------------------------------------------------- Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--s2);
  min-height: 44px;
  padding: 0 var(--s4);
  border-radius: 999px;
  border: 1px solid var(--line-strong);
  background: var(--surface);
  color: var(--ink);
  font-weight: 600;
  font-size: var(--fs-sm);
  line-height: 1.2;
  text-decoration: none;
  white-space: nowrap;
  transition: background-color var(--dur) var(--ease), border-color var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
}
.btn:hover {
  background: var(--surface-2);
  border-color: var(--ink-2);
}
.btn:focus-visible {
  outline: none;
  box-shadow: var(--focus-ring);
}
.btn[disabled],
.btn[aria-disabled='true'] {
  opacity: 0.55;
  pointer-events: none;
}
.btn--primary {
  background: var(--primary);
  border-color: var(--primary);
  color: var(--on-primary);
}
.btn--primary:hover {
  background: var(--primary-hover);
  border-color: var(--primary-hover);
}
.btn--ghost {
  border-color: transparent;
  background: transparent;
}
.btn--ghost:hover {
  background: var(--surface-2);
  border-color: transparent;
}
.btn--sm {
  min-height: 36px;
  padding: 0 var(--s3);
  font-size: var(--fs-xs);
}
.btn--block {
  width: 100%;
}
.btn--icon {
  width: 44px;
  padding: 0;
  border-radius: 50%;
}
.btn--icon.btn--sm {
  width: 36px;
}
.btn--ai {
  border-color: color-mix(in srgb, var(--ai) 55%, var(--line));
  color: var(--ink);
  background: var(--ai-wash);
}
.btn--ai .icon {
  color: var(--ai);
}
.btn--ai:hover {
  border-color: var(--ai);
  background: color-mix(in srgb, var(--ai) 14%, var(--surface));
}
.btn--link {
  border: 0;
  background: none;
  padding: 0;
  min-height: 0;
  color: var(--primary-ink);
  text-decoration: underline;
  text-underline-offset: 2px;
  border-radius: 2px;
  font-weight: 600;
}
.btn--link:hover {
  background: none;
  text-decoration-thickness: 2px;
}
.btn--danger {
  color: var(--danger);
  border-color: color-mix(in srgb, var(--danger) 45%, var(--line));
}

/* ------------------------------------------------------------------ Cards */
.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-1);
  padding: var(--s5);
}
@media (min-width: 720px) {
  .card {
    padding: var(--s6);
  }
}
.card--flat {
  box-shadow: none;
}
.card--inset {
  background: var(--surface-2);
  border-color: transparent;
  box-shadow: none;
}
.card__title {
  display: flex;
  align-items: center;
  gap: var(--s2);
  margin-bottom: var(--s3);
}
.card__eyebrow {
  font-size: var(--fs-xs);
  font-weight: 650;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--muted);
  margin: 0 0 var(--s2);
}
.section {
  margin-block: var(--s8);
}
.section__head {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--s2) var(--s4);
  margin-bottom: var(--s4);
}
.view-title {
  font-size: var(--fs-xl);
  margin: var(--s6) 0 var(--s2);
}
.view-lede {
  color: var(--ink-2);
  max-width: 65ch;
  margin-bottom: var(--s6);
}

/* ------------------------------------------------------- Badges and tags */
.demo-badge {
  display: inline-flex;
  align-items: center;
  gap: var(--s1);
  padding: 2px 10px 2px 8px;
  border-radius: 999px;
  border: 1px solid var(--demo-line);
  background: var(--demo-bg);
  color: var(--demo-ink);
  font-size: var(--fs-xs);
  font-weight: 700;
  line-height: 1.6;
  white-space: nowrap;
}
.tag {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 1px 8px;
  border-radius: 999px;
  background: var(--surface-2);
  border: 1px solid var(--line);
  color: var(--ink-2);
  font-size: var(--fs-xs);
  font-weight: 600;
  line-height: 1.6;
  white-space: nowrap;
}
.tag--illustrative {
  background: var(--demo-bg);
  border-color: var(--demo-line);
  color: var(--demo-ink);
}
.tag--ai {
  background: var(--ai-wash);
  border-color: color-mix(in srgb, var(--ai) 45%, var(--line));
  color: var(--ink);
}
.tag--ai .icon {
  color: var(--ai);
}

/* Status chip: icon + label, never colour alone. */
.status {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: var(--fs-xs);
  font-weight: 650;
  padding: 1px 8px 1px 6px;
  border-radius: 999px;
  white-space: nowrap;
  line-height: 1.6;
}
.status--posted {
  color: var(--ok);
  background: var(--ok-wash);
}
.status--pending {
  color: var(--warn);
  background: var(--warn-wash);
  box-shadow: inset 0 0 0 1px var(--warn-line);
}
.status--failed {
  color: var(--danger);
  background: var(--danger-wash);
}
.status--unknown {
  color: var(--ink-2);
  background: var(--surface-2);
  box-shadow: inset 0 0 0 1px var(--line-strong);
}

/* Amounts: sign + icon/label carry direction; colour is supplementary. */
.amount {
  font-variant-numeric: tabular-nums;
  font-weight: 650;
  white-space: nowrap;
}
.amount--in {
  color: var(--ink);
}
.amount--out {
  color: var(--ink);
}
.dir {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 32px;
  height: 32px;
  border-radius: 50%;
  flex-shrink: 0;
}
.dir--in {
  background: var(--in-wash);
  color: var(--in);
}
.dir--out {
  background: var(--out-wash);
  color: var(--out);
}
.dir--neutral {
  background: var(--surface-2);
  color: var(--ink-2);
}

/* ---------------------------------------------------------------- Notices */
.notice {
  display: flex;
  gap: var(--s3);
  align-items: flex-start;
  padding: var(--s3) var(--s4);
  border-radius: var(--radius);
  border: 1px solid var(--line);
  background: var(--surface-2);
  color: var(--ink);
  font-size: var(--fs-sm);
}
.notice > .icon {
  margin-top: 2px;
}
.notice p:last-child {
  margin-bottom: 0;
}
.notice--info {
  background: var(--info-wash);
  border-color: color-mix(in srgb, var(--info) 35%, var(--line));
}
.notice--info > .icon {
  color: var(--info);
}
.notice--warn {
  background: var(--warn-wash);
  border-color: var(--warn-line);
}
.notice--warn > .icon {
  color: var(--warn);
}
.notice--critical {
  background: var(--danger-wash);
  border-color: color-mix(in srgb, var(--danger) 50%, var(--line));
}
.notice--critical > .icon {
  color: var(--danger);
}
.notice--illustrative {
  background: var(--demo-bg);
  border: 1px dashed var(--demo-line);
  color: var(--ink);
}
.notice--illustrative > .icon {
  color: var(--demo-ink);
}
.notice--ok {
  background: var(--ok-wash);
  border-color: color-mix(in srgb, var(--ok) 40%, var(--line));
}
.notice--ok > .icon {
  color: var(--ok);
}

/* ---------------------------------------------------- Key/value details */
.kv {
  display: grid;
  grid-template-columns: minmax(8rem, 40%) 1fr;
  gap: var(--s2) var(--s4);
  margin: 0;
  font-size: var(--fs-sm);
}
.kv dt {
  color: var(--muted);
}
.kv dd {
  margin: 0;
  color: var(--ink);
  overflow-wrap: anywhere;
}
@media (max-width: 419px) {
  .kv {
    grid-template-columns: 1fr;
    gap: 0;
  }
  .kv dd {
    margin-bottom: var(--s2);
  }
}

/* ---------------------------------------------------- Disclosure (details) */
.disclosure {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  background: var(--surface);
}
.disclosure + .disclosure {
  margin-top: var(--s2);
}
.disclosure > summary {
  list-style: none;
  display: flex;
  align-items: center;
  gap: var(--s3);
  min-height: 48px;
  padding: var(--s3) var(--s4);
  cursor: pointer;
  font-weight: 600;
  border-radius: var(--radius);
}
.disclosure > summary::-webkit-details-marker {
  display: none;
}
.disclosure > summary::after {
  content: '';
  margin-left: auto;
  width: 10px;
  height: 10px;
  border-right: 2px solid var(--ink-2);
  border-bottom: 2px solid var(--ink-2);
  transform: rotate(45deg) translate(-2px, -2px);
  transition: transform var(--dur) var(--ease);
  flex-shrink: 0;
}
.disclosure[open] > summary::after {
  transform: rotate(225deg) translate(-2px, -2px);
}
.disclosure > summary:hover {
  background: var(--surface-2);
}
.disclosure > summary:focus-visible {
  outline: none;
  box-shadow: var(--focus-ring);
}
.disclosure__body {
  padding: 0 var(--s4) var(--s4);
  color: var(--ink-2);
  font-size: var(--fs-sm);
}

/* ------------------------------------------------------------------ Forms */
.field {
  display: flex;
  flex-direction: column;
  gap: 6px;
  min-width: 0;
}
.field__label {
  font-size: var(--fs-sm);
  font-weight: 650;
  color: var(--ink);
}
.field__hint {
  font-size: var(--fs-xs);
  color: var(--muted);
}
.field__error {
  display: flex;
  gap: 6px;
  align-items: flex-start;
  font-size: var(--fs-sm);
  color: var(--danger);
  font-weight: 600;
}
.input,
.select,
.textarea {
  width: 100%;
  min-height: 44px;
  padding: 10px 12px;
  border: 1px solid var(--line-strong);
  border-radius: var(--radius-sm);
  background: var(--surface);
  color: var(--ink);
  font-size: var(--fs-base);
}
.textarea {
  min-height: 96px;
  resize: vertical;
}
.select {
  appearance: none;
  -webkit-appearance: none;
  padding-right: 36px;
  background-image: linear-gradient(45deg, transparent 50%, var(--ink-2) 50%), linear-gradient(135deg, var(--ink-2) 50%, transparent 50%);
  background-position: calc(100% - 18px) 55%, calc(100% - 13px) 55%;
  background-size: 5px 5px;
  background-repeat: no-repeat;
}
.input:focus-visible,
.select:focus-visible,
.textarea:focus-visible {
  outline: none;
  border-color: var(--focus);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 35%, transparent);
}
.input[aria-invalid='true'],
.select[aria-invalid='true'],
.textarea[aria-invalid='true'] {
  border-color: var(--danger);
  box-shadow: 0 0 0 1px var(--danger);
}
.input-icon {
  position: relative;
}
.input-icon > .icon {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--muted);
  pointer-events: none;
}
.input-icon > .input {
  padding-left: 40px;
}
fieldset {
  border: 0;
  padding: 0;
  margin: 0;
  min-width: 0;
}
legend {
  padding: 0;
  font-size: var(--fs-sm);
  font-weight: 650;
  margin-bottom: 6px;
}
.choice {
  display: flex;
  align-items: flex-start;
  gap: var(--s2);
  min-height: 44px;
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  background: var(--surface);
  cursor: pointer;
  font-size: var(--fs-sm);
}
.choice:hover {
  border-color: var(--line-strong);
  background: var(--surface-2);
}
.choice input {
  margin: 3px 0 0;
  width: 18px;
  height: 18px;
  accent-color: var(--primary);
  flex-shrink: 0;
}
.choice:has(input:checked) {
  border-color: var(--primary);
  background: var(--primary-wash);
}
.choice:has(input:focus-visible) {
  box-shadow: var(--focus-ring);
}
.choices {
  display: grid;
  gap: var(--s2);
}

/* Chips: removable active-filter tokens and toggle pills. */
.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 36px;
  padding: 0 6px 0 12px;
  border-radius: 999px;
  border: 1px solid color-mix(in srgb, var(--primary) 40%, var(--line));
  background: var(--primary-wash);
  color: var(--ink);
  font-size: var(--fs-sm);
  font-weight: 600;
}
.chip button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 28px;
  height: 28px;
  border: 0;
  border-radius: 50%;
  background: transparent;
  color: var(--ink-2);
}
.chip button:hover {
  background: color-mix(in srgb, var(--primary) 16%, transparent);
}
.pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 36px;
  padding: 0 12px;
  border-radius: 999px;
  border: 1px solid var(--line-strong);
  background: var(--surface);
  font-size: var(--fs-sm);
  font-weight: 600;
  color: var(--ink);
}
.pill[aria-pressed='true'] {
  background: var(--primary);
  border-color: var(--primary);
  color: var(--on-primary);
}

/* Segmented control (language switcher and similar). */
.seg {
  display: inline-flex;
  align-items: center;
  gap: 2px;
  padding: 3px;
  border-radius: 999px;
  background: var(--surface-2);
  border: 1px solid var(--line);
}
.seg__icon {
  margin: 0 4px 0 6px;
  color: var(--muted);
}
.seg__btn {
  min-height: 36px;
  min-width: 44px;
  padding: 0 12px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  font-size: var(--fs-sm);
  font-weight: 600;
  color: var(--ink-2);
}
.seg__btn[aria-pressed='true'] {
  background: var(--surface);
  color: var(--ink);
  box-shadow: var(--shadow-1), inset 0 0 0 1px var(--line-strong);
}
.seg__btn:focus-visible {
  outline: none;
  box-shadow: var(--focus-ring);
}
.seg__short {
  display: none;
}

/* ------------------------------------------------------------------ Table */
.table-wrap {
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
  background: var(--surface);
}
.table {
  font-size: var(--fs-sm);
}
.table caption {
  text-align: left;
  padding: var(--s3) var(--s4);
  font-weight: 650;
  color: var(--ink);
}
.table th,
.table td {
  padding: 10px var(--s4);
  text-align: left;
  vertical-align: middle;
  border-top: 1px solid var(--line);
}
.table thead th {
  background: var(--surface-2);
  font-size: var(--fs-xs);
  font-weight: 650;
  color: var(--ink-2);
  letter-spacing: 0.02em;
  border-top: 0;
  white-space: nowrap;
}
.table .num {
  text-align: right;
  white-space: nowrap;
}
.table tbody tr:hover {
  background: var(--surface-2);
}
.table tfoot td,
.table tfoot th {
  font-weight: 700;
  border-top: 2px solid var(--line-strong);
}

/* ------------------------------------------------------- Dialog and sheet */
dialog.dlg {
  padding: 0;
  border: 0;
  border-radius: var(--radius-lg);
  background: var(--surface);
  color: var(--ink);
  box-shadow: var(--shadow-3);
  width: min(640px, calc(100vw - 32px));
  max-height: min(88vh, 900px);
  overflow: hidden;
}
dialog.dlg[open] {
  display: flex;
  flex-direction: column;
  animation: yes-fade-up var(--dur) var(--ease);
}
dialog.dlg::backdrop {
  background: var(--overlay);
}
.dlg__head {
  display: flex;
  align-items: flex-start;
  gap: var(--s3);
  padding: var(--s4) var(--s4) var(--s3) var(--s5);
  border-bottom: 1px solid var(--line);
}
.dlg__title {
  font-size: var(--fs-lg);
  margin: 6px 0 0;
  flex: 1;
  min-width: 0;
}
.dlg__body {
  padding: var(--s5);
  overflow-y: auto;
  overscroll-behavior: contain;
  flex: 1;
}
.dlg__foot {
  display: flex;
  flex-wrap: wrap;
  gap: var(--s2);
  justify-content: flex-end;
  padding: var(--s3) var(--s5);
  border-top: 1px solid var(--line);
  background: var(--surface);
}
/* Small screens: dialogs become full-screen sheets. */
@media (max-width: 719px) {
  dialog.dlg {
    width: 100vw;
    max-width: 100vw;
    height: 100%;
    max-height: 100%;
    margin: 0;
    border-radius: 0;
  }
  .dlg__foot {
    justify-content: stretch;
  }
  .dlg__foot .btn {
    flex: 1;
  }
}

/* --------------------------------------------------------------- Steps */
.steps {
  display: flex;
  gap: var(--s2);
  list-style: none;
  margin: 0 0 var(--s5);
  padding: 0;
  font-size: var(--fs-xs);
  color: var(--muted);
}
.steps li {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.steps li::before {
  content: '';
  height: 4px;
  border-radius: 2px;
  background: var(--line);
}
.steps li[aria-current='step'] {
  color: var(--ink);
  font-weight: 650;
}
.steps li[aria-current='step']::before,
.steps li.is-done::before {
  background: var(--primary);
}

/* -------------------------------------------------------- Empty states */
.empty {
  text-align: center;
  padding: var(--s10) var(--s4);
  color: var(--ink-2);
}
.empty .icon {
  color: var(--muted);
  margin-bottom: var(--s2);
}
.empty h3 {
  margin-bottom: var(--s2);
}

/* ---------------------------------------------------------------- Toast */
.toast {
  position: fixed;
  left: 50%;
  bottom: var(--s6);
  transform: translate(-50%, 16px);
  background: var(--ink);
  color: var(--surface);
  padding: var(--s3) var(--s5);
  border-radius: 999px;
  font-size: var(--fs-sm);
  font-weight: 600;
  box-shadow: var(--shadow-2);
  opacity: 0;
  pointer-events: none;
  transition: opacity var(--dur) var(--ease), transform var(--dur) var(--ease);
  z-index: 2000;
  max-width: calc(100vw - 32px);
  text-align: center;
}
.toast.is-visible {
  opacity: 1;
  transform: translate(-50%, 0);
}

/* ------------------------------------------------------- Check lists */
.checks {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: var(--s2);
}
.check {
  display: flex;
  gap: var(--s2);
  align-items: flex-start;
  font-size: var(--fs-sm);
}
.check--ok .icon {
  color: var(--ok);
}
.check--fail .icon {
  color: var(--danger);
}
.check__state {
  margin-left: auto;
  font-weight: 650;
  font-size: var(--fs-xs);
  color: var(--ink-2);
  white-space: nowrap;
}

/* Highlight for search matches and linked rows. */
mark,
.hl {
  background: color-mix(in srgb, var(--accent) 38%, transparent);
  color: inherit;
  border-radius: 2px;
  padding: 0 1px;
}
.is-flash {
  animation: yes-highlight 1.6s var(--ease);
}

/* Forced colours: keep boundaries and states visible. */
@media (forced-colors: active) {
  .btn,
  .chip,
  .pill,
  .status,
  .tag,
  .demo-badge,
  .card,
  .notice {
    border: 1px solid CanvasText;
  }
  .pill[aria-pressed='true'],
  .seg__btn[aria-pressed='true'] {
    outline: 2px solid Highlight;
  }
}

/* ---- css/03-shell.css ---- */
/* Shell: masthead, navigation, views, footer, withheld state. */
.masthead {
  position: sticky;
  top: 0;
  z-index: 100;
  background: color-mix(in srgb, var(--surface) 94%, transparent);
  backdrop-filter: saturate(1.4) blur(8px);
  -webkit-backdrop-filter: saturate(1.4) blur(8px);
  border-bottom: 1px solid var(--line);
}
.masthead__bar {
  display: flex;
  align-items: center;
  gap: var(--s3);
  min-height: 60px;
  flex-wrap: wrap;
  padding-block: var(--s2);
}
.brand {
  display: inline-flex;
  align-items: center;
  gap: var(--s3);
  color: var(--ink);
  text-decoration: none;
  border-radius: var(--radius-sm);
  min-height: 44px;
}
.brand__logo {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  height: 36px;
  min-width: 52px;
  padding: 0 10px;
  border-radius: 8px;
  background: var(--primary);
  color: var(--on-primary);
  font-weight: 800;
  letter-spacing: 0.04em;
  font-size: 1.05rem;
}
.brand__logo--placeholder {
  outline: 1px dashed color-mix(in srgb, var(--primary) 60%, transparent);
  outline-offset: 2px;
}
.brand__text {
  display: flex;
  flex-direction: column;
  line-height: 1.2;
}
.brand__title {
  font-weight: 700;
  font-size: var(--fs-sm);
}
.brand__period {
  font-size: var(--fs-xs);
  color: var(--muted);
}
.masthead__actions {
  display: flex;
  align-items: center;
  gap: var(--s2);
  margin-left: auto;
}
.btn--ask {
  min-height: 42px;
}
.nav {
  border-top: 1px solid var(--line);
}
.nav__list {
  display: flex;
  gap: var(--s1);
  list-style: none;
  margin-block: 0;
  overflow-x: auto;
  scrollbar-width: none;
}
.nav__list::-webkit-scrollbar {
  display: none;
}
.nav__link {
  display: inline-flex;
  align-items: center;
  min-height: 46px;
  padding: 0 var(--s3);
  color: var(--ink-2);
  font-weight: 600;
  font-size: var(--fs-sm);
  text-decoration: none;
  border-bottom: 3px solid transparent;
  white-space: nowrap;
  border-radius: 0;
}
.nav__link:hover {
  color: var(--ink);
  border-bottom-color: var(--line-strong);
}
.nav__link[aria-current='page'] {
  color: var(--ink);
  border-bottom-color: var(--primary);
}
.nav__link:focus-visible {
  outline-offset: -4px;
}

@media (max-width: 719px) {
  .masthead__bar {
    gap: var(--s2);
  }
  .demo-badge {
    order: 3;
    flex-basis: 100%;
    justify-content: center;
    margin-top: -2px;
  }
  .seg__long {
    display: none;
  }
  .seg__short {
    display: inline;
  }
  .seg__icon {
    display: none;
  }
  .btn--ask .btn__label {
    display: none;
  }
  .btn--ask {
    width: 44px;
    padding: 0;
    border-radius: 50%;
  }
  .nav__list {
    justify-content: space-between;
    gap: 0;
  }
  .nav__link {
    padding: 0 var(--s2);
  }
}
@media (max-width: 359px) {
  .brand__text {
    display: none;
  }
}

/* Views */
main {
  display: block;
  padding-bottom: var(--s16);
  min-height: 60vh;
}
main:focus {
  outline: none;
}
.view {
  animation: yes-fade-up var(--dur) var(--ease);
}

/* Assistant open on wide screens: content reflows so the drawer never covers it. */
@media (min-width: 1100px) {
  html.assistant-docked #app {
    padding-right: var(--drawer-w);
  }
}

/* Withheld (reconciliation failure) */
#integrity-root:empty {
  display: none;
}
html.is-withheld main,
html.is-withheld .masthead .nav,
html.is-withheld .btn--ask {
  display: none;
}
.withheld {
  padding-block: var(--s8);
  max-width: 760px;
}
.withheld__title {
  font-size: var(--fs-lg);
}
.withheld__checks-title {
  margin-top: var(--s6);
}

/* Footer */
.site-footer {
  border-top: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink-2);
  font-size: var(--fs-xs);
  padding-block: var(--s6) var(--s8);
}
.footer__inner p {
  max-width: 90ch;
}
.footer__demo {
  display: flex;
  gap: var(--s2);
  align-items: flex-start;
}
.footer__powered {
  color: var(--muted);
}

/* No-JS fallback summary */
.noscript-summary {
  max-width: 760px;
  margin: var(--s8) auto;
  padding: 0 var(--gutter);
}

/* ---- css/90-print.css ---- */
/*
 * Print: the screen UI is replaced by the statement-of-record view rendered into
 * #print-root (owned by the Help/record module). A demo watermark repeats on
 * every page in the showcase.
 */
#print-root {
  display: none;
}
@media print {
  :root {
    color-scheme: light;
    --bg: #fff;
    --surface: #fff;
    --surface-2: #f2f2f2;
    --ink: #000;
    --ink-2: #222;
    --muted: #444;
    --line: #bbb;
    --line-strong: #888;
  }
  @page {
    margin: 16mm 14mm;
  }
  html,
  body {
    background: #fff !important;
    color: #000 !important;
    font-size: 10.5pt;
  }
  #app,
  .skip-link,
  dialog,
  .toast,
  #assistant-root,
  [data-print-hide] {
    display: none !important;
  }
  #print-root {
    display: block !important;
  }
  html.is-withheld #print-root {
    display: none !important;
  }
  html.is-withheld #app {
    display: block !important;
  }
  .print-watermark {
    position: fixed;
    inset: 0;
    display: flex !important;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    z-index: 0;
  }
  .print-watermark span {
    transform: rotate(-30deg);
    font-size: 54pt;
    font-weight: 800;
    color: rgba(0, 0, 0, 0.07);
    white-space: nowrap;
    letter-spacing: 0.06em;
  }
  a {
    color: #000;
    text-decoration: none;
  }
  table {
    page-break-inside: auto;
  }
  tr {
    page-break-inside: avoid;
  }
  thead {
    display: table-header-group;
  }
  h1,
  h2,
  h3 {
    page-break-after: avoid;
  }
}

/*
 * Statement arithmetic and reconciliation (PRD 5.2, 6).
 *
 * Pure functions over the canonical data object: no DOM access, so the same code
 * runs in the browser and in the build's release gate (build.mjs).
 * All totals, the balance journey, the running-balance chart and the
 * explanations derive from these functions — nothing is typed in twice.
 */
(function (root) {
  'use strict';
  var YES = (root.YES = root.YES || {});

  function d() {
    return YES.data;
  }
  function time(iso) {
    return iso ? Date.parse(iso) : NaN;
  }
  function chrono(a, b) {
    return time(a.postedAt) - time(b.postedAt) || a.seq - b.seq;
  }
  function sum(list) {
    var s = 0;
    for (var i = 0; i < list.length; i++) s += list[i].amount;
    return s;
  }
  function ids(list) {
    return list.map(function (t) {
      return t.id;
    });
  }

  var calc = (YES.calc = {});

  calc.asset = function (data) {
    data = data || d();
    return data.assets[data.statement.assetId];
  };

  /** Every transaction (posted and not posted), in canonical data order. */
  calc.all = function (data) {
    return (data || d()).transactions.slice();
  };

  /** Posted transactions in this statement, chronological (postedAt, then seq). */
  calc.posted = function (data) {
    return (data || d()).transactions
      .filter(function (t) {
        return t.status === 'posted';
      })
      .sort(chrono);
  };

  /** Transactions not included in the statement balance (pending, failed, unknown). */
  calc.notInBalance = function (data) {
    return (data || d()).transactions.filter(function (t) {
      return t.status !== 'posted';
    });
  };

  calc.tx = function (id, data) {
    var list = (data || d()).transactions;
    for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
    return null;
  };

  calc.inBalance = function (t) {
    return t.status === 'posted';
  };

  calc.categoryOf = function (t, data) {
    var cats = (data || d()).categories;
    for (var i = 0; i < cats.length; i++) if (cats[i].types.indexOf(t.type) !== -1) return cats[i].id;
    return null;
  };

  /** Balance-journey categories with totals derived from posted transactions. */
  calc.categories = function (data) {
    data = data || d();
    var posted = calc.posted(data);
    return data.categories.map(function (c) {
      var rows = posted.filter(function (t) {
        return c.types.indexOf(t.type) !== -1;
      });
      return { id: c.id, group: c.group, types: c.types.slice(), total: sum(rows), count: rows.length, txIds: ids(rows) };
    });
  };

  calc.category = function (id, data) {
    var cats = calc.categories(data);
    for (var i = 0; i < cats.length; i++) if (cats[i].id === id) return cats[i];
    return null;
  };

  /** Incoming / outgoing groups (PRD 4: opening → incoming → outgoing & fees → closing). */
  calc.groups = function (data) {
    var cats = calc.categories(data);
    function group(g) {
      var members = cats.filter(function (c) {
        return c.group === g;
      });
      var txIds = [];
      members.forEach(function (c) {
        txIds = txIds.concat(c.txIds);
      });
      return {
        id: g,
        categories: members.map(function (c) {
          return c.id;
        }),
        total: members.reduce(function (s, c) {
          return s + c.total;
        }, 0),
        count: txIds.length,
        txIds: txIds
      };
    }
    return { incoming: group('incoming'), outgoing: group('outgoing') };
  };

  /**
   * Bridge steps: opening, each category as a floating delta, closing.
   * `start`/`end` are the running levels the step moves between.
   */
  calc.journey = function (data) {
    data = data || d();
    var s = data.statement;
    var level = s.opening;
    var steps = [{ id: 'opening', kind: 'total', value: s.opening, start: 0, end: s.opening, txIds: [], count: 0 }];

/* ---- js/05-shell.js ---- */
/*
 * Shell: masthead (brand slot, period, demo badge, language switcher, Ask YES),
 * section navigation, footer, document title and the withheld-statement state
 * shown when reconciliation fails (PRD 4, 5.1, 5.2).
 */
(function (root) {
  'use strict';
  var YES = root.YES;
  var ui = YES.ui;
  var t = YES.t;
  var esc = ui.esc;
  var doc = root.document;

  function logoHtml() {
    var slot = YES.config.slots.YES_LOGO;
    if (slot.svg) return '<span class="brand__logo" role="img" aria-label="' + esc(t('brand.logoAlt')) + '">' + slot.svg + '</span>';
    return (
      '<span class="brand__logo brand__logo--placeholder" role="img" aria-label="' +
      esc(t('brand.logoAlt')) +
      '" title="' +
      esc(t('brand.logoPlaceholder')) +
      '" data-slot="YES_LOGO">' +
      esc(slot.text) +
      '</span>'
    );
  }

  function periodLabel() {
    var s = YES.data.statement;
    return YES.fmt.date(s.periodEnd, 'monthYear');
  }

  function renderMasthead() {
    var lang = YES.i18n.lang;
    var view = YES.state.view;
    var langButtons = YES.config.languages
      .map(function (l) {
        return (
          '<button type="button" class="seg__btn" lang="' +
          l +
          '" data-lang="' +
          l +
          '" data-fk="lang-' +
          l +
          '" aria-pressed="' +
          (l === lang) +
          '"><span class="seg__long">' +
          esc(t('lang.' + l)) +
          '</span><span class="seg__short" aria-hidden="true">' +
          l.toUpperCase() +
          '</span></button>'
        );
      })
      .join('');

    var navItems = YES.VIEWS.map(function (v) {
      return (
        '<li><a class="nav__link" href="#/' +
        v +
        '" data-nav="' +
        v +
        '" data-fk="nav-' +
        v +
        '"' +
        (v === view ? ' aria-current="page"' : '') +
        '>' +
        esc(t('nav.' + v)) +
        '</a></li>'
      );
    }).join('');

    var html =
      '<div class="masthead__bar container">' +
      '<a class="brand" href="#/overview" data-nav="overview" data-fk="brand">' +
      logoHtml() +
      '<span class="brand__text"><span class="brand__title">' +
      esc(t('brand.statement')) +
      '</span><span class="brand__period">' +
      esc(periodLabel()) +
      '</span></span></a>' +
      (YES.config.demo
        ? '<span class="demo-badge" title="' + esc(t('demo.badgeLong')) + '">' + ui.icon('info', { size: 16 }) + '<span>' + esc(t('demo.badge')) + '</span></span>'
        : '') +
      '<div class="masthead__actions">' +
      '<div class="seg" role="group" aria-label="' +
      esc(t('lang.label')) +
      '">' +
      ui.icon('globe', { size: 18, cls: 'seg__icon' }) +
      langButtons +
      '</div>' +
      '<button type="button" class="btn btn--ai btn--ask" data-ask data-fk="ask-yes" aria-label="' +
      esc(t('ask.buttonLong')) +
      '">' +
      ui.icon('chat', { size: 18 }) +
      '<span class="btn__label">' +
      esc(t('ask.button')) +
      '</span></button>' +
      '</div></div>' +
      '<nav class="nav" aria-label="' +
      esc(t('nav.label')) +
      '"><ul class="nav__list container">' +
      navItems +
      '</ul></nav>';
    ui.render(doc.getElementById('masthead'), html);
  }

  function renderFooter() {
    var s = YES.data.statement;
    var html =
      '<div class="container footer__inner">' +
      '<p class="footer__ids"><span>' +
      esc(t('footer.statementId', { id: s.id, version: s.version })) +
      '</span> · <span>' +
      esc(t('footer.generated', { date: YES.fmt.date(s.generatedAt, 'datetime') + ' ' + YES.fmt.tz(s.generatedAt) })) +
      '</span></p>' +
      '<p class="footer__disclosures" data-slot="DISCLOSURES"><strong>' +
      esc(t('footer.disclosures')) +
      ':</strong> ' +
      esc(YES.L(YES.config.slots.DISCLOSURES)) +
      '</p>' +
      (YES.config.demo ? '<p class="footer__demo">' + ui.icon('info', { size: 16 }) + ' ' + esc(t('footer.demo')) + '</p>' : '') +
      '<p class="footer__powered">' +
      esc(t('footer.poweredBy')) +
      '</p>' +
      '</div>';
    ui.render(doc.getElementById('site-footer'), html);
  }

  function updateTitle() {
    doc.title = t('app.docTitle', { view: t('nav.' + YES.state.view), period: periodLabel() });
  }

  function syncNav() {
    ui.$$('.nav__link').forEach(function (a) {
      if (a.getAttribute('data-nav') === YES.state.view) a.setAttribute('aria-current', 'page');
      else a.removeAttribute('aria-current');
    });
    updateTitle();
  }

  /** Withheld state: shown instead of the statement when reconciliation fails. */
  function renderWithheld(result) {
    var simulated = !!YES.data.simulated;
    var checks = result.checks
      .map(function (c) {
        return (
          '<li class="check ' +
          (c.ok ? 'check--ok' : 'check--fail') +
          '">' +
          ui.icon(c.ok ? 'check-circle' : 'alert', { size: 18 }) +
          '<span>' +
          esc(t('check.' + c.id)) +
          '</span><span class="check__state">' +
          esc(t(c.ok ? 'integrity.pass' : 'integrity.fail')) +
          '</span></li>'
        );
      })
      .join('');
    var html =
      '<section class="withheld container" aria-labelledby="withheld-title">' +
      '<div class="notice notice--critical" role="alert">' +
      ui.icon('alert', { size: 24 }) +
      '<div><h1 id="withheld-title" class="withheld__title" tabindex="-1">' +
      esc(t('integrity.title')) +
      '</h1><p>' +
      esc(t('integrity.body')) +
      '</p>' +
      (simulated ? '<p><strong>' + esc(t('integrity.simulated')) + '</strong></p>' : '') +
      '</div></div>' +
      '<h2 class="withheld__checks-title">' +
      esc(t('integrity.checks')) +
      '</h2><ul class="checks">' +
      checks +
      '</ul>' +
      (simulated ? '<p><a class="btn btn--primary" href="#/overview" data-integrity-return data-fk="integrity-return">' + esc(t('integrity.return')) + '</a></p>' : '') +
      '</section>';
    ui.render(doc.getElementById('integrity-root'), html);
  }

  YES.shell = {
    renderWithheld: renderWithheld,
    updateTitle: updateTitle
  };

  YES.register({
    name: 'shell',
    init: function () {
      var mast = doc.getElementById('masthead');
      ui.delegate(mast, 'click', '[data-lang]', function (e, b) {
        var l = b.getAttribute('data-lang');
        if (l !== YES.i18n.lang) YES.setLang(l);
      });
      ui.delegate(mast, 'click', '[data-ask]', function (e, b) {
        YES.assistant.open({ topic: 'general', trigger: b });
      });
      doc.addEventListener('click', function (e) {
        var r = e.target.closest && e.target.closest('[data-integrity-return]');
        if (!r) return;
        e.preventDefault();
        root.location.hash = '#/overview';
        root.location.reload();
      });
      YES.on('view', syncNav);
      this.render();
    },
    render: function () {
      renderMasthead();
      renderFooter();
      updateTitle();
      if (YES.integrity && !YES.integrity.ok) renderWithheld(YES.integrity);
    }
  });
})(window);

/* ---- js/06-userway.js ---- */
/*
 * Accessibility widget integration point (PRD 2, 5.8, 8 Phase A).
 *
 * Loads the official UserWay widget exactly once, online only, with the account
 * ID from YES.config.userway. The statement itself is the accessibility
 * implementation; the widget only augments it. If the widget cannot load
 * (offline, blocked, timed out) the status becomes 'unavailable' and nothing
 * else changes. If the hosting viewer (e.g. InfoSlips) already provides
 * UserWay, the loader detects it and does not add a second launcher.
 *
 * Status values: idle | disabled | host | loading | loaded | unavailable
 */
(function (root) {
  'use strict';
  var YES = root.YES;
  var doc = root.document;

  var uw = (YES.userway = { status: 'idle' });

  function set(status) {
    uw.status = status;
    YES.emit('userway', status);
  }

  function hostProvidesWidget() {
    var scripts = doc.querySelectorAll('script[src]');
    for (var i = 0; i < scripts.length; i++) {
      if (/userway\.org/i.test(scripts[i].getAttribute('src')) && !scripts[i].hasAttribute('data-yes-userway')) return true;
    }
    return !!(root.UserWay || root._userway_config);
  }

  uw.load = function () {
    var cfg = YES.config.userway;
    if (!cfg || !cfg.enabled || !cfg.accountId || !cfg.src) return set('disabled');
    if (doc.querySelector('script[data-yes-userway]')) return; // already requested once
    if (hostProvidesWidget()) return set('host');
    if (root.navigator && root.navigator.onLine === false) return set('unavailable');
    if (root.location && root.location.protocol !== 'https:' && root.location.protocol !== 'http:' && root.location.protocol !== 'file:') return set('unavailable');

    set('loading');
    var s = doc.createElement('script');
    s.src = cfg.src;
    s.async = true;
    s.setAttribute('data-account', cfg.accountId);
    s.setAttribute('data-yes-userway', '');
    var timer = setTimeout(function () {
      if (uw.status === 'loading') set('unavailable');
    }, cfg.timeoutMs || 8000);
    s.onload = function () {
      clearTimeout(timer);
      set('loaded');
    };
    s.onerror = function () {
      clearTimeout(timer);
      set('unavailable');
    };
    doc.body.appendChild(s);
  };

  root.addEventListener('online', function () {
    if (uw.status === 'unavailable' && !doc.querySelector('script[data-yes-userway]')) uw.load();
  });
})(window);

/* ---- js/99-boot.js ---- */
/*
 * Boot: apply brand slots, choose language, run the release gate, initialise
 * modules, resolve the initial route and load connected enhancements.
 */
(function (root) {
  'use strict';
  var YES = root.YES;
  var doc = root.document;

  function applyBrandSlots() {
    var s = YES.config.slots;
    var r = doc.documentElement.style;
    r.setProperty('--yes-primary-slot', s.YES_PRIMARY);
    r.setProperty('--yes-primary-dark-slot', s.YES_PRIMARY_DARK || s.YES_PRIMARY);
    r.setProperty('--yes-accent-slot', s.YES_ACCENT);
    r.setProperty('--yes-font-slot', s.YES_FONT);
  }

  function initialLang() {
    var fromHash = YES.nav.current().params.lang;
    if (fromHash && YES.config.languages.indexOf(fromHash) !== -1) return fromHash;
    try {
      var stored = root.sessionStorage.getItem('yes.lang');
      if (stored && YES.config.languages.indexOf(stored) !== -1) return stored;
    } catch (e) {
      /* storage unavailable */
    }
    return YES.data.statement.language || YES.config.defaultLanguage;
  }

  function boot() {
    applyBrandSlots();

    // Showcase-only integrity preview: #/overview?simulate=mismatch
    var simulate = YES.nav.current().params.simulate;
    if (simulate === 'mismatch') YES.data = YES.calc.simulateMismatch(YES.data);

    var lang = initialLang();
    YES.i18n.lang = lang;
    YES.state.lang = lang;
    doc.documentElement.lang = lang;

    // Release gate: a statement whose totals do not reconcile is withheld.
    YES.integrity = YES.calc.reconcile(YES.data);
    var withheld = !YES.integrity.ok && YES.config.reconciliation.blockOnMismatch;
    doc.documentElement.classList.toggle('is-withheld', withheld);
    if (withheld && root.console) console[YES.data.simulated ? 'warn' : 'error']('[YES] statement withheld: reconciliation failed', YES.integrity);

    YES.modules().forEach(function (m) {
      if (withheld && m.name !== 'shell') return;
      if (m.init) {
        try {
          m.init();
        } catch (e) {
          if (root.console) console.error('[YES] init failed in module ' + m.name, e);
        }
      }
    });

    if (withheld) {
      var h = doc.getElementById('withheld-title');
      if (h) h.focus();
    } else {
      YES.nav.apply();
    }

    doc.documentElement.classList.add('is-ready');
    YES.ready = true;
    YES.emit('ready');

    // Re-boot when the integrity preview is toggled through the address bar.
    root.addEventListener('hashchange', function () {
      var now = YES.nav.current().params.simulate || null;
      if ((now || null) !== (simulate || null)) root.location.reload();
    });

    // Connected enhancement: accessibility widget (online only, never blocking).
    YES.userway.load();
  }

  if (doc.readyState === 'loading') doc.addEventListener('DOMContentLoaded', boot);
  else boot();
})(window);
